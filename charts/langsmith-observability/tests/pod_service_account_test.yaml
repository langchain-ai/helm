suite: Pod ServiceAccount token automount configuration
templates:
  - mimir/config-map.yaml
  - mimir/stateful-set.yaml
tests:
  - it: configures token automount on the Mimir workload
    template: mimir/stateful-set.yaml
    set:
      mimir.enabled: true
      mimir.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
