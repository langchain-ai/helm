apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "connector.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
    {{- with .Values.connector.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "connector.annotations" . | nindent 4 }}
    {{- with .Values.connector.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.connector.replicas }}
  selector:
    matchLabels:
      {{- include "connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the connector configuration changes.
        checksum/config: {{ print .Values.connector.endpoint .Values.connector.connectionId (include "connector.targetsEnv" .) | sha256sum }}
        {{- include "connector.commonPodAnnotations" . | nindent 8 }}
        {{- with .Values.connector.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "connector.labels" . | nindent 8 }}
        {{- with .Values.connector.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.connector.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "connector.serviceAccountName" . }}
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "connector.podSecurityContext" . | nindent 8 }}
      {{- include "connector.dnsConfig" . | nindent 6 }}
      containers:
        - name: connector
          image: {{ include "connector.image" . | quote }}
          imagePullPolicy: {{ .Values.images.connectorImage.pullPolicy }}
          env:
            - name: LANGSMITH_ENDPOINT
              value: {{ .Values.connector.endpoint | quote }}
            - name: LANGSMITH_CONNECTION_ID
              value: {{ .Values.connector.connectionId | quote }}
            - name: LANGSMITH_API_KEY_FILE
              value: /var/run/secrets/langsmith/api-key
            {{- if .Values.connector.targets }}
            - name: LANGSMITH_CONNECTOR_TARGETS
              value: {{ include "connector.targetsEnv" . | quote }}
            {{- end }}
            {{- with .Values.connector.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.connector.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.connector.securityContext | nindent 12 }}
          volumeMounts:
            - name: langsmith-api-key
              mountPath: /var/run/secrets/langsmith
              readOnly: true
      volumes:
        - name: langsmith-api-key
          secret:
            secretName: {{ include "connector.secretName" . }}
            items:
              - key: {{ include "connector.secretKey" . }}
                path: api-key
      {{- with .Values.connector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
