{{- if not .Values.config.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.secretsName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
  annotations:
    {{- include "connector.annotations" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.config.apiKeySecretKey }}: {{ .Values.config.apiKey | b64enc | quote }}
{{- end }}
