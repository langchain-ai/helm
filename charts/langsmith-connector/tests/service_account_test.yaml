suite: connector service account
templates:
  - connector/service-account.yaml
values:
  - common-values.yaml
tests:
  - it: creates the component service account without an automounted token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-connector-connector
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: honours a custom name and annotations
    set:
      connector.serviceAccount.name: connector-sa
      connector.serviceAccount.annotations:
        iam.gke.io/gcp-service-account: connector@example.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.name
          value: connector-sa
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: connector@example.iam.gserviceaccount.com
  - it: renders nothing when creation is disabled
    set:
      connector.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
