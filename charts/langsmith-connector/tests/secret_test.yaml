suite: connector api key secret
templates:
  - connector/secret.yaml
values:
  - common-values.yaml
tests:
  - it: creates the secret with the api key when apiKey is set
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-connector-connector
      - equal:
          path: stringData["api-key"]
          value: test-api-key

  - it: creates no secret when existingSecret is used
    set:
      connector.apiKey: ""
      connector.existingSecret: "my-langsmith"
    asserts:
      - hasDocuments:
          count: 0
