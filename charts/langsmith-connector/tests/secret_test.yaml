suite: connector api key secret
templates:
  - connector/secret.yaml
values:
  - common-values.yaml
tests:
  - it: creates the component secret with the api key under apiKeySecretKey
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-connector-connector
      - equal:
          path: data.langsmith_api_key
          value: dGVzdC1hcGkta2V5
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: RELEASE-NAME-langsmith-connector-connector

  - it: writes the api key under a custom apiKeySecretKey
    set:
      connector.apiKeySecretKey: api_key
    asserts:
      - equal:
          path: data.api_key
          value: dGVzdC1hcGkta2V5

  - it: creates no secret when existingSecretName is set
    set:
      connector.apiKey: ""
      connector.existingSecretName: "my-langsmith"
    asserts:
      - hasDocuments:
          count: 0
