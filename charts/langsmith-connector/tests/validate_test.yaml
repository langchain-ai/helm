suite: configuration validation
templates:
  - validate.yaml
tests:
  - it: fails when connectionId is empty
    set:
      config.apiKey: "k"
      config.targets.api: "https://a.internal:1"
    asserts:
      - failedTemplate:
          errorPattern: "config.connectionId is required"

  - it: fails when connectionId is not a UUID
    set:
      config.connectionId: "not-a-uuid"
      config.apiKey: "k"
      config.targets.api: "https://a.internal:1"
    asserts:
      - failedTemplate:
          errorPattern: "config.connectionId must be a UUID"

  - it: fails when neither apiKey nor existingSecretName is set
    set:
      config.connectionId: "0f7e5f1c-1b2d-4c3e-8a9b-0c1d2e3f4a5b"
      config.targets.api: "https://a.internal:1"
    asserts:
      - failedTemplate:
          errorPattern: "Set config.apiKey or config.existingSecretName"

  - it: fails when both apiKey and existingSecretName are set
    set:
      config.connectionId: "0f7e5f1c-1b2d-4c3e-8a9b-0c1d2e3f4a5b"
      config.apiKey: "k"
      config.existingSecretName: "s"
      config.targets.api: "https://a.internal:1"
    asserts:
      - failedTemplate:
          errorPattern: "Set only one of config.apiKey or config.existingSecretName"

  - it: fails when targets is empty
    set:
      config.connectionId: "0f7e5f1c-1b2d-4c3e-8a9b-0c1d2e3f4a5b"
      config.apiKey: "k"
    asserts:
      - failedTemplate:
          errorPattern: "config.targets must name at least one target"

  - it: fails when apiKeySecretKey is empty
    set:
      config.connectionId: "0f7e5f1c-1b2d-4c3e-8a9b-0c1d2e3f4a5b"
      config.existingSecretName: "s"
      config.apiKeySecretKey: ""
      config.targets.api: "x"
    asserts:
      - failedTemplate:
          errorPattern: "config.apiKeySecretKey must name the key"

  - it: renders nothing when configuration is valid
    values:
      - common-values.yaml
    asserts:
      - hasDocuments:
          count: 0
