{{- if .Values.sandboxHost.enabled }}
{{- $autoscaling := .Values.sandboxHost.autoscaling }}
{{- $hostMount := .Values.juicefs.hostMount }}
{{- $managedEnv := list
  (dict "name" "SANDBOX_X_SERVICE_AUTH_JWT_SECRET")
  (dict "name" "LANGSMITH_SANDBOX_CALLBACK_SIGNING_JWK")
  (dict "name" "LANGSMITH_SANDBOX_INTERNAL_ENDPOINT")
  (dict "name" "SANDBOX_HOST_JUICEFS_META_URL_FILE")
  (dict "name" "SANDBOX_HOST_JUICEFS_MOUNT_OPTIONS")
-}}
{{- include "langsmithSandbox.detectDuplicates" (concat $managedEnv .Values.sandboxHost.deployment.extraEnv) }}
{{- $labels := mergeOverwrite (dict "app" .Values.sandboxHost.name)
  (default dict .Values.sandboxHost.deployment.labels)
  (include "langsmithSandbox.labels" . | fromYaml)
  (dict "app.kubernetes.io/component" (include "langsmithSandbox.sandboxHostFullname" .)) }}
{{- $callbackIssuer := .Values.platform.callbackIssuer | default .Values.platform.endpoint }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langsmithSandbox.sandboxHostFullname" . }}
  namespace: {{ include "langsmithSandbox.namespace" . }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    {{- include "langsmithSandbox.annotations" . | nindent 4 }}
    {{- with .Values.sandboxHost.deployment.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "langsmithSandbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "langsmithSandbox.sandboxHostFullname" . }}
  {{- if not $autoscaling.enabled }}
  replicas: {{ .Values.sandboxHost.deployment.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
      annotations:
        {{- include "langsmithSandbox.commonPodAnnotations" . | nindent 8 }}
        checksum/juicefs-config: {{ include "langsmithSandbox.juicefsConfigSecretChecksum" . | quote }}
        {{- with .Values.sandboxHost.deployment.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- include "langsmithSandbox.podSecurityContext" (dict "Values" .Values "componentSecurityContext" .Values.sandboxHost.deployment.podSecurityContext) | nindent 8 }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "langsmithSandbox.serviceAccountName" . }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "langsmithSandbox.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: {{ include "langsmithSandbox.sandboxHostFullname" . }}
              topologyKey: kubernetes.io/hostname
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxHost.deployment.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.sandboxHost.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxHost.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandboxHost.deployment.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-host
          image: {{ include "langsmithSandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.images.sandboxHost.pullPolicy }}
          env:
            - name: LANGCHAIN_ENV
              value: "local_kubernetes"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SANDBOX_X_SERVICE_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langsmithSandbox.serviceAuthSecretName" . }}
                  key: {{ .Values.serviceAuth.secretKey }}
            {{- with .Values.serviceAuth.previousSecretKey }}
            - name: SANDBOX_X_SERVICE_AUTH_JWT_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "langsmithSandbox.serviceAuthSecretName" $ }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            - name: SANDBOX_HOST_PROXY_CA_DIR
              value: /certs
            - name: LANGSMITH_SANDBOX_CALLBACK_SIGNING_JWK
              valueFrom:
                secretKeyRef:
                  name: {{ include "langsmithSandbox.serviceAuthSecretName" . }}
                  key: {{ .Values.serviceAuth.callbackSigningJwkSecretKey }}
            - name: OAUTH_AS_ISSUER
              value: {{ $callbackIssuer | quote }}
            - name: SSRF_ALLOW_PRIVATE_IPS_CALLBACKS
              value: "true"
            - name: SANDBOX_CALLBACK_LOOPBACK_REWRITE
              value: "false"
            - name: LANGSMITH_SANDBOX_INTERNAL_ENDPOINT
              value: {{ .Values.platform.endpoint | quote }}
            - name: SANDBOX_HOST_DEPLOYMENT_NAME
              value: {{ include "langsmithSandbox.sandboxHostFullname" . | quote }}
            - name: SANDBOX_HOST_TERMINATION_GRACE_SECONDS
              value: {{ .Values.sandboxHost.deployment.terminationGracePeriodSeconds | quote }}
            - name: SANDBOX_HOST_JUICEFS_META_URL_FILE
              value: /run/secrets/juicefs/metaurl
            - name: SANDBOX_HOST_JUICEFS_MOUNT_OPTIONS
              value: {{ concat (list (printf "--cache-dir=%s" (join ":" $hostMount.cacheDirs))) $hostMount.mountOptions | toJson | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_ENABLED
              value: {{ $autoscaling.enabled | quote }}
            {{- if $autoscaling.enabled }}
            - name: SANDBOX_HOST_AUTOSCALE_MIN_REPLICAS
              value: {{ $autoscaling.minReplicas | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_MAX_REPLICAS
              value: {{ $autoscaling.maxReplicas | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_TARGET_UTILIZATION_PERCENT
              value: {{ $autoscaling.targetUtilizationPercent | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_HEADROOM_HOSTS
              value: {{ $autoscaling.headroomHosts | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_SCALE_DOWN_STABILIZATION_SECONDS
              value: {{ $autoscaling.scaleDownStabilizationSeconds | quote }}
            {{- end }}
            {{- if and .Values.customCa.existingSecretName .Values.customCa.secretKey }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/custom-ca-certificates.crt
            {{- end }}
            {{- with .Values.sandboxHost.deployment.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 19190
              hostPort: 19190
              protocol: TCP
          {{- with .Values.sandboxHost.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.sandboxHost.deployment.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.sandboxHost.deployment.resources | nindent 12 }}
          volumeMounts:
            - name: juicefs
              mountPath: /juicefs
            {{- range $index, $cacheDir := $hostMount.cacheDirs }}
            - name: juicefs-cache-{{ $index }}
              mountPath: {{ $cacheDir | quote }}
            {{- end }}
            - name: juicefs-meta
              mountPath: /run/secrets/juicefs
              readOnly: true
            - name: host-bin
              mountPath: /host-bin
            - name: proxy-ca
              mountPath: /certs
              readOnly: true
            {{- if and .Values.customCa.existingSecretName .Values.customCa.secretKey }}
            - name: langsmith-custom-ca
              mountPath: /etc/ssl/certs/custom-ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            {{- end }}
            {{- with .Values.sandboxHost.deployment.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sandboxHost.deployment.sidecars }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: juicefs
          emptyDir: {}
        {{- range $index, $cacheDir := $hostMount.cacheDirs }}
        - name: juicefs-cache-{{ $index }}
          hostPath:
            path: {{ $cacheDir | quote }}
            type: DirectoryOrCreate
        {{- end }}
        - name: juicefs-meta
          secret:
            secretName: {{ include "langsmithSandbox.juicefsConfigSecretName" . }}
            defaultMode: 0400
            items:
              - key: metaurl
                path: metaurl
        - name: proxy-ca
          secret:
            secretName: {{ include "langsmithSandbox.proxyCaSecretName" . }}
        - name: host-bin
          hostPath:
            path: /var/lib/sandbox-host
            type: DirectoryOrCreate
        {{- if and .Values.customCa.existingSecretName .Values.customCa.secretKey }}
        - name: langsmith-custom-ca
          secret:
            secretName: {{ .Values.customCa.existingSecretName }}
            items:
              - key: {{ .Values.customCa.secretKey }}
                path: ca-certificates.crt
        {{- end }}
        {{- with .Values.sandboxHost.deployment.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: {{ .Values.sandboxHost.deployment.terminationGracePeriodSeconds }}
{{- end }}
