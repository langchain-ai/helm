{{- if and .Values.sandboxHost.enabled .Values.sandboxHost.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "langsmithSandbox.serviceAccountName" . }}
  namespace: {{ include "langsmithSandbox.namespace" . }}
  labels:
    {{- include "langsmithSandbox.labels" . | nindent 4 }}
    {{- with .Values.sandboxHost.serviceAccount.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- /* Operator annotations win, then commonAnnotations, then the
  workload-identity ones the chart generates. Merging maps avoids duplicate keys. */}}
  {{- $annotations := merge (deepCopy (default dict .Values.sandboxHost.serviceAccount.annotations)) (deepCopy (default dict .Values.commonAnnotations)) (include "langsmithSandbox.workloadIdentity.serviceAccountAnnotations" . | fromYaml) }}
  {{- /* Argo CD applies waves in order and the JuiceFS formatter Job (wave -1)
  runs as this ServiceAccount, so it must exist first. An operator-set wave wins. */}}
  {{- if not (hasKey $annotations "argocd.argoproj.io/sync-wave") }}
  {{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "-2" }}
  {{- end }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.sandboxHost.serviceAccount.automountServiceAccountToken }}
{{- end }}
