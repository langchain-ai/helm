{{- if and .Values.sandboxHost.enabled .Values.sandboxHost.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "langsmithSandbox.serviceAccountName" . }}
  namespace: {{ include "langsmithSandbox.namespace" . }}
  labels:
    {{- include "langsmithSandbox.labels" . | nindent 4 }}
    {{- with .Values.sandboxHost.serviceAccount.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- /* Argo CD applies waves in order and the JuiceFS formatter Job (wave -1)
    runs as this ServiceAccount, so it must exist first. An operator-set wave wins. */}}
    {{- if not (or (hasKey (default dict .Values.sandboxHost.serviceAccount.annotations) "argocd.argoproj.io/sync-wave") (hasKey (default dict .Values.commonAnnotations) "argocd.argoproj.io/sync-wave")) }}
    argocd.argoproj.io/sync-wave: "-2"
    {{- end }}
    {{- include "langsmithSandbox.annotations" . | nindent 4 }}
    {{- with .Values.sandboxHost.serviceAccount.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.sandboxHost.serviceAccount.automountServiceAccountToken }}
{{- end }}
