{{- if .Values.sandboxHost.enabled }}
{{- $job := .Values.juicefsFormatJob }}
{{- $customCa := and .Values.config.customCa.secretName .Values.config.customCa.secretKey }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "langsmithSandbox.juicefsFormatJobName" . }}
  namespace: {{ include "langsmithSandbox.namespace" . }}
  labels:
    {{- include "langsmithSandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: juicefs-format
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
    {{- include "langsmithSandbox.annotations" . | nindent 4 }}
    {{- with $job.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      annotations:
        {{- include "langsmithSandbox.commonPodAnnotations" . | nindent 8 }}
        {{- with $job.annotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /* The formatter's own labels win, then the operator's, then workload identity's. */}}
      {{- $podLabels := mergeOverwrite (include "langsmithSandbox.workloadIdentity.podLabels" . | fromYaml) (deepCopy (default dict $job.labels)) (include "langsmithSandbox.selectorLabels" . | fromYaml) (dict "app.kubernetes.io/component" "juicefs-format") }}
      labels:
        {{- toYaml $podLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ include "langsmithSandbox.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.sandboxHost.serviceAccount.automountServiceAccountToken }}
      {{- if eq ((.Values.workloadIdentity | default dict).provider | default "") "gcp" }}
      {{- /* GKE Workload Identity does not serve host-network pods and sandbox-host
      runs on the host network, so the formatter joins it there: both pods then
      authenticate as the node pool's service account. */}}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- include "langsmithSandbox.dnsConfig" . | nindent 6 }}
      restartPolicy: Never
      securityContext:
        {{- include "langsmithSandbox.podSecurityContext" (dict "Values" .Values "componentSecurityContext" $job.podSecurityContext) | nindent 8 }}
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.sandboxHost.deployment.nodeSelector $job.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $job.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.sandboxHost.deployment.tolerations $job.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: juicefs-format
          image: {{ include "langsmithSandbox.image" . | quote }}
          imagePullPolicy: {{ .Values.images.sandboxHostImage.pullPolicy }}
          command: ["/opt/sandbox-host/bin/sandbox-host"]
          args: ["--internal-juicefs-format"]
          env:
            - name: LANGCHAIN_ENV
              value: "local_kubernetes"
            {{- with .Values.juicefs.redis.iamAuthProvider }}
            - name: SANDBOX_HOST_JUICEFS_REDIS_IAM_AUTH_PROVIDER
              value: {{ . | quote }}
            {{- end }}
            {{- /* Like sandbox-host, so the formatter verifies a Redis signed by a private CA. */}}
            {{- if $customCa }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/custom-ca-certificates.crt
            {{- end }}
          securityContext:
            {{- toYaml $job.securityContext | nindent 12 }}
          resources:
            {{- toYaml $job.resources | nindent 12 }}
          volumeMounts:
            - name: juicefs-config
              mountPath: /run/secrets/juicefs
              readOnly: true
            {{- if $customCa }}
            - name: langsmith-custom-ca
              mountPath: /etc/ssl/certs/custom-ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            {{- end }}
      volumes:
        - name: juicefs-config
          secret:
            secretName: {{ include "langsmithSandbox.juicefsConfigSecretName" . }}
            defaultMode: 0400
        {{- if $customCa }}
        - name: langsmith-custom-ca
          secret:
            secretName: {{ .Values.config.customCa.secretName }}
            items:
              - key: {{ .Values.config.customCa.secretKey }}
                path: ca-certificates.crt
        {{- end }}
{{- end }}
