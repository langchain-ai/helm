{{- if and .Values.sandboxHost.enabled (not .Values.juicefs.existingSecretName) }}
{{- include "langsmithSandbox.render.juicefsConfig" (dict
  "name" (include "langsmithSandbox.juicefsConfigSecretName" .)
  "namespace" (include "langsmithSandbox.namespace" .)
  "labels" (include "langsmithSandbox.labels" . | fromYaml)
  "annotations" (mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "-2") (include "langsmithSandbox.annotations" . | fromYaml))
  "data" (include "langsmithSandbox.juicefsConfigSecretData" .)) }}
{{- end }}
