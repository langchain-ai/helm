suite: separate-cluster sandbox runtime
templates:
  - validate.yaml
  - proxy-ca.yaml
  - juicefs-config.yaml
  - juicefs-format-job.yaml
  - sandbox-host-service-account.yaml
  - sandbox-host-rbac.yaml
  - sandbox-host-deployment.yaml
  - sandbox-host-pdb.yaml
  - sandbox-host-service.yaml
  - sandbox-host-ingress.yaml
tests:
  - it: should render no runtime resources when disabled
    set:
      sandboxHost.enabled: false
    templates:
      - proxy-ca.yaml
      - juicefs-config.yaml
      - juicefs-format-job.yaml
      - sandbox-host-service-account.yaml
      - sandbox-host-rbac.yaml
      - sandbox-host-deployment.yaml
      - sandbox-host-pdb.yaml
      - sandbox-host-service.yaml
      - sandbox-host-ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure a host to report to the external LangSmith API
    values:
      - ./values/enabled.yaml
    template: sandbox-host-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-sandbox-sandbox-host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_SANDBOX_INTERNAL_ENDPOINT
            value: https://langsmith.example.com/api
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH_AS_ISSUER
            value: https://langsmith.example.com/api
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_X_SERVICE_AUTH_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: langsmith-sandbox-runtime
                key: api_key_salt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_SANDBOX_CALLBACK_SIGNING_JWK
            valueFrom:
              secretKeyRef:
                name: langsmith-sandbox-runtime
                key: sandbox_callback_signing_jwk
      - equal:
          path: spec.template.spec.hostNetwork
          value: true
      - equal:
          path: spec.template.spec.containers[0].ports[0].hostPort
          value: 19190

  - it: should keep host ingress disabled by default
    values:
      - ./values/enabled.yaml
    templates:
      - sandbox-host-service.yaml
      - sandbox-host-ingress.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the authenticated host pool through an optional ingress
    values:
      - ./values/enabled.yaml
    set:
      sandboxHost.ingress.enabled: true
      sandboxHost.ingress.ingressClassName: nginx
      sandboxHost.ingress.host: sandbox-host.example.com
    templates:
      - sandbox-host-service.yaml
      - sandbox-host-ingress.yaml
    asserts:
      - isKind:
          of: Service
        template: sandbox-host-service.yaml
      - equal:
          path: spec.ports[0].port
          value: 19190
        template: sandbox-host-service.yaml
      - isKind:
          of: Ingress
        template: sandbox-host-ingress.yaml
      - equal:
          path: spec.rules[0].host
          value: sandbox-host.example.com
        template: sandbox-host-ingress.yaml
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-langsmith-sandbox-sandbox-host
        template: sandbox-host-ingress.yaml

  - it: should use the existing JuiceFS Secret for formatting and mounting
    values:
      - ./values/enabled.yaml
    set:
      juicefs.redis.metaURL: ""
      juicefs.bucket: ""
      juicefs.existingSecretName: external-juicefs-config
    templates:
      - juicefs-config.yaml
      - juicefs-format-job.yaml
      - sandbox-host-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: juicefs-config.yaml
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: external-juicefs-config
        template: juicefs-format-job.yaml
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: external-juicefs-config
        template: sandbox-host-deployment.yaml

  - it: should grant the elected host access only to its Deployment
    values:
      - ./values/enabled.yaml
    template: sandbox-host-rbac.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments"]
            resourceNames: ["RELEASE-NAME-langsmith-sandbox-sandbox-host"]
            verbs: ["get", "patch"]

  - it: should set LANGCHAIN_ENV directly on the formatter
    values:
      - ./values/enabled.yaml
    template: juicefs-format-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: LANGCHAIN_ENV
              value: local_kubernetes

  - it: should require a minimal existing service-auth Secret
    values:
      - ./values/enabled.yaml
    set:
      serviceAuth.existingSecretName: ""
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "serviceAuth.existingSecretName is required when sandboxHost.enabled is true."

  - it: should require an absolute platform endpoint
    values:
      - ./values/enabled.yaml
    set:
      platform.endpoint: /api
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "platform.endpoint must be an absolute HTTP(S) URL without a query string or fragment."

  - it: should require the public API prefix on the platform endpoint
    values:
      - ./values/enabled.yaml
    set:
      platform.endpoint: https://langsmith.example.com
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "platform.endpoint must include the externally reachable LangSmith /api prefix."

  # The sandbox IRSA role trusts one ServiceAccount by name (Terraform:
  # sandbox_service_account_name, written into these values by init-values.sh).
  # If this stops being honored, IRSA fails at runtime with a WebIdentityErr
  # that points nowhere near the chart, so pin the behavior here.
  - it: should name the sandbox-host ServiceAccount from serviceAccount.name
    values:
      - ./values/enabled.yaml
    set:
      sandboxHost.serviceAccount.name: sandbox-host
    templates:
      - sandbox-host-service-account.yaml
      - sandbox-host-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: sandbox-host
        template: sandbox-host-service-account.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: sandbox-host
        template: sandbox-host-deployment.yaml

  - it: should fall back to the release-prefixed ServiceAccount name when unset
    values:
      - ./values/enabled.yaml
    template: sandbox-host-service-account.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-sandbox-sandbox-host

  - it: should render the optional sandbox-host disruption budget
    values:
      - ./values/enabled.yaml
    set:
      sandboxHost.pdb.enabled: true
    template: sandbox-host-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: should require KVM host scheduling
    values:
      - ./values/no-scheduling.yaml
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "sandboxHost.deployment.nodeSelector is required: sandbox-host must be pinned to KVM-capable nodes."
  # helm.sh/chart is a label value and therefore capped at 63 characters. Pin the
  # truncation with a version whose build metadata pushes the untruncated string
  # to 66, so dropping the helper fails here rather than at apply time.
  - it: should truncate the chart label to a valid length
    chart:
      version: 0.1.0-rc.1+build.20260101120000.abcdef0123456789
    values:
      - ./values/enabled.yaml
    template: sandbox-host-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: langsmith-sandbox-0.1.0-rc.1_build.20260101120000.abcdef0123456

  - it: should apply commonDnsConfig to sandbox-host and the JuiceFS formatter
    values:
      - ./values/enabled.yaml
    templates:
      - sandbox-host-deployment.yaml
      - juicefs-format-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.dnsConfig.options[0].name
          value: ndots
      - equal:
          path: spec.template.spec.dnsConfig.options[0].value
          value: "4"

  - it: should omit dnsConfig when commonDnsConfig is cleared
    values:
      - ./values/enabled.yaml
    set:
      commonDnsConfig: null
    templates:
      - sandbox-host-deployment.yaml
      - juicefs-format-job.yaml
    asserts:
      - notExists:
          path: spec.template.spec.dnsConfig

  # A Job's spec.template is immutable, so a dnsConfig change has to move the
  # formatter's name or the next upgrade fails on the immutable field instead of
  # rolling a fresh formatter. These two pin the default hash and the changed
  # hash, so dropping dnsConfig from the name inputs collapses them and fails
  # here. The chart version is pinned because it is itself a hash input —
  # otherwise every release bump would invalidate both expectations.
  - it: should name the JuiceFS formatter from its pod spec inputs
    chart:
      version: 0.0.0-test
    values:
      - ./values/enabled.yaml
    template: juicefs-format-job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-sandbox-juicefs-format-138047bf

  - it: should rename the JuiceFS formatter when commonDnsConfig changes
    chart:
      version: 0.0.0-test
    values:
      - ./values/enabled.yaml
    set:
      commonDnsConfig:
        options:
          - name: ndots
            value: "1"
    template: juicefs-format-job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-sandbox-juicefs-format-67cdd3d1

  - it: should add commonEnv, volumes, mounts, and init containers to sandbox-host
    values:
      - ./values/enabled.yaml
    set:
      commonEnv:
        - name: HTTPS_PROXY
          value: http://proxy.internal:3128
      commonVolumes:
        - name: extra
          emptyDir: {}
      commonVolumeMounts:
        - name: extra
          mountPath: /extra
      commonInitContainers:
        - name: warm
          image: busybox
    template: sandbox-host-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://proxy.internal:3128
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra
            mountPath: /extra
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: warm

  - it: should reject a commonEnv var that collides with a chart-managed one
    values:
      - ./values/enabled.yaml
    set:
      commonEnv:
        - name: LANGSMITH_SANDBOX_INTERNAL_ENDPOINT
          value: http://elsewhere
    template: sandbox-host-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "Duplicate keys detected: [LANGSMITH_SANDBOX_INTERNAL_ENDPOINT]"
