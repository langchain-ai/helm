# Golden renders of the langsmith-sandbox chart: every object it renders is
# snapshotted for a matrix of values, with document counts so a missing
# object fails too. Update the snapshots with
# `helm unittest -u charts/langsmith-sandbox` only for an intended change.
suite: runtime chart golden renders
templates:
  - juicefs-config.yaml
  - juicefs-format-job.yaml
  - proxy-ca.yaml
  - sandbox-host-deployment.yaml
  - sandbox-host-ingress.yaml
  - sandbox-host-pdb.yaml
  - sandbox-host-rbac.yaml
  - sandbox-host-service-account.yaml
  - sandbox-host-service.yaml
tests:
  - it: default
    chart:
      version: 0.0.0-golden
      appVersion: 0.0.0-golden
    release:
      name: langsmith-sandbox
      namespace: langsmith-sandbox
    values:
      - ./values/enabled.yaml
      - ./values/golden/base.yaml
      - ./values/golden/default.yaml
    asserts:
      - matchSnapshot: {}
      - hasDocuments:
          count: 1
        template: juicefs-config.yaml
      - hasDocuments:
          count: 1
        template: juicefs-format-job.yaml
      - hasDocuments:
          count: 0
        template: proxy-ca.yaml
      - hasDocuments:
          count: 1
        template: sandbox-host-deployment.yaml
      - hasDocuments:
          count: 0
        template: sandbox-host-ingress.yaml
      - hasDocuments:
          count: 0
        template: sandbox-host-pdb.yaml
      - hasDocuments:
          count: 2
        template: sandbox-host-rbac.yaml
      - hasDocuments:
          count: 1
        template: sandbox-host-service-account.yaml
      - hasDocuments:
          count: 0
        template: sandbox-host-service.yaml

  - it: eks
