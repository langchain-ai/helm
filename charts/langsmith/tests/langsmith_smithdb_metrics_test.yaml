suite: test smithdb self-hosted metrics scrape
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - queue/deployment.yaml
  - smithdb/metrics-services.yaml
values:
  - ./values/smithdb-enabled.yaml
tests:
  - it: should put a headless metrics service in front of each cluster component
    template: smithdb/metrics-services.yaml
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-smithdb-query-metrics
        documentIndex: 0
      - equal:
          path: spec.ports[0]
          value:
            name: http
            port: 8060
            targetPort: http
            protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: RELEASE-NAME-langsmith-smithdb-query
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-smithdb-compaction-worker-metrics
        documentIndex: 3
      - equal:
          path: spec.ports[0].port
          value: 9000
        documentIndex: 3

  - it: should add a metrics service for an enabled query service
    template: smithdb/metrics-services.yaml
    set:
      smithdb.runRules.enabled: true
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-smithdb-run-rules-metrics
        documentIndex: 1

  - it: should put one metrics service in front of the unified workload
    template: smithdb/metrics-services.yaml
    set:
      smithdb.topology: unified
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-smithdb-metrics
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: RELEASE-NAME-langsmith-smithdb

  - it: should point the queue at every cluster component metrics service
    template: queue/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_METRICS_ENDPOINTS
            value: '{"cluster-manager":"http://RELEASE-NAME-langsmith-smithdb-cluster-manager-metrics.NAMESPACE.svc.cluster.local:8090","compaction":"http://RELEASE-NAME-langsmith-smithdb-compaction-metrics.NAMESPACE.svc.cluster.local:8070","compaction-worker":"http://RELEASE-NAME-langsmith-smithdb-compaction-worker-metrics.NAMESPACE.svc.cluster.local:9000","ingestion":"http://RELEASE-NAME-langsmith-smithdb-ingestion-metrics.NAMESPACE.svc.cluster.local:8050","query":"http://RELEASE-NAME-langsmith-smithdb-query-metrics.NAMESPACE.svc.cluster.local:8060"}'

  - it: should point the queue at the unified metrics service
    template: queue/deployment.yaml
    set:
      smithdb.topology: unified
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_METRICS_ENDPOINTS
            value: '{"unified":"http://RELEASE-NAME-langsmith-smithdb-metrics.NAMESPACE.svc.cluster.local:8060"}'

  - it: should enable the SmithDB metrics cron when SmithDB and telemetry are on
    template: config-map.yaml
    asserts:
      - equal:
          path: data.ENABLE_SMITHDB_METRICS_CRON
          value: "true"

  - it: should disable the SmithDB metrics cron when telemetry metrics are off
    template: config-map.yaml
    set:
      config.telemetry.metrics: false
    asserts:
      - equal:
          path: data.ENABLE_SMITHDB_METRICS_CRON
          value: "false"

  - it: should render no metrics services, endpoints, or cron when SmithDB is disabled
    set:
      smithdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: smithdb/metrics-services.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: SMITHDB_METRICS_ENDPOINTS
        template: queue/deployment.yaml
      - equal:
          path: data.ENABLE_SMITHDB_METRICS_CRON
          value: "false"
        template: config-map.yaml
