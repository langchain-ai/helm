suite: engine sandbox validation override
templates:
  - templates/**/*.yaml
set:
  config.existingSecretName: langsmith-secrets
  config.oauth.enabled: true
  config.authType: oauth
  config.hostname: https://langsmith.example.com
  engine.enabled: true
  engine.sandboxTenantId: 11111111-2222-3333-4444-555555555555
  engine.skipSandboxValidation: true
tests:
  - it: should accept external sandboxes without chart-managed host configuration
    template: templates/validate.yaml
    asserts:
      - notFailedTemplate: {}

  - it: should require sandboxes when the override is disabled
    template: templates/validate.yaml
    set:
      engine.skipSandboxValidation: false
    asserts:
      - failedTemplate:
          errorMessage: "engine.enabled is true but sandboxes.enabled is false: every Engine run executes in a sandbox, so Engine cannot run without them."

  - it: should still validate chart-managed sandbox configuration
    template: templates/validate.yaml
    set:
      sandboxes.enabled: true
      images.sandboxHostImage.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: "images.sandboxHostImage.tag is required when sandboxes.enabled is true."

  - it: should still reject a loopback hostname
    template: templates/validate.yaml
    set:
      config.hostname: localhost
    asserts:
      - failedTemplate:
          errorMessage: 'engine.enabled is true and config.hostname is "localhost", which a sandbox cannot reach: it must be the externally reachable LangSmith address.'

  - it: should not deploy sandbox infrastructure
    templates:
      - templates/sandboxes/sandbox-host-deployment.yaml
      - templates/sandboxes/sandbox-host-rbac.yaml
      - templates/sandboxes/sandbox-host-service-account.yaml
      - templates/sandboxes/sandbox-host-pdb.yaml
      - templates/sandboxes/juicefs-config.yaml
      - templates/sandboxes/juicefs-format-job.yaml
      - templates/sandboxes/proxy-ca.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure the local sandbox API and workspace on both Engine pods
    templates:
      - templates/agent-features/insights/api-server/deployment.yaml
      - templates/agent-features/insights/queue/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ISSUES_AGENT_SANDBOX_TENANT_ID
            value: 11111111-2222-3333-4444-555555555555
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_SANDBOX_ENDPOINT
            value: http://RELEASE-NAME-langsmith-platform-backend.NAMESPACE.svc.cluster.local:1986/v2/sandboxes
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ISSUES_AGENT_X_SERVICE_AUTH_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: langsmith-secrets
                key: engine_usage_signing_secret
                optional: false

  - it: should configure an absolute Engine callback without sandbox quota defaults
    template: templates/config-map.yaml
    set:
      config.basePath: langsmith
    asserts:
      - equal:
          path: data.LANGCHAIN_PLATFORM_ENDPOINT
          value: https://langsmith.example.com/langsmith/api
      - notExists:
          path: data.DEFAULT_ORG_FEATURE_MAX_SANDBOXES
