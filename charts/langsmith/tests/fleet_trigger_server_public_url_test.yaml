suite: Fleet Trigger Server public URLs
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - agent-features/fleet/trigger-server/deployment.yaml
tests:
  - it: derives absolute public URLs from the configured hostname
    template: agent-features/fleet/trigger-server/deployment.yaml
    set:
      config.agentBuilder.enabled: true
      config.hostname: langsmith.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_URL
            value: https://langsmith.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRIGGER_SERVER_PUBLIC_URL
            value: https://langsmith.example.com/v1

  - it: uses the frontend hostname for Slack redirects and the API hostname for triggers
    template: agent-features/fleet/trigger-server/deployment.yaml
    set:
      config.agentBuilder.enabled: true
      config.hostname: api.langsmith.example.com
      config.frontendHostname: app.langsmith.example.com
      config.basePath: langsmith
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_URL
            value: https://app.langsmith.example.com/langsmith
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRIGGER_SERVER_PUBLIC_URL
            value: https://api.langsmith.example.com/langsmith/v1

  - it: supports loopback HTTP URLs for local development
    template: agent-features/fleet/trigger-server/deployment.yaml
    set:
      config.agentBuilder.enabled: true
      config.hostname: localhost:18080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_URL
            value: http://localhost:18080
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRIGGER_SERVER_PUBLIC_URL
            value: http://localhost:18080/v1

  - it: omits public URLs when no public hostname is configured
    template: agent-features/fleet/trigger-server/deployment.yaml
    set:
      config.agentBuilder.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_URL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRIGGER_SERVER_PUBLIC_URL
          any: true

  - it: allows an operator to override dynamically assigned public URLs
    template: agent-features/fleet/trigger-server/deployment.yaml
    set:
      config.agentBuilder.enabled: true
      config.hostname: langsmith.example.com
      fleetTriggerServer.deployment.extraEnv:
        - name: LANGSMITH_URL
          value: https://ui.dynamic.example.com
        - name: TRIGGER_SERVER_PUBLIC_URL
          value: https://triggers.dynamic.example.com/v1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_URL
            value: https://ui.dynamic.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TRIGGER_SERVER_PUBLIC_URL
            value: https://triggers.dynamic.example.com/v1
