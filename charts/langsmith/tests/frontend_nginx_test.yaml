suite: frontend nginx routing and request buffering
templates:
  - frontend/config-map.yaml
tests:
  - it: routes MDA API requests to the platform backend without response buffering
    release:
      name: langsmith
      namespace: mda-test
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/mda/ \{\s+rewrite /api/v1/mda/\(\.\*\) /v1/mda/\$1\s+break;[^}]*proxy_buffering off;[^}]*proxy_cache off;[^}]*proxy_pass http://langsmith-platform-backend\.mda-test\.svc\.cluster\.local:1986;'

  - it: strips the base path and routes MDA requests to the configured platform service
    release:
      name: langsmith
      namespace: ignored-namespace
    set:
      config.basePath: langsmith/dev
      namespace: agents
      clusterDomain: custom.local
      platformBackend.name: custom-platform
      platformBackend.service.port: 8080
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/dev/api/v1/mda/ \{\s+rewrite /langsmith/dev/api/v1/mda/\(\.\*\) /v1/mda/\$1\s+break;[^}]*proxy_buffering off;[^}]*proxy_cache off;[^}]*proxy_pass http://langsmith-custom-platform\.agents\.svc\.custom\.local:8080;'

  - it: disables request buffering once at server scope so every route inherits it
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
      # inherited from the server block; never repeated per location
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location [^\n]*\{[^}]*proxy_request_buffering'

  - it: disables request buffering when a basePath is configured
    set:
      config.basePath: "langsmith"
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location [^\n]*\{[^}]*proxy_request_buffering'

  - it: disables request buffering on the ssl server block
    set:
      frontend.ssl.enabled: true
      frontend.ssl.certificatePath: /certs/tls.crt
      frontend.ssl.keyPath: /certs/tls.key
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
