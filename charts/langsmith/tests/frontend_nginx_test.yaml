suite: frontend nginx routing and request buffering
templates:
  - frontend/config-map.yaml
tests:
  - it: routes the trajectory prefix to platform-backend without a base path
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/trajectory \{\s*rewrite \^/api/v1/trajectory\(\.\*\)\$ /v1/trajectory\$1 break;[^}]*proxy_pass http://[^}]*-platform-backend\.'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /api/v1/trajectory/navigation'

  - it: routes the trajectory prefix to platform-backend with a base path
    set:
      config.basePath: langsmith
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/api/v1/trajectory \{\s*rewrite \^/langsmith/api/v1/trajectory\(\.\*\)\$ /v1/trajectory\$1 break;[^}]*proxy_pass http://[^}]*-platform-backend\.'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location = /langsmith/api/v1/trajectory/navigation'

  - it: disables request buffering once at server scope so every route inherits it
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
      # inherited from the server block; never repeated per location
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location [^\n]*\{[^}]*proxy_request_buffering'

  - it: disables request buffering when a basePath is configured
    set:
      config.basePath: "langsmith"
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: 'location [^\n]*\{[^}]*proxy_request_buffering'

  - it: disables request buffering on the ssl server block
    set:
      frontend.ssl.enabled: true
      frontend.ssl.certificatePath: /certs/tls.crt
      frontend.ssl.keyPath: /certs/tls.key
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_send_timeout \d+;\n\s*proxy_request_buffering off;'
