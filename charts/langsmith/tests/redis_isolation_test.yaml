suite: agent Redis isolation
templates:
  - validate.yaml
set:
  config.existingSecretName: langsmith-secrets
  config.authType: mixed
  config.oauth.enabled: true
  config.initialOrgAdminEmail: admin@example.com
  fleet.enabled: true
  fleet.redis.external.enabled: true
  insights.enabled: true
  engineInsightsAgent.redis.external.enabled: true
  polly.enabled: true
  polly.redis.external.enabled: true
tests:
  - it: rejects LangSmith and an agent product sharing the default logical database
    set:
      redis.external.enabled: true
      redis.external.connectionUrl: redis://cache.example.com:6379
      fleet.redis.external.connectionUrl: redis://cache.example.com:6379/
      engineInsightsAgent.redis.external.connectionUrl: redis://cache.example.com:6379/2
      polly.redis.external.connectionUrl: redis://cache.example.com:6379/3
    asserts:
      - failedTemplate:
          errorMessage: langsmith and fleet must not use the same Redis logical database. Configure a different database number or Redis instance.

  - it: accepts a separate logical database for each product
    set:
      fleet.redis.external.connectionUrl: redis://cache.example.com:6379/1
      engineInsightsAgent.redis.external.connectionUrl: redis://cache.example.com:6379/2
      polly.redis.external.connectionUrl: redis://cache.example.com:6379/3
    asserts:
      - hasDocuments:
          count: 0

  - it: ignores credentials when detecting a shared database
    set:
      fleet.redis.external.connectionUrl: redis://fleet:password-one@cache.example.com:6379/2
      engineInsightsAgent.redis.external.connectionUrl: redis://insights:password-two@cache.example.com:6379/2
      polly.redis.external.connectionUrl: redis://cache.example.com:6379/3
    asserts:
      - failedTemplate:
          errorMessage: fleet and insights must not use the same Redis logical database. Configure a different database number or Redis instance.
