suite: agent platform migration
set:
  config.existingSecretName: langsmith-secrets
  config.skipValidation: true
tests:
  - it: enables migration on the adhoc queue by default
    template: templates/config-map.yaml
    asserts:
      - equal:
          path: data.AGENT_PLATFORM_MIGRATION_ROLLOUT_ENABLED
          value: "true"
      - equal:
          path: data.AGENT_PLATFORM_MIGRATION_QUEUE
          value: adhoc

  - it: leaves migration off when disabled
    template: templates/config-map.yaml
    set:
      config.agentMigration.enabled: false
    asserts:
      - notExists:
          path: data.AGENT_PLATFORM_MIGRATION_ROLLOUT_ENABLED
      - notExists:
          path: data.AGENT_PLATFORM_MIGRATION_QUEUE
