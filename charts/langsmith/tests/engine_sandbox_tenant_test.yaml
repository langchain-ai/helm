suite: engine sandbox tenant env
templates:
  - templates/backend/deployment.yaml
  - templates/agent-features/insights/api-server/deployment.yaml
  - templates/agent-features/insights/queue/deployment.yaml
  # Pulled in by langsmith.checksumAnnotations on the backend.
  - templates/config-map.yaml
  - templates/frontend/config-map.yaml
  - templates/secrets.yaml
  - templates/redis/secrets.yaml
  - templates/postgres/secrets.yaml
  - templates/clickhouse/secrets.yaml
tests:
  - it: should pass the sandbox tenant to both engine pods
    templates:
      - templates/agent-features/insights/api-server/deployment.yaml
      - templates/agent-features/insights/queue/deployment.yaml
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      engine.enabled: true
      engine.encryptionKey: test-key
      engine.intelligenceBaseUrl: https://beacon.aws.langchain.com/intelligence
      engine.sandboxTenantId: 11111111-2222-3333-4444-555555555555
      images.engineInsightsAgentImage.repository: docker.io/langchain/langsmith-insights-engine
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ISSUES_AGENT_SANDBOX_TENANT_ID
            value: 11111111-2222-3333-4444-555555555555

  - it: should omit the sandbox tenant when engine is disabled
    values:
      - ./values/sandboxes-enabled.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ISSUES_AGENT_SANDBOX_TENANT_ID
            value: ""

  - it: should configure the backend deletion guard when engine is enabled
    template: templates/backend/deployment.yaml
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      engine.enabled: true
      engine.encryptionKey: test-key
      engine.intelligenceBaseUrl: https://beacon.aws.langchain.com/intelligence
      engine.sandboxTenantId: 11111111-2222-3333-4444-555555555555
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_HOSTED_ENGINE_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENGINE_SANDBOX_TENANT_ID
            value: 11111111-2222-3333-4444-555555555555

  - it: should leave the backend deletion guard disabled when engine is disabled
    template: templates/backend/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SELF_HOSTED_ENGINE_ENABLED
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENGINE_SANDBOX_TENANT_ID
            value: ""
