suite: WAL batching preconditions
templates:
  - validate.yaml
values:
  - ./values/smithdb-enabled.yaml
set:
  config.existingSecretName: "langsmith-secrets"
  clickhouse.enabled: false
tests:
  - it: passes when the WAL is enabled with its preconditions met
    set:
      platformBackend.walBatching.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: requires ClickHouse ingestion to be off
    set:
      platformBackend.walBatching.enabled: true
      clickhouse.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "platformBackend.walBatching.enabled requires ClickHouse ingestion to be off: set clickhouse.enabled to false."

  - it: accepts GCS blob storage
    set:
      platformBackend.walBatching.enabled: true
      config.blobStorage.external.enabled: true
      config.blobStorage.engine: "gcs"
      config.blobStorage.bucketName: "bucket"
    asserts:
      - notFailedTemplate: {}

  - it: requires S3 or GCS blob storage
    set:
      platformBackend.walBatching.enabled: true
      config.blobStorage.external.enabled: true
      config.blobStorage.engine: "Azure"
      config.blobStorage.azureStorageContainerName: "container"
    asserts:
      - failedTemplate:
          errorMessage: "platformBackend.walBatching.enabled requires S3 or GCS blob storage: set config.blobStorage.engine to S3 or GCS (S3-compatible services and the bundled RustFS are fine)."

  - it: requires workers to match the multi-tenant setting
    set:
      platformBackend.walBatching.enabled: true
      ingestQueue.walWorker.multiTenantEnabled: true
    asserts:
      - failedTemplate:
          errorMessage: "ingestQueue.walWorker.multiTenantEnabled must equal platformBackend.walBatching.multiTenant.enabled: the workers need the plan_s3_batch handler for multi-tenant batches."

  - it: rejects zonal batching, which needs a separate zone-worker deployment
    set:
      platformBackend.walBatching.enabled: true
      platformBackend.walBatching.zone: "us-east-1a"
    asserts:
      - failedTemplate:
          errorMessage: "Zonal WAL batching is not supported by this chart: remove platformBackend.walBatching.zone/zonalBucket and ingestQueue.walWorker.zone/zoneWorkerOnly/zonalBucket."

  - it: does not validate WAL settings while the WAL is off
    set:
      platformBackend.walBatching.zone: "us-east-1a"
    asserts:
      - notFailedTemplate: {}
