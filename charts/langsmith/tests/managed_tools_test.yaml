suite: managed tools
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - platform-backend/deployment.yaml
tests:
  - it: embeds managed tools in the platform backend
    template: platform-backend/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_TOOLS_EMBEDDED
            value: "true"

  - it: entitles every organization
    template: config-map.yaml
    asserts:
      - equal:
          path: data.DEFAULT_ORG_FEATURE_LMT_ENABLED
          value: "true"

  - it: points at the tool server for built-in tools without the trigger server
    template: config-map.yaml
    set:
      fleet.enabled: true
      fleetTriggerServer.enabled: false
    asserts:
      - matchRegex:
          path: data.MCP_SERVER_URL
          pattern: '^http://.*-fleet-tool-server\..*:1989$'
      - notExists:
          path: data.TRIGGER_SERVER_ENDPOINT

  - it: leaves the built-in tools URL unset when the tool server is not deployed
    template: config-map.yaml
    set:
      fleet.enabled: true
      fleetToolServer.enabled: false
      fleetTriggerServer.enabled: false
    asserts:
      - notExists:
          path: data.MCP_SERVER_URL

  - it: routes managed tools requests to the platform backend
    template: frontend/config-map.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/managed-tools/ \{\s*rewrite /api/v1/managed-tools/\(\.\*\) /v1/managed-tools/\$1\s+break;[^}]*proxy_buffering off;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/agent-policies \{\s*rewrite \^/api/v1/agent-policies\(\.\*\)\$ /v1/agent-policies\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'

  - it: routes managed tools requests under a base path
    template: frontend/config-map.yaml
    set:
      config.basePath: langsmith
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/api/v1/managed-tools/ \{\s*rewrite /langsmith/api/v1/managed-tools/\(\.\*\) /v1/managed-tools/\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/api/v1/agent-policies \{\s*rewrite \^/langsmith/api/v1/agent-policies\(\.\*\)\$ /v1/agent-policies\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
