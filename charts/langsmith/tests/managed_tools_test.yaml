suite: managed tools
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - platform-backend/deployment.yaml
  - agent-features/fleet/tool-server/*.yaml
  - agent-features/fleet/api-server/deployment.yaml
  - agent-features/fleet/queue/deployment.yaml
  - agent-features/fleet/trigger-server/deployment.yaml
tests:
  - it: embeds managed tools in the platform backend
    template: platform-backend/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_TOOLS_EMBEDDED
            value: "true"

  - it: entitles every organization
    template: config-map.yaml
    asserts:
      - equal:
          path: data.DEFAULT_ORG_FEATURE_LMT_ENABLED
          value: "true"

  - it: points at the tool server for built-in tools without the trigger server
    template: config-map.yaml
    set:
      fleet.enabled: true
      fleetTriggerServer.enabled: false
    asserts:
      - matchRegex:
          path: data.MCP_SERVER_URL
          pattern: '^http://.*-fleet-tool-server\..*:1989$'
      - notExists:
          path: data.TRIGGER_SERVER_ENDPOINT

  - it: leaves the built-in tools URL unset when the tool server is not deployed
    template: config-map.yaml
    set:
      fleet.enabled: true
      fleetToolServer.enabled: false
      fleetTriggerServer.enabled: false
    asserts:
      - notExists:
          path: data.MCP_SERVER_URL

  - it: deploys built-ins independently without starting Fleet
    set:
      managedTools.builtins.enabled: true
      fleet.enabled: false
      config.agentBuilder.enabled: false
      fleetToolServer.autoscaling.enabled: true
      fleetToolServer.pdb.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/deployment.yaml
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/service.yaml
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/service-account.yaml
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/hpa.yaml
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/pdb.yaml
      - matchRegex:
          path: data.MCP_SERVER_URL
          pattern: '^http://.*-fleet-tool-server\..*:1989$'
        template: config-map.yaml
      - hasDocuments:
          count: 0
        template: agent-features/fleet/api-server/deployment.yaml
      - hasDocuments:
          count: 0
        template: agent-features/fleet/queue/deployment.yaml
      - hasDocuments:
          count: 0
        template: agent-features/fleet/trigger-server/deployment.yaml

  - it: keeps built-in deployment opt-in without Fleet
    asserts:
      - hasDocuments:
          count: 0
        template: agent-features/fleet/tool-server/deployment.yaml
      - notExists:
          path: data.MCP_SERVER_URL
        template: config-map.yaml

  - it: preserves legacy Agent Builder built-ins
    set:
      config.agentBuilder.enabled: true
    asserts:
      - hasDocuments:
          count: 1
        template: agent-features/fleet/tool-server/deployment.yaml
      - exists:
          path: data.MCP_SERVER_URL
        template: config-map.yaml

  - it: honors the tool server off switch even with built-ins and Fleet enabled
    set:
      managedTools.builtins.enabled: true
      fleet.enabled: true
      fleetToolServer.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: agent-features/fleet/tool-server/deployment.yaml
      - notExists:
          path: data.MCP_SERVER_URL
        template: config-map.yaml

  - it: routes managed tools requests to the platform backend
    template: frontend/config-map.yaml
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/managed-tools/ \{\s*rewrite /api/v1/managed-tools/\(\.\*\) /v1/managed-tools/\$1\s+break;[^}]*proxy_buffering off;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /api/v1/agent-policies \{\s*rewrite \^/api/v1/agent-policies\(\.\*\)\$ /v1/agent-policies\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'

  - it: routes managed tools requests under a base path
    template: frontend/config-map.yaml
    set:
      config.basePath: langsmith
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/api/v1/managed-tools/ \{\s*rewrite /langsmith/api/v1/managed-tools/\(\.\*\) /v1/managed-tools/\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'location /langsmith/api/v1/agent-policies \{\s*rewrite \^/langsmith/api/v1/agent-policies\(\.\*\)\$ /v1/agent-policies\$1\s+break;[^}]*proxy_pass http://[^}]*-platform-backend\.[^}]*:1986;'
