suite: fleet egress proxy
templates:
  - agent-features/fleet/api-server/deployment.yaml
  - agent-features/fleet/queue/deployment.yaml
  - agent-features/fleet/tool-server/deployment.yaml
  - agent-features/fleet/trigger-server/deployment.yaml
  - secrets.yaml
  - config-map.yaml
  - frontend/config-map.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
set:
  config.skipValidation: true
  fleet.enabled: true
tests:
  - it: should set no proxy env by default
    set:
      config.customCa.secretName: corp-ca
      config.customCa.secretKey: ca.crt
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
          any: true
        template: agent-features/fleet/api-server/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
          any: true
        template: agent-features/fleet/tool-server/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REQUESTS_CA_BUNDLE
          any: true
        template: agent-features/fleet/tool-server/deployment.yaml

  - it: should route every Fleet pod through the proxy
    set:
      fleet.egressProxy.url: http://proxy.corp.internal:3128
      fleet.egressProxy.noProxy:
        - git.corp.internal
        - .corp.internal
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              configMapKeyRef:
                name: RELEASE-NAME-langsmith-config
                key: FLEET_EGRESS_PROXY_URL
        template: agent-features/fleet/api-server/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              configMapKeyRef:
                name: RELEASE-NAME-langsmith-config
                key: FLEET_EGRESS_PROXY_URL
        template: agent-features/fleet/queue/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              configMapKeyRef:
                name: RELEASE-NAME-langsmith-config
                key: FLEET_EGRESS_PROXY_URL
        template: agent-features/fleet/tool-server/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            valueFrom:
              configMapKeyRef:
                name: RELEASE-NAME-langsmith-config
                key: FLEET_EGRESS_PROXY_URL
        template: agent-features/fleet/trigger-server/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local,git.corp.internal,.corp.internal
        template: agent-features/fleet/api-server/deployment.yaml
      - equal:
          path: data.FLEET_EGRESS_PROXY_URL
          value: http://proxy.corp.internal:3128
        template: config-map.yaml

  - it: should keep the install's own hostname off the proxy
    set:
      config.hostname: https://langsmith.corp.example:8443
      fleet.egressProxy.url: http://proxy.corp.internal:3128
    template: agent-features/fleet/api-server/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: localhost,127.0.0.1,.svc.cluster.local,langsmith.corp.example

  - it: should leave the proxy URL out of the ConfigMap by default
    template: config-map.yaml
    asserts:
      - notExists:
          path: data.FLEET_EGRESS_PROXY_URL

  - it: should point requests and httplib2 at the custom CA when a proxy is set
    set:
      fleet.egressProxy.url: http://proxy.corp.internal:3128
      config.customCa.secretName: corp-ca
      config.customCa.secretKey: ca.crt
    template: agent-features/fleet/tool-server/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REQUESTS_CA_BUNDLE
            value: /etc/ssl/certs/custom-ca-certificates.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPLIB2_CA_CERTS
            value: /etc/ssl/certs/custom-ca-certificates.crt

  - it: should leave the CA bundle env unset without config.customCa
    set:
      fleet.egressProxy.url: http://proxy.corp.internal:3128
    template: agent-features/fleet/tool-server/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REQUESTS_CA_BUNDLE
          any: true
