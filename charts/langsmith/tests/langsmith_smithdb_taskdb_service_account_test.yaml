suite: SmithDB taskdb Postgres ServiceAccount
templates:
  - smithdb/taskdb-postgres-service-account.yaml
  - smithdb/taskdb-postgres-statefulset.yaml
release:
  name: test
set:
  smithdb.enabled: true
  smithdb.langsmith.migration.enabled: true
  smithdb.migration.taskdb.postgres.enabled: true
  smithdb.migration.taskdb.postgres.auth.password: taskdb-password
tests:
  - it: creates a dedicated ServiceAccount by default and uses it on the pod
    asserts:
      - isKind:
          of: ServiceAccount
        template: smithdb/taskdb-postgres-service-account.yaml
      - matchRegex:
          path: metadata.name
          pattern: -smithdb-taskdb-postgres$
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: automountServiceAccountToken
          value: true
        template: smithdb/taskdb-postgres-service-account.yaml
      - matchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: -smithdb-taskdb-postgres$
        template: smithdb/taskdb-postgres-statefulset.yaml

  - it: does not reuse the SmithDB ServiceAccount
    asserts:
      - notMatchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: -smithdb$
        template: smithdb/taskdb-postgres-statefulset.yaml

  - it: applies name, labels, annotations, and token automount to the created ServiceAccount
    set:
      smithdb.migration.taskdb.postgres.serviceAccount.name: custom-taskdb
      smithdb.migration.taskdb.postgres.serviceAccount.labels:
        team: data
      smithdb.migration.taskdb.postgres.serviceAccount.annotations:
        example.com/owner: data
      smithdb.migration.taskdb.postgres.statefulSet.automountServiceAccountToken: false
    asserts:
      - equal:
          path: metadata.name
          value: custom-taskdb
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: metadata.labels.team
          value: data
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: data
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-taskdb
        template: smithdb/taskdb-postgres-statefulset.yaml

  - it: uses an existing ServiceAccount when create is false
    set:
      smithdb.migration.taskdb.postgres.serviceAccount.create: false
      smithdb.migration.taskdb.postgres.serviceAccount.name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: smithdb/taskdb-postgres-statefulset.yaml

  - it: falls back to the default ServiceAccount when create is false and no name is set
    set:
      smithdb.migration.taskdb.postgres.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: smithdb/taskdb-postgres-service-account.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
        template: smithdb/taskdb-postgres-statefulset.yaml

  - it: does not render the ServiceAccount when taskdb is external
    set:
      smithdb.migration.taskdb.postgres.external.enabled: true
      smithdb.migration.taskdb.postgres.external.host: taskdb.example.com
      smithdb.migration.taskdb.postgres.external.password: taskdb-password
    asserts:
      - hasDocuments:
          count: 0
        template: smithdb/taskdb-postgres-service-account.yaml

  - it: does not render the ServiceAccount when SmithDB migration is disabled
    set:
      smithdb.langsmith.migration.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: smithdb/taskdb-postgres-service-account.yaml
