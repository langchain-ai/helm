suite: sandbox install notes
templates:
  - NOTES.txt
tests:
  - it: should tell installs with an external runtime what to run next
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.external.enabled: true
      sandboxes.serviceAuth.secretKey: sandbox_service_auth_secret
      config.hostname: langsmith.example.com
    asserts:
      - matchRegexRaw:
          pattern: Sandboxes use an external runtime
      - matchRegexRaw:
          pattern: "key sandbox_service_auth_secret"

  - it: should not mention separate clusters otherwise
    values:
      - ./values/sandboxes-enabled.yaml
    asserts:
      - notMatchRegexRaw:
          pattern: Sandboxes use an external runtime
  - it: should tell an install without its own sandbox cluster to register one
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.ownCluster.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: "sandboxes.ownCluster.enabled is false, so this install runs no sandbox cluster of its own\\."

  - it: should not mention an own cluster note by default
    values:
      - ./values/sandboxes-enabled.yaml
    asserts:
      - notMatchRegexRaw:
          pattern: runs no sandbox cluster of its own
