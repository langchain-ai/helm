suite: config.disableSecretEnvVars drops Secret-backed env entries
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - backend/deployment.yaml
  - queue/deployment.yaml
  - ingest-queue/deployment.yaml
  - platform-backend/deployment.yaml
  - clickhouse/stateful-set.yaml
  # config-map.yaml is loaded so the StatefulSet's checksum/config `include` resolves.
  - clickhouse/config-map.yaml
  - backend/postgres-migrations.yaml
  - backend/clickhouse-migrations.yaml
  - backend/backfill-check.yaml
  - backend/auth-bootstrap.yaml
  - frontend/deployment.yaml
  - host-backend/deployment.yaml
  - listener/deployment.yaml
tests:
  - it: keeps Secret-backed env entries by default
    templates:
      - backend/deployment.yaml
      - queue/deployment.yaml
      - ingest-queue/deployment.yaml
      - platform-backend/deployment.yaml
      - clickhouse/stateful-set.yaml
      - backend/postgres-migrations.yaml
      - backend/clickhouse-migrations.yaml
      - backend/backfill-check.yaml
      - backend/auth-bootstrap.yaml
    asserts:
      - exists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef)]

  - it: keeps the backend's plain-value env entries and drops the Secret-backed ones
    template: backend/deployment.yaml
    set:
      config.disableSecretEnvVars: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef)]
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DATABASE_URI
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY_SALT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_LICENSE_KEY
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLEET_FEATURE_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
          any: true

  - it: drops Secret-backed env entries on every core workload
    set:
      config.disableSecretEnvVars: true
    templates:
      - backend/deployment.yaml
      - queue/deployment.yaml
      - ingest-queue/deployment.yaml
      - platform-backend/deployment.yaml
      - clickhouse/stateful-set.yaml
      - backend/postgres-migrations.yaml
      - backend/clickhouse-migrations.yaml
      - backend/backfill-check.yaml
      - backend/auth-bootstrap.yaml
      - frontend/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef)]

  - it: drops the platform backend signing JWKS entry
    template: platform-backend/deployment.yaml
    set:
      config.disableSecretEnvVars: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGSMITH_SIGNING_JWKS
          any: true

  - it: drops the auth bootstrap admin password entry when basic auth is on
    template: backend/auth-bootstrap.yaml
    set:
      config.disableSecretEnvVars: true
      config.basicAuth.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INITIAL_ORG_ADMIN_PASSWORD
          any: true
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef)]

  - it: keeps the queue's plain-value entries after the merge
    template: queue/deployment.yaml
    set:
      config.disableSecretEnvVars: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_MAX_CONNECTIONS
            value: "250"

  - it: drops Secret-backed env entries on host-backend and listener
    set:
      config.disableSecretEnvVars: true
      config.deployment.enabled: true
    templates:
      - host-backend/deployment.yaml
      - listener/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.valueFrom.secretKeyRef)]
