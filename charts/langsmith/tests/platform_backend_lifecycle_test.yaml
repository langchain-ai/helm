suite: platform-backend termination drain (preStop)
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - platform-backend/deployment.yaml
tests:
  - it: defaults to a preStop sleep and 60s termination grace period
    template: platform-backend/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - sleep
            - "10"

  - it: allows overriding lifecycle and terminationGracePeriodSeconds
    template: platform-backend/deployment.yaml
    set:
      platformBackend.deployment.terminationGracePeriodSeconds: 90
      platformBackend.deployment.lifecycle:
        preStop:
          exec:
            command:
              - sleep
              - "30"
        postStart:
          exec:
            command:
              - /bin/true
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - sleep
            - "30"
      - equal:
          path: spec.template.spec.containers[0].lifecycle.postStart.exec.command
          value:
            - /bin/true
