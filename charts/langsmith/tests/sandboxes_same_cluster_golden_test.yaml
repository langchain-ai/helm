  - it: generated-proxy-ca
    chart:
      version: 0.0.0-golden
      appVersion: 0.0.0-golden
    release:
      name: langsmith
      namespace: langsmith
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/proxy-ca.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: smithbox-proxy-ca
      - equal:
          path: metadata.namespace
          value: langsmith
      - equal:
          path: type
          value: kubernetes.io/tls
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: langsmith-0.0.0-golden
            app.kubernetes.io/name: langsmith
            app.kubernetes.io/instance: langsmith
            app.kubernetes.io/version: "0.0.0-golden"
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "-2"
            helm.sh/chart: langsmith-0.0.0-golden
            app.kubernetes.io/name: langsmith
            app.kubernetes.io/instance: langsmith
            app.kubernetes.io/version: "0.0.0-golden"
            app.kubernetes.io/managed-by: Helm
      - exists:
          path: data["tls.crt"]
      - exists:
          path: data["tls.key"]
