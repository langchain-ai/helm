# Golden renders of the same-cluster sandbox runtime. Every object the
# langsmith chart renders under templates/sandboxes/ is snapshotted for a
# matrix of values, with document counts so a missing object fails too.
# A change to these objects shows up as a snapshot diff; update the
# snapshots with `helm unittest -u charts/langsmith` only for an intended change.
suite: same-cluster sandbox golden renders
templates:
  - sandboxes/juicefs-config.yaml
  - sandboxes/juicefs-format-job.yaml
  - sandboxes/proxy-ca.yaml
  - sandboxes/sandbox-host-deployment.yaml
  - sandboxes/sandbox-host-pdb.yaml
  - sandboxes/sandbox-host-rbac.yaml
  - sandboxes/sandbox-host-service-account.yaml
tests:
  - it: default
    chart:
      version: 0.0.0-golden
      appVersion: 0.0.0-golden
    release:
      name: langsmith
      namespace: langsmith
    values:
      - ./values/sandboxes-enabled.yaml
      - ./values/golden/base.yaml
      - ./values/golden/default.yaml
    asserts:
      - matchSnapshot: {}
      - hasDocuments:
          count: 1
        template: sandboxes/juicefs-config.yaml
      - hasDocuments:
          count: 1
        template: sandboxes/juicefs-format-job.yaml
      - hasDocuments:
          count: 0
        template: sandboxes/proxy-ca.yaml
      - hasDocuments:
          count: 1
        template: sandboxes/sandbox-host-deployment.yaml
      - hasDocuments:
          count: 0
        template: sandboxes/sandbox-host-pdb.yaml
      - hasDocuments:
          count: 2
        template: sandboxes/sandbox-host-rbac.yaml
      - hasDocuments:
          count: 1
        template: sandboxes/sandbox-host-service-account.yaml

