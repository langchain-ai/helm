suite: engine workload identity providers validation
templates:
  - templates/validate.yaml
set:
  config.existingSecretName: langsmith-secrets
  config.oauth.enabled: true
  config.authType: oauth
tests:
  - it: should reject a provider that can't use workload identity
    set:
      engine.workloadIdentityProviders:
        - anthropic
    asserts:
      - failedTemplate:
          errorMessage: 'engine.workloadIdentityProviders contains "anthropic": allowed providers are bedrock, vertex and azure.'

  - it: should reject a provider listed twice
    set:
      engine.workloadIdentityProviders:
        - vertex
        - vertex
    asserts:
      - failedTemplate:
          errorMessage: 'engine.workloadIdentityProviders lists "vertex" more than once.'

  - it: should reject a Bedrock region that is not an AWS region name
    set:
      engine.bedrockRegion: bedrock.us-west-2.amazonaws.com
    asserts:
      - failedTemplate:
          errorMessage: 'engine.bedrockRegion is "bedrock.us-west-2.amazonaws.com": it must be an AWS region name such as us-east-1.'

  - it: should reject an Azure AI Foundry resource given as a host
    set:
      engine.azureFoundryResource: my-resource.services.ai.azure.com
    asserts:
      - failedTemplate:
          errorMessage: 'engine.azureFoundryResource is "my-resource.services.ai.azure.com": it must be an Azure AI Foundry resource name such as my-resource, not a URL.'

  - it: should accept an AWS region name and an Azure AI Foundry resource name
    set:
      engine.bedrockRegion: eu-central-1
      engine.azureFoundryResource: my-resource
    asserts:
      - notFailedTemplate: {}
