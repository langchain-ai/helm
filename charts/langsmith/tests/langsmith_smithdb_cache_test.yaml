suite: test smithdb cache volumes
templates:
- smithdb/query-deployment.yaml
- smithdb/query-services-deployments.yaml
tests:
- it: should generate a PVC cache sized from the tier by default
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.mutations.enabled: true
    smithdb.runRules.enabled: true
    smithdb.statsQuery.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 200Gi
  - equal:
      path: spec.template.spec.volumes[0]
      value:
        name: cache
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 200Gi
  - notExists:
      path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
- it: should generate an emptyDir cache sized from the tier with matching ephemeral-storage
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.cache.type: emptyDir
    smithdb.mutations.enabled: true
    smithdb.runRules.enabled: true
    smithdb.statsQuery.enabled: true
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 200Gi
  - equal:
      path: spec.template.spec.volumes
      value:
      - name: cache
        emptyDir:
          sizeLimit: 200Gi
  - equal:
      path: spec.template.spec.containers[0].resources
      value:
        requests:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 200Gi
        limits:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 200Gi
- it: should not add ephemeral-storage to an explicit resources block
  template: smithdb/query-deployment.yaml
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.cache.type: emptyDir
    smithdb.query.deployment.resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
  asserts:
  - equal:
      path: spec.template.spec.containers[0].resources
      value:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
  - equal:
      path: spec.template.spec.volumes[0].emptyDir.sizeLimit
      value: 200Gi
- it: should preserve an explicit disk cache budget from extraEnv
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.mutations.enabled: true
    smithdb.runRules.enabled: true
    smithdb.statsQuery.enabled: true
    smithdb.query.deployment.extraEnv: &id001
    - name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
      value: 40Gi
    smithdb.mutations.deployment.extraEnv: *id001
    smithdb.runRules.deployment.extraEnv: *id001
    smithdb.statsQuery.deployment.extraEnv: *id001
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 40Gi
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 200Gi
- it: should honor a shared explicit budget from commonEnv
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.mutations.enabled: true
    smithdb.runRules.enabled: true
    smithdb.statsQuery.enabled: true
    smithdb.commonEnv:
    - name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
      value: 40Gi
  asserts:
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 40Gi
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 200Gi
- it: should skip the cache volume and budget when cache is not mounted
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.mutations.enabled: true
    smithdb.runRules.enabled: true
    smithdb.statsQuery.enabled: true
    smithdb.query.deployment.volumeMounts: &id002 []
    smithdb.mutations.deployment.volumeMounts: *id002
    smithdb.runRules.deployment.volumeMounts: *id002
    smithdb.statsQuery.deployment.volumeMounts: *id002
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
  - notExists:
      path: spec.template.spec.volumes
- it: should append component volumes after the generated cache volume
  template: smithdb/query-deployment.yaml
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.query.deployment.volumes:
    - name: extra
      emptyDir: {}
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].name
      value: cache
  - equal:
      path: spec.template.spec.volumes[1]
      value:
        name: extra
        emptyDir: {}
- it: should size the cache from the component override
  template: smithdb/query-deployment.yaml
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.query.cache.size: 500Gi
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].ephemeral.volumeClaimTemplate.spec.resources.requests.storage
      value: 500Gi
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 500Gi
- it: should size an emptyDir cache and its ephemeral-storage from the component override
  template: smithdb/query-deployment.yaml
  values:
  - ./values/smithdb-enabled.yaml
  set:
    smithdb.cache.type: emptyDir
    smithdb.query.cache.size: 500Gi
  asserts:
  - equal:
      path: spec.template.spec.volumes[0].emptyDir.sizeLimit
      value: 500Gi
  - equal:
      path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
      value: 500Gi
  - contains:
      path: spec.template.spec.containers[0].env
      content:
        name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
        value: 500Gi
