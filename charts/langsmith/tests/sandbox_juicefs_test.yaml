suite: self-hosted sandbox host-owned JuiceFS
templates:
  - validate.yaml
  - sandboxes/juicefs-config.yaml
  - sandboxes/juicefs-format-job.yaml
  - sandboxes/sandbox-host-deployment.yaml
tests:
  - it: should not render JuiceFS resources when sandboxes are disabled
    set:
      config.existingSecretName: langsmith-secrets
      config.oauth.enabled: true
      config.authType: oauth
    templates:
      - sandboxes/juicefs-config.yaml
      - sandboxes/juicefs-format-job.yaml
      - sandboxes/sandbox-host-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the four-key JuiceFS config Secret
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-config.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-juicefs-config
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
      - equal:
          path: stringData
          value:
            name: sandbox-juicefs
            metaurl: redis://langsmith-redis.default.svc.cluster.local:6379/1
            storage: s3
            bucket: https://langsmith-sandboxes-test.s3.us-west-2.amazonaws.com

  - it: should format JuiceFS once with the sandbox-host image
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-format-job.yaml
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: metadata.name
          pattern: ^RELEASE-NAME-langsmith-juicefs-format-[a-f0-9]{8}$
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: spec.completions
          value: 1
      - equal:
          path: spec.parallelism
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-langsmith-sandbox-host
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            sandbox.langsmith.com/host: "true"
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: sandbox.langsmith.com/host
            operator: Equal
            value: "true"
            effect: NoSchedule
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/langsmith/sandbox-host:test-sandbox-host
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /opt/sandbox-host/bin/sandbox-host
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --internal-juicefs-format
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: LANGCHAIN_ENV
              valueFrom:
                configMapKeyRef:
                  name: RELEASE-NAME-langsmith-config
                  key: LANGCHAIN_ENV
      - isNull:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: juicefs-config
            mountPath: /run/secrets/juicefs
            readOnly: true
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: RELEASE-NAME-langsmith-juicefs-config

  - it: should add labels and annotations to the formatter Job and pod
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefsFormatJob.labels:
        azure.workload.identity/use: "true"
      sandboxes.juicefsFormatJob.annotations:
        example.com/owner: platform
    template: sandboxes/juicefs-format-job.yaml
    asserts:
      - equal:
          path: metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: platform

  - it: should render without formatter Job settings from older chart values
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefsFormatJob: null
    template: sandboxes/juicefs-format-job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: juicefs-format

  - it: should let sandbox-host own the JuiceFS mount
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/sandbox-host-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_HOST_JUICEFS_META_URL_FILE
            value: /run/secrets/juicefs/metaurl
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_HOST_JUICEFS_MOUNT_OPTIONS
            value: '["--cache-dir=/var/cache/juicefs","--cache-size=51200","--cache-large-write"]'
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
      - equal:
          path: spec.template.spec.volumes[1].hostPath
          value:
            path: /var/cache/juicefs
            type: DirectoryOrCreate
      - equal:
          path: spec.template.spec.volumes[2].secret
          value:
            secretName: RELEASE-NAME-langsmith-juicefs-config
            defaultMode: 256
            items:
              - key: metaurl
                path: metaurl
      - isNotEmpty:
          path: spec.template.metadata.annotations["checksum/juicefs-config"]

  - it: should use one external Secret for formatting and mounting
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.redis.metaURL: ""
      sandboxes.juicefs.bucket: ""
      sandboxes.juicefs.existingSecretName: external-juicefs-config
    templates:
      - sandboxes/juicefs-config.yaml
      - sandboxes/juicefs-format-job.yaml
      - sandboxes/sandbox-host-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: sandboxes/juicefs-config.yaml
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: external-juicefs-config
        template: sandboxes/juicefs-format-job.yaml
      - equal:
          path: spec.template.spec.volumes[2].secret.secretName
          value: external-juicefs-config
        template: sandboxes/sandbox-host-deployment.yaml

  - it: should not require inline config when an existing Secret is used
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.redis.metaURL: ""
      sandboxes.juicefs.bucket: ""
      sandboxes.juicefs.existingSecretName: external-juicefs-config
    template: validate.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure multiple node-local cache directories
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.hostMount.cacheDirs:
        - /mnt/juicefs-cache0
        - /mnt/juicefs-cache1
        - /mnt/juicefs-cache2
      sandboxes.juicefs.hostMount.mountOptions:
        - --cache-size=2457600
        - --cache-large-write
        - --prefetch=6
    template: sandboxes/sandbox-host-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SANDBOX_HOST_JUICEFS_MOUNT_OPTIONS
            value: '["--cache-dir=/mnt/juicefs-cache0:/mnt/juicefs-cache1:/mnt/juicefs-cache2","--cache-size=2457600","--cache-large-write","--prefetch=6"]'
      - equal:
          path: spec.template.spec.volumes[1].hostPath.path
          value: /mnt/juicefs-cache0
      - equal:
          path: spec.template.spec.volumes[2].hostPath.path
          value: /mnt/juicefs-cache1
      - equal:
          path: spec.template.spec.volumes[3].hostPath.path
          value: /mnt/juicefs-cache2

  - it: should require a node-local cache directory
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.hostMount.cacheDirs: []
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "sandboxes.juicefs.hostMount.cacheDirs must contain at least one node host path when sandboxes.enabled is true."

  - it: should reject a raw JuiceFS cache-dir mount option
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.hostMount.mountOptions:
        - --cache-dir=/tmp/juicefs-cache
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "sandboxes.juicefs.hostMount.mountOptions must not set --cache-dir; configure sandboxes.juicefs.hostMount.cacheDirs instead."

  - it: should reject raw env that conflicts with chart-managed JuiceFS configuration
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.sandboxHost.deployment.extraEnv:
        - name: SANDBOX_HOST_JUICEFS_META_URL_FILE
          value: /custom/metaurl
    template: sandboxes/sandbox-host-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "Duplicate keys detected: [SANDBOX_HOST_JUICEFS_META_URL_FILE]"
