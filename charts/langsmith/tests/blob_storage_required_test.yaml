suite: blob storage is required
templates:
  - validate.yaml
set:
  config.existingSecretName: "langsmith-secrets"
  config.oauth.enabled: true
  config.authType: "oauth"
tests:
  - it: passes with no blob settings, using the in-chart RustFS
    asserts:
      - notFailedTemplate: {}

  - it: requires a bucket for external S3
    set:
      config.blobStorage.external.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "config.blobStorage.bucketName is required when config.blobStorage.external.enabled is true. See https://docs.langchain.com/langsmith/self-host-blob-storage"

  - it: requires a container for external Azure
    set:
      config.blobStorage.external.enabled: true
      config.blobStorage.engine: "Azure"
    asserts:
      - failedTemplate:
          errorMessage: "config.blobStorage.azureStorageContainerName is required when config.blobStorage.external.enabled is true. See https://docs.langchain.com/langsmith/self-host-blob-storage"

  - it: rejects a non-S3 engine with no bucket instead of falling back to RustFS
    set:
      config.blobStorage.engine: "Azure"
    asserts:
      - failedTemplate:
          errorMessage: "config.blobStorage.engine is \"Azure\" but no bucket is configured: set config.blobStorage.bucketName (S3/GCS) or config.blobStorage.azureStorageContainerName (Azure), or keep engine S3 to use the RustFS the chart deploys. See https://docs.langchain.com/langsmith/self-host-blob-storage"

  - it: rejects the removed enabled flag when it is false
    set:
      config.blobStorage.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "config.blobStorage.enabled has been removed: blob storage is required as of LangSmith v0.18. Remove the setting to use the RustFS the chart deploys, or configure your own storage under config.blobStorage. See https://docs.langchain.com/langsmith/self-host-blob-storage"

  - it: rejects an unknown engine for external storage
    set:
      config.blobStorage.engine: "minio"
      config.blobStorage.bucketName: "langsmith-test"
    asserts:
      - failedTemplate:
          errorMessage: "config.blobStorage.engine must be one of [S3, GCS, Azure]. See https://docs.langchain.com/langsmith/self-host-blob-storage"

  - it: passes with a bucket, including a leftover enabled true
    set:
      config.blobStorage.enabled: true
      config.blobStorage.engine: "gcs"
      config.blobStorage.bucketName: "langsmith-test"
    asserts:
      - notFailedTemplate: {}

  - it: passes with an Azure container and no external flag
    set:
      config.blobStorage.engine: "Azure"
      config.blobStorage.azureStorageContainerName: "langsmith-test"
    asserts:
      - notFailedTemplate: {}

  - it: is skipped with config.skipValidation
    set:
      config.skipValidation: true
      config.blobStorage.external.enabled: true
    asserts:
      - notFailedTemplate: {}
