suite: self-hosted sandbox JuiceFS CSI driver
templates:
  - validate.yaml
  - sandboxes/juicefs-csi-driver/rbac.yaml
  - sandboxes/juicefs-csi-driver/configmap.yaml
  - sandboxes/juicefs-csi-driver/node-daemonset.yaml
  - sandboxes/juicefs-csi-driver/controller-statefulset.yaml
  - sandboxes/juicefs-csi-driver/csidriver.yaml
  - sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
tests:
  - it: should not render inline JuiceFS CSI resources by default
    set:
      config.existingSecretName: langsmith-secrets
      config.oauth.enabled: true
      config.authType: oauth
    asserts:
      - hasDocuments:
          count: 0

  - it: should render only the sandbox-required JuiceFS CSI RBAC resources when sandboxes are enabled
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    asserts:
      - hasDocuments:
          count: 10

  - it: should scope JuiceFS CSI controller mutations to the release namespace
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-provisioner-role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: juicefs-csi-external-provisioner-role
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should not grant JuiceFS CSI controller namespace secret access
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-provisioner-role
    asserts:
      - isKind:
          of: Role
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets

  - it: should scope JuiceFS CSI node mutations to the release namespace
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: juicefs-csi-external-node-service-role
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: should scope JuiceFS CSI node secret reads and mutations to known sandbox secrets
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            verbs:
              - create
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets
            resourceNames:
              - juicefs-csi-config
              - juicefs-sandbox-juicefs-secret
              - juicefs-smithbox-juicefs-csi-secret
              - juicefs-smithbox-juicefs-csi-host-secret
            verbs:
              - get
              - update
              - patch
              - delete

  - it: should not grant pod exec access without a smooth replacement request
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: Role
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods/exec
            verbs:
              - create

  - it: should grant only namespaced pod exec access during a smooth replacement request
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ce-v1.3.1-test
      sandboxes.juicefs.csi.mountPodReplacementRequestId: test-1
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    release:
      upgrade: true
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: Role
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods/exec
            verbs:
              - create

  - it: should not render mount replacement resources without a request ID
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
    release:
      upgrade: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one smooth replacement job for the sandbox mount pod
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ce-v1.3.1-test
      sandboxes.juicefs.csi.mountPodReplacementRequestId: test-1
    template: sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
    release:
      name: test
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/Pod":
          gvr:
            version: v1
            resource: pods
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Pod
          metadata:
            name: juicefs-sandbox-node-sandbox-juicefs-abc123
            namespace: NAMESPACE
            labels:
              app.kubernetes.io/name: juicefs-mount
              volume-id: sandbox-juicefs
          spec:
            nodeName: sandbox-node
            tolerations:
              - key: sandbox.langsmith.com/host
                operator: Equal
                value: "true"
                effect: NoSchedule
        - apiVersion: v1
          kind: Pod
          metadata:
            name: juicefs-other-node-unrelated-volume-def456
            namespace: NAMESPACE
            labels:
              app.kubernetes.io/name: juicefs-mount
              volume-id: unrelated-volume
          spec:
            nodeName: other-node
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: smooth-recreate
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "5"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.nodeName
          value: sandbox-node
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/langsmith/sandbox-juicefs:ce-v1.3.1-test
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: juicefs-sandbox-node-sandbox-juicefs-abc123
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "POD-SUCCESS"
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /var/run/juicefs-csi
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: sandbox.langsmith.com/host
            operator: Equal
            value: "true"
            effect: NoSchedule

  - it: should mark a replacement request complete only after mount jobs
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ce-v1.3.1-test
      sandboxes.juicefs.csi.mountPodReplacementRequestId: test-1
    template: sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
    release:
      name: test
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/Pod":
          gvr:
            version: v1
            resource: pods
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Pod
          metadata:
            name: juicefs-sandbox-node-sandbox-juicefs-abc123
            namespace: NAMESPACE
            labels:
              app.kubernetes.io/name: juicefs-mount
              volume-id: sandbox-juicefs
          spec:
            nodeName: sandbox-node
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: mark-complete
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "6"
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-langsmith-juicefs-mount-replacement
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: test-langsmith-juicefs-mount-replacement

  - it: should scope replacement state mutation to its ConfigMap
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ce-v1.3.1-test
      sandboxes.juicefs.csi.mountPodReplacementRequestId: test-1
    template: sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
    release:
      name: test
      upgrade: true
    documentSelector:
      path: $[?(@.kind == "Role")].metadata.name
      value: test-langsmith-juicefs-mount-replacement
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - configmaps
            resourceNames:
              - test-langsmith-juicefs-mount-replacement
            verbs:
              - patch

  - it: should not rerender replacement jobs for a completed request
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ce-v1.3.1-test
      sandboxes.juicefs.csi.mountPodReplacementRequestId: test-1
    template: sandboxes/juicefs-csi-driver/mount-pod-replacement.yaml
    release:
      name: test
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: v1
            resource: configmaps
          namespaced: true
        "v1/Pod":
          gvr:
            version: v1
            resource: pods
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: test-langsmith-juicefs-mount-replacement
            namespace: NAMESPACE
          data:
            requestedRequestHash: ed1e1dcf971990c1b89676ae785436106f7548b1ae41d174ca9d3bfb9661a477
            completedRequestHash: ed1e1dcf971990c1b89676ae785436106f7548b1ae41d174ca9d3bfb9661a477
        - apiVersion: v1
          kind: Pod
          metadata:
            name: juicefs-sandbox-node-sandbox-juicefs-abc123
            namespace: NAMESPACE
            labels:
              app.kubernetes.io/name: juicefs-mount
              volume-id: sandbox-juicefs
          spec:
            nodeName: sandbox-node
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: data.completedRequestHash
          value: ed1e1dcf971990c1b89676ae785436106f7548b1ae41d174ca9d3bfb9661a477

  - it: should render JuiceFS CSI controller ServiceAccount annotations
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.csi.controller.serviceAccount.annotations.iam\.gke\.io/gcp-service-account: juicefs-controller@example.iam.gserviceaccount.com
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ServiceAccount")].metadata.name
      value: juicefs-csi-controller-sa
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: juicefs-controller@example.iam.gserviceaccount.com
      - equal:
          path: metadata.annotations["app.kubernetes.io/name"]
          value: juicefs-csi-driver

  - it: should render JuiceFS CSI node ServiceAccount annotations
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      sandboxes.juicefs.csi.node.serviceAccount.annotations.eks\.amazonaws\.com/role-arn: arn:aws:iam::123456789012:role/juicefs-csi-node
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ServiceAccount")].metadata.name
      value: juicefs-csi-node-sa
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/juicefs-csi-node
      - equal:
          path: metadata.annotations["app.kubernetes.io/name"]
          value: juicefs-csi-driver

  - it: should not grant JuiceFS CSI node kubelet proxy access by default
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ClusterRole")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: ClusterRole
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - nodes/proxy
            verbs:
              - "*"

  - it: should grant JuiceFS CSI node cluster-wide pod reads
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ClusterRole")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods
            verbs:
              - get
              - list
              - watch

  - it: should not grant JuiceFS CSI controller cluster-wide secret access
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ClusterRole")].metadata.name
      value: juicefs-csi-external-provisioner-role
    asserts:
      - isKind:
          of: ClusterRole
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - secrets

  - it: should not grant JuiceFS CSI controller cluster-wide persistent volume mutations
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ClusterRole")].metadata.name
      value: juicefs-csi-external-provisioner-role
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - persistentvolumes
            verbs:
              - get
              - list
              - watch
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - persistentvolumes
            verbs:
              - get
              - list
              - watch
              - create
              - delete
              - patch

  - it: should not grant JuiceFS CSI node cluster-wide pod exec access
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/rbac.yaml
    documentSelector:
      path: $[?(@.kind == "ClusterRole")].metadata.name
      value: juicefs-csi-external-node-service-role
    asserts:
      - isKind:
          of: ClusterRole
      - notContains:
          path: rules
          content:
            apiGroups:
              - ""
            resources:
              - pods/exec

  - it: should render the JuiceFS CSI config map when sandboxes are enabled
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-juicefs-csi-driver-config

  - it: should render the JuiceFS CSIDriver when sandboxes are enabled
    values:
      - ./values/sandboxes-enabled.yaml
    template: sandboxes/juicefs-csi-driver/csidriver.yaml
    asserts:
      - isKind:
          of: CSIDriver
      - equal:
          path: metadata.name
          value: csi.juicefs.com

  - it: should render every JuiceFS CSI node role with the mirrored image
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.registry: mirror.example.com
      images.imagePullSecrets:
        - name: mirror-pull-secret
      images.juicefsImage.repository: langchain/sandbox-juicefs
      images.juicefsImage.tag: test-juicefs
    template: sandboxes/juicefs-csi-driver/node-daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: juicefs-csi-node
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: juicefs-csi-driver
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: juicefs-csi-driver
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: mirror-pull-secret
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/langchain/sandbox-juicefs:test-juicefs
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/juicefs-csi-config"]
          pattern: "^[a-f0-9]{64}$"
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/juicefs-csi-driver-config"]
          pattern: "^[a-f0-9]{64}$"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JUICEFS_CE_MOUNT_IMAGE
            value: mirror.example.com/langchain/sandbox-juicefs:test-juicefs
      - equal:
          path: spec.template.spec.containers[1].image
          value: mirror.example.com/langchain/sandbox-juicefs:test-juicefs
      - equal:
          path: spec.template.spec.containers[1].command
          value:
            - /csi-node-driver-registrar
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "--unix-socket /csi/csi\\.sock"
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "csi\\.v1\\.Identity/Probe"
      - notExists:
          path: spec.template.spec.containers[2]

  - it: should render every JuiceFS CSI controller role with the mirrored image
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.registry: mirror.example.com
      images.juicefsImage.repository: langchain/sandbox-juicefs
      images.juicefsImage.tag: test-juicefs
    template: sandboxes/juicefs-csi-driver/controller-statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: juicefs-csi-controller
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: juicefs-csi-driver
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: juicefs-csi-driver
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/langchain/sandbox-juicefs:test-juicefs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JUICEFS_CE_MOUNT_IMAGE
            value: mirror.example.com/langchain/sandbox-juicefs:test-juicefs
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/juicefs-csi-config"]
          pattern: "^[a-f0-9]{64}$"
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/juicefs-csi-driver-config"]
          pattern: "^[a-f0-9]{64}$"
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "--unix-socket /var/lib/csi/sockets/pluginproxy/csi\\.sock"
      - matchRegex:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          pattern: "csi\\.v1\\.Identity/Probe"
      - notExists:
          path: spec.template.spec.containers[1]
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --cache-client-conf=true
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --provisioner=true

  - it: should fail when the unified JuiceFS image tag is missing
    values:
      - ./values/sandboxes-enabled.yaml
    set:
      images.juicefsImage.tag: ""
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorMessage: "images.juicefsImage.tag is required when sandboxes.enabled is true."

  - it: should render JuiceFS CSI node observability annotations
    values:
      - ./values/sandboxes-enabled.yaml
      - ./values/sandboxes-juicefs-observability.yaml
    template: sandboxes/juicefs-csi-driver/node-daemonset.yaml
    asserts:
      - equal:
          path: metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9567"

  - it: should render JuiceFS CSI controller observability annotations
    values:
      - ./values/sandboxes-enabled.yaml
      - ./values/sandboxes-juicefs-observability.yaml
    template: sandboxes/juicefs-csi-driver/controller-statefulset.yaml
    asserts:
      - equal:
          path: metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9567"

  - it: should render JuiceFS CSI mount pod patch overrides
    values:
      - ./values/sandboxes-enabled.yaml
      - ./values/sandboxes-juicefs-observability.yaml
    template: sandboxes/juicefs-csi-driver/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "admission.datadoghq.com/enabled: \"false\""
      - matchRegex:
          path: data["config.yaml"]
          pattern: "ad.datadoghq.com/juicefs.logs"
