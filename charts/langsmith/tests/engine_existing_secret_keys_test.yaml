suite: engine keys in an existing Secret
templates:
  - templates/validate.yaml
release:
  namespace: langsmith
set:
  config.skipValidation: true
  config.existingSecretName: langsmith-secrets
  config.hostname: langsmith.example.com
  engine.enabled: true
  sandboxes.enabled: true
tests:
  - it: should fail when the existing Secret lacks the usage signing secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: langsmith-secrets
            namespace: langsmith
          data:
            engine_encryption_key: a2V5
    asserts:
      - failedTemplate:
          errorMessage: 'engine.enabled is true but Secret "langsmith-secrets" has no engine_usage_signing_secret key. Add it before installing: engine_encryption_key is a Fernet key, and engine_usage_signing_secret is at least 32 random characters (openssl rand -hex 32).'

  - it: should name every Engine key the existing Secret lacks
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: langsmith-secrets
            namespace: langsmith
          data:
            api_key_salt: c2FsdA==
    asserts:
      - failedTemplate:
          errorMessage: 'engine.enabled is true but Secret "langsmith-secrets" has no engine_encryption_key or engine_usage_signing_secret key. Add it before installing: engine_encryption_key is a Fernet key, and engine_usage_signing_secret is at least 32 random characters (openssl rand -hex 32).'

  - it: should pass when the existing Secret has both Engine keys
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: langsmith-secrets
            namespace: langsmith
          data:
            engine_encryption_key: a2V5
            engine_usage_signing_secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    asserts:
      - notFailedTemplate: {}

  - it: should skip the check when the Secret can't be read, as under helm template
    asserts:
      - notFailedTemplate: {}
