suite: Agent gateway auth endpoint
templates:
  - agent-gateway/deployment.yaml
  # Loaded so the Deployment's `langsmith.checksumAnnotations` includes resolve.
  - config-map.yaml
  - frontend/config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
tests:
  - it: sets AUTH_ENDPOINT to the platform-backend service
    template: agent-gateway/deployment.yaml
    set:
      agentGateway.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ENDPOINT
            value: "http://RELEASE-NAME-langsmith-platform-backend.NAMESPACE.svc.cluster.local:1986"

  - it: sets AUTH_ENDPOINT under oauth authType
    template: agent-gateway/deployment.yaml
    set:
      agentGateway.enabled: true
      config.authType: oauth
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ENDPOINT
            value: "http://RELEASE-NAME-langsmith-platform-backend.NAMESPACE.svc.cluster.local:1986"

  - it: honours a custom platform-backend name, port and clusterDomain
    template: agent-gateway/deployment.yaml
    set:
      agentGateway.enabled: true
      clusterDomain: cluster.example
      platformBackend.name: pb
      platformBackend.service.port: 9999
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ENDPOINT
            value: "http://RELEASE-NAME-langsmith-pb.NAMESPACE.svc.cluster.example:9999"
