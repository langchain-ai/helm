suite: Pod ServiceAccount token automount configuration
templates:
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - clickhouse/config-map.yaml
  - frontend/config-map.yaml
  - operator/config-map.yaml
  - ace-backend/deployment.yaml
  - agent-features/fleet/api-server/deployment.yaml
  - agent-features/fleet/postgres/statefulset.yaml
  - agent-features/fleet/queue/deployment.yaml
  - agent-features/fleet/redis/statefulset.yaml
  - agent-features/fleet/tool-server/deployment.yaml
  - agent-features/fleet/trigger-server/deployment.yaml
  - agent-features/insights/api-server/deployment.yaml
  - agent-features/insights/postgres/statefulset.yaml
  - agent-features/insights/queue/deployment.yaml
  - agent-features/insights/redis/statefulset.yaml
  - agent-features/polly/api-server/deployment.yaml
  - agent-features/polly/postgres/statefulset.yaml
  - agent-features/polly/queue/deployment.yaml
  - agent-features/polly/redis/statefulset.yaml
  - agent-gateway/deployment.yaml
  - backend/auth-bootstrap.yaml
  - backend/backfill-check.yaml
  - backend/clickhouse-migrations.yaml
  - backend/deployment.yaml
  - backend/e2e-test.yaml
  - backend/postgres-migrations.yaml
  - clickhouse/stateful-set.yaml
  - frontend/deployment.yaml
  - host-backend/deployment.yaml
  - ingest-queue/deployment.yaml
  - listener/deployment.yaml
  - operator/deployment.yaml
  - platform-backend/deployment.yaml
  - playground/deployment.yaml
  - postgres/stateful-set.yaml
  - presidio-analyzer/deployment.yaml
  - queue/deployment.yaml
  - redis/stateful-set.yaml
  - sandboxes/sandbox-host-deployment.yaml
  - sandboxes/juicefs-csi-driver/controller-statefulset.yaml
  - sandboxes/juicefs-csi-driver/node-daemonset.yaml
  - smithdb/cluster-manager-deployment.yaml
  - smithdb/compaction-deployment.yaml
  - smithdb/compaction-worker-deployment.yaml
  - smithdb/ingestion-deployment.yaml
  - smithdb/metastore-migration.yaml
  - smithdb/migration-job.yaml
  - smithdb/query-deployment.yaml
tests:
  - it: configures token automount on core workloads using external ServiceAccounts
    set:
      aceBackend.enabled: true
      aceBackend.serviceAccount.create: false
      aceBackend.serviceAccount.name: ace-backend
      aceBackend.serviceAccount.automountServiceAccountToken: false
      agentGateway.enabled: true
      agentGateway.serviceAccount.create: false
      agentGateway.serviceAccount.name: agent-gateway
      agentGateway.serviceAccount.automountServiceAccountToken: false
      backend.serviceAccount.create: false
      backend.serviceAccount.name: backend
      backend.serviceAccount.automountServiceAccountToken: false
      frontend.serviceAccount.create: false
      frontend.serviceAccount.name: frontend
      frontend.serviceAccount.automountServiceAccountToken: false
      hostBackend.enabled: true
      hostBackend.serviceAccount.create: false
      hostBackend.serviceAccount.name: host-backend
      hostBackend.serviceAccount.automountServiceAccountToken: false
      ingestQueue.serviceAccount.create: false
      ingestQueue.serviceAccount.name: ingest-queue
      ingestQueue.serviceAccount.automountServiceAccountToken: false
      config.deployment.enabled: true
      listener.serviceAccount.create: false
      listener.serviceAccount.name: listener
      listener.serviceAccount.automountServiceAccountToken: false
      operator.serviceAccount.create: false
      operator.serviceAccount.name: operator
      operator.serviceAccount.automountServiceAccountToken: false
      platformBackend.enabled: true
      platformBackend.serviceAccount.create: false
      platformBackend.serviceAccount.name: platform-backend
      platformBackend.serviceAccount.automountServiceAccountToken: false
      playground.enabled: true
      playground.serviceAccount.create: false
      playground.serviceAccount.name: playground
      playground.serviceAccount.automountServiceAccountToken: false
      presidioAnalyzer.enabled: true
      presidioAnalyzer.serviceAccount.create: false
      presidioAnalyzer.serviceAccount.name: presidio-analyzer
      presidioAnalyzer.serviceAccount.automountServiceAccountToken: false
      queue.serviceAccount.create: false
      queue.serviceAccount.name: queue
      queue.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &automountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: ace-backend/deployment.yaml
      - equal: *automountFalse
        template: agent-gateway/deployment.yaml
      - equal: *automountFalse
        template: backend/deployment.yaml
      - equal: *automountFalse
        template: frontend/deployment.yaml
      - equal: *automountFalse
        template: host-backend/deployment.yaml
      - equal: *automountFalse
        template: ingest-queue/deployment.yaml
      - equal: *automountFalse
        template: listener/deployment.yaml
      - equal: *automountFalse
        template: operator/deployment.yaml
      - equal: *automountFalse
        template: platform-backend/deployment.yaml
      - equal: *automountFalse
        template: playground/deployment.yaml
      - equal: *automountFalse
        template: presidio-analyzer/deployment.yaml
      - equal: *automountFalse
        template: queue/deployment.yaml

  - it: configures token automount on backend Jobs using an external ServiceAccount
    set:
      backend.serviceAccount.create: false
      backend.serviceAccount.name: backend
      backend.serviceAccount.automountServiceAccountToken: false
      config.basicAuth.enabled: true
    asserts:
      - equal: &jobAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: backend/auth-bootstrap.yaml
      - equal: *jobAutomountFalse
        template: backend/backfill-check.yaml
      - equal: *jobAutomountFalse
        template: backend/clickhouse-migrations.yaml
      - equal: *jobAutomountFalse
        template: backend/e2e-test.yaml
      - equal: *jobAutomountFalse
        template: backend/postgres-migrations.yaml

  - it: configures token automount on data stores using external ServiceAccounts
    set:
      clickhouse.serviceAccount.create: false
      clickhouse.serviceAccount.name: clickhouse
      clickhouse.serviceAccount.automountServiceAccountToken: false
      postgres.serviceAccount.create: false
      postgres.serviceAccount.name: postgres
      postgres.serviceAccount.automountServiceAccountToken: false
      redis.serviceAccount.create: false
      redis.serviceAccount.name: redis
      redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &storeAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: clickhouse/stateful-set.yaml
      - equal: *storeAutomountFalse
        template: postgres/stateful-set.yaml
      - equal: *storeAutomountFalse
        template: redis/stateful-set.yaml

  - it: configures token automount on Fleet workloads using external ServiceAccounts
    set:
      fleet.enabled: true
      fleet.apiServer.serviceAccount.create: false
      fleet.apiServer.serviceAccount.name: fleet-api
      fleet.apiServer.serviceAccount.automountServiceAccountToken: false
      fleet.postgres.serviceAccount.create: false
      fleet.postgres.serviceAccount.name: fleet-postgres
      fleet.postgres.serviceAccount.automountServiceAccountToken: false
      fleet.queue.serviceAccount.create: false
      fleet.queue.serviceAccount.name: fleet-queue
      fleet.queue.serviceAccount.automountServiceAccountToken: false
      fleet.redis.serviceAccount.create: false
      fleet.redis.serviceAccount.name: fleet-redis
      fleet.redis.serviceAccount.automountServiceAccountToken: false
      fleetToolServer.serviceAccount.create: false
      fleetToolServer.serviceAccount.name: fleet-tool-server
      fleetToolServer.serviceAccount.automountServiceAccountToken: false
      fleetTriggerServer.serviceAccount.create: false
      fleetTriggerServer.serviceAccount.name: fleet-trigger-server
      fleetTriggerServer.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &fleetAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: agent-features/fleet/api-server/deployment.yaml
      - equal: *fleetAutomountFalse
        template: agent-features/fleet/postgres/statefulset.yaml
      - equal: *fleetAutomountFalse
        template: agent-features/fleet/queue/deployment.yaml
      - equal: *fleetAutomountFalse
        template: agent-features/fleet/redis/statefulset.yaml
      - equal: *fleetAutomountFalse
        template: agent-features/fleet/tool-server/deployment.yaml
      - equal: *fleetAutomountFalse
        template: agent-features/fleet/trigger-server/deployment.yaml

  - it: configures token automount on Insights and Polly workloads using external ServiceAccounts
    set:
      insights.enabled: true
      engineInsightsAgent.apiServer.serviceAccount.create: false
      engineInsightsAgent.apiServer.serviceAccount.name: insights-api
      engineInsightsAgent.apiServer.serviceAccount.automountServiceAccountToken: false
      engineInsightsAgent.postgres.serviceAccount.create: false
      engineInsightsAgent.postgres.serviceAccount.name: insights-postgres
      engineInsightsAgent.postgres.serviceAccount.automountServiceAccountToken: false
      engineInsightsAgent.queue.serviceAccount.create: false
      engineInsightsAgent.queue.serviceAccount.name: insights-queue
      engineInsightsAgent.queue.serviceAccount.automountServiceAccountToken: false
      engineInsightsAgent.redis.serviceAccount.create: false
      engineInsightsAgent.redis.serviceAccount.name: insights-redis
      engineInsightsAgent.redis.serviceAccount.automountServiceAccountToken: false
      polly.enabled: true
      polly.apiServer.serviceAccount.create: false
      polly.apiServer.serviceAccount.name: polly-api
      polly.apiServer.serviceAccount.automountServiceAccountToken: false
      polly.postgres.serviceAccount.create: false
      polly.postgres.serviceAccount.name: polly-postgres
      polly.postgres.serviceAccount.automountServiceAccountToken: false
      polly.queue.serviceAccount.create: false
      polly.queue.serviceAccount.name: polly-queue
      polly.queue.serviceAccount.automountServiceAccountToken: false
      polly.redis.serviceAccount.create: false
      polly.redis.serviceAccount.name: polly-redis
      polly.redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &featuresAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: agent-features/insights/api-server/deployment.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/insights/postgres/statefulset.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/insights/queue/deployment.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/insights/redis/statefulset.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/polly/api-server/deployment.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/polly/postgres/statefulset.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/polly/queue/deployment.yaml
      - equal: *featuresAutomountFalse
        template: agent-features/polly/redis/statefulset.yaml

  - it: configures token automount on SmithDB workloads using an external ServiceAccount
    set:
      smithdb.enabled: true
      smithdb.langsmith.ingestion.enabled: true
      smithdb.langsmith.migration.enabled: true
      smithdb.langsmith.query.enabled: true
      smithdb.mutations.enabled: true
      smithdb.serviceAccount.create: false
      smithdb.serviceAccount.name: smithdb
      smithdb.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &smithdbAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: smithdb/cluster-manager-deployment.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/compaction-deployment.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/compaction-worker-deployment.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/ingestion-deployment.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/metastore-migration.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/migration-job.yaml
      - equal: *smithdbAutomountFalse
        template: smithdb/query-deployment.yaml

  - it: configures token automount on sandbox workloads using an external ServiceAccount
    set:
      sandboxes.enabled: true
      sandboxes.sandboxHost.serviceAccount.create: false
      sandboxes.sandboxHost.serviceAccount.name: sandbox-host
      sandboxes.sandboxHost.serviceAccount.automountServiceAccountToken: false
      sandboxes.juicefs.enabled: true
    asserts:
      - equal: &sandboxAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: sandboxes/sandbox-host-deployment.yaml

  - it: configures token automount on bundled JuiceFS CSI workloads
    set:
      sandboxes.enabled: true
      sandboxes.juicefs.csi.install: true
      sandboxes.juicefs.csi.controller.serviceAccount.automountServiceAccountToken: false
      sandboxes.juicefs.csi.node.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal: &juicefsCSIAutomountFalse
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: sandboxes/juicefs-csi-driver/controller-statefulset.yaml
      - equal: *juicefsCSIAutomountFalse
        template: sandboxes/juicefs-csi-driver/node-daemonset.yaml
