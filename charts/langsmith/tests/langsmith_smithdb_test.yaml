suite: test smithdb integration
templates:
  - backend/deployment.yaml
  - frontend/deployment.yaml
  - config-map.yaml
  - secrets.yaml
  - redis/secrets.yaml
  - postgres/secrets.yaml
  - clickhouse/secrets.yaml
  - frontend/config-map.yaml
  - smithdb/query-deployment.yaml
  - smithdb/query-hpa.yaml
  - smithdb/ingestion-deployment.yaml
  - smithdb/ingestion-hpa.yaml
  - smithdb/compaction-deployment.yaml
  - smithdb/compaction-worker-deployment.yaml
  - smithdb/compaction-worker-hpa.yaml
  - smithdb/cluster-manager-deployment.yaml
  - smithdb/migration-job.yaml
  - smithdb/taskdb-postgres-secret.yaml
  - smithdb/taskdb-postgres-service.yaml
  - smithdb/taskdb-postgres-statefulset.yaml
  - smithdb/services.yaml
  - smithdb/pdbs.yaml
  - smithdb/service-account.yaml
  - smithdb/metastore-migration.yaml
tests:
  - it: should render smithdb workloads when enabled
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/query-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-langsmith-smithdb-query
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__METASTORE__HOST
            valueFrom:
              secretKeyRef:
                name: smithdb-secret
                key: smithdb_metastore_db_host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__CLUSTER_MANAGER__ENDPOINT
            value: http://RELEASE-NAME-langsmith-smithdb-cluster-manager.NAMESPACE.svc.cluster.local:8091
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.ephemeral-storage
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__VORTEX_CACHE__MEMORY__LIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "8Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "200Gi"

  - it: should enable TLS for metastore migrations when metastore TLS is enabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.config.metastore.useSsl: true
    template: smithdb/metastore-migration.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - ./smithdb
            - metastore-migrate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_METASTORE_MIGRATE__METASTORE__USE_SSL
            value: "true"

  - it: should size the SmithDB query disk cache from its ephemeral storage limit
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.query.deployment.resources.limits.ephemeral-storage: 100Gi
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__VORTEX_CACHE__DISK__LIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.ephemeral-storage

  - it: should size the SmithDB query memory cache from its memory limit
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.query.deployment.resources.limits.memory: 16Gi
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__VORTEX_CACHE__MEMORY__LIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory

  - it: should back the SmithDB query disk cache with a writable /data volume
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: local-ssd-storage
            emptyDir:
              sizeLimit: 200Gi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: local-ssd-storage
            mountPath: /data

  - it: should derive the plaintext SmithDB OTLP endpoint from chart-level tracing
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.observability.tracing.enabled: true
      config.observability.tracing.endpoint: default-otel-collector:4317
      config.observability.tracing.useTls: false
      config.observability.tracing.exporter: grpc
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__TRACING_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__FORMAT
            value: opentelemetry
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://default-otel-collector:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: pod_name=$(POD_NAME),k8s.pod.name=$(POD_NAME),container_name=$(CONTAINER_NAME),k8s.container.name=$(CONTAINER_NAME)

  - it: should preserve the bare endpoint for LangSmith services
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.observability.tracing.enabled: true
      config.observability.tracing.endpoint: default-otel-collector:4317
      config.observability.tracing.useTls: false
      config.observability.tracing.exporter: grpc
    template: config-map.yaml
    asserts:
      - equal:
          path: data.OTLP_ENDPOINT
          value: default-otel-collector:4317

  - it: should derive the TLS SmithDB OTLP endpoint from chart-level tracing
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.observability.tracing.enabled: true
      config.observability.tracing.endpoint: secure-otel-collector:4317
      config.observability.tracing.useTls: true
      config.observability.tracing.exporter: grpc
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__TRACING_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__FORMAT
            value: opentelemetry
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: https://secure-otel-collector:4317
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: grpc

  - it: should keep SmithDB tracing disabled when chart-level tracing is disabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.observability.tracing.endpoint: http://otel-collector:4317
      config.observability.tracing.exporter: grpc
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__TRACING_ENABLED
            value: "false"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4317

  - it: should disable SmithDB tracing when the chart-level exporter uses OTLP HTTP
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.observability.tracing.enabled: true
      config.observability.tracing.endpoint: http://otel-collector:4318/v1/traces
      config.observability.tracing.exporter: http
    template: smithdb/query-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__TRACING_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_QUERY__LOGGING__FORMAT
            value: console
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-collector:4318/v1/traces

  - it: should keep smithdb services internal
    values:
      - ./values/smithdb-enabled.yaml
    set:
      config.skipValidation: true
      smithdb.query.service.type: LoadBalancer
      smithdb.query.service.loadBalancerSourceRanges[0]: "10.0.0.0/8"
      smithdb.query.service.loadBalancerIP: "192.0.2.10"
    template: smithdb/services.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - notExists:
          path: spec.loadBalancerSourceRanges
      - notExists:
          path: spec.loadBalancerIP

  - it: should render user-provided SmithDB metrics annotations
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.query.deployment.annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8060"
    template: smithdb/query-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/path"]
          value: /metrics
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "8060"

  - it: should wire langsmith app config to smithdb when enabled
    values:
      - ./values/smithdb-enabled.yaml
    template: config-map.yaml
    asserts:
      - equal:
          path: data.SMITHDB_QUERY_SERVICE_URL
          value: RELEASE-NAME-langsmith-smithdb-query.NAMESPACE.svc.cluster.local:8080
      - equal:
          path: data.SMITHDB_QUERY_ENABLED
          value: "true"
      - equal:
          path: data.CLICKHOUSE_QUERY_ENABLED
          value: "true"
      - equal:
          path: data.SMITHDB_INGESTION_SERVICE_URL
          value: RELEASE-NAME-langsmith-smithdb-ingestion.NAMESPACE.svc.cluster.local:8082
      - equal:
          path: data.SMITHDB_INGESTION_ENABLED
          value: "true"
      - equal:
          path: data.CLICKHOUSE_INGESTION_ENABLED
          value: "true"
      - equal:
          path: data.SMITHDB_MUTATIONS_SERVICE_URL
          value: RELEASE-NAME-langsmith-smithdb-query.NAMESPACE.svc.cluster.local:8080
      - equal:
          path: data.RULES_REDIS_TRACKING_ENABLED
          value: "true"
      - equal:
          path: data.RULES_REDIS_TRACKING_MULTIPART_ENABLED
          value: "true"
      - equal:
          path: data.SMITHDB_UPGRADE_CRON_ENABLED
          value: "true"
      - equal:
          path: data.SMITHDB_QUERY_SERVICE_MAX_CALL_RECV_MSG_SIZE
          value: "1073741824"
      - equal:
          path: data.SMITHDB_FEEDBACK_MUTATION_RPS_PER_KEY
          value: "100"
      - equal:
          path: data.SMITHDB_FEEDBACK_MUTATION_BURST_PER_KEY
          value: "150"
      - equal:
          path: data.SMITHDB_RULES_REDIS_READ_ENABLED
          value: "true"
      - equal:
          path: data.SMITHDB_RULES_THREAD_REDIS_READ_ENABLED
          value: "true"
      - equal:
          path: data.RUN_RULES_SMITHDB_RETRIEVER_TENANTS
          value: '["*"]'
      - equal:
          path: data.RUN_RULES_SMITHDB_RETRIEVER_PCT
          value: "100"
      - equal:
          path: data.RUN_RULES_SMITHDB_THREAD_RETRIEVER_TENANTS
          value: '["*"]'
      - equal:
          path: data.RUN_RULES_SMITHDB_THREAD_RETRIEVER_PCT
          value: "100"
      - equal:
          path: data.RUN_RULES_QUERY_LIMIT
          value: "250"
      - equal:
          path: data.RUN_RULES_REDIS_DEDUP_TENANTS
          value: '["*"]'
      - equal:
          path: data.RUN_RULES_LIMIT_RRA_RECORDS_PER_BATCH_TENANTS
          value: '["*"]'

  - it: should configure SmithDB ingestion without SmithDB query endpoints
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.langsmith.query.enabled: false
    template: config-map.yaml
    asserts:
      - equal:
          path: data.SMITHDB_MUTATIONS_SERVICE_URL
          value: RELEASE-NAME-langsmith-smithdb-query.NAMESPACE.svc.cluster.local:8080
      - notExists:
          path: data.SMITHDB_QUERY_SERVICE_URL
      - equal:
          path: data.SMITHDB_QUERY_ENABLED
          value: "false"
      - equal:
          path: data.RULES_REDIS_TRACKING_ENABLED
          value: "true"
      - equal:
          path: data.RULES_REDIS_TRACKING_MULTIPART_ENABLED
          value: "true"

  - it: should wire frontend SmithDB v2 endpoint flag when enabled
    values:
      - ./values/smithdb-enabled.yaml
    template: frontend/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VITE_SELF_HOSTED_SMITHDB_V2_ENDPOINTS_ENABLED
            value: "true"

  - it: should skip all smithdb resources when disabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.enabled: false
      smithdb.langsmith.ingestion.enabled: false
      smithdb.langsmith.query.enabled: false
    templates:
      - smithdb/query-deployment.yaml
      - smithdb/ingestion-deployment.yaml
      - smithdb/compaction-deployment.yaml
      - smithdb/compaction-worker-deployment.yaml
      - smithdb/cluster-manager-deployment.yaml
      - smithdb/migration-job.yaml
      - smithdb/taskdb-postgres-secret.yaml
      - smithdb/taskdb-postgres-service.yaml
      - smithdb/taskdb-postgres-statefulset.yaml
      - smithdb/services.yaml
      - smithdb/pdbs.yaml
      - smithdb/service-account.yaml
      - smithdb/metastore-migration.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should omit LangSmith SmithDB config when disabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.enabled: false
      smithdb.langsmith.ingestion.enabled: false
      smithdb.langsmith.query.enabled: false
    template: config-map.yaml
    asserts:
      - notExists:
          path: data.SMITHDB_QUERY_SERVICE_URL
      - equal:
          path: data.SMITHDB_QUERY_ENABLED
          value: "false"
      - notExists:
          path: data.SMITHDB_MUTATIONS_SERVICE_URL
      - notExists:
          path: data.SMITHDB_INGESTION_SERVICE_URL
      - equal:
          path: data.SMITHDB_INGESTION_ENABLED
          value: "false"
      - notExists:
          path: data.SMITHDB_CLUSTER_MANAGER_ENABLED
      - notExists:
          path: data.SMITHDB_CLUSTER_MANAGER_URL
      - notExists:
          path: data.RULES_REDIS_TRACKING_ENABLED
      - notExists:
          path: data.RULES_REDIS_TRACKING_MULTIPART_ENABLED
      - notExists:
          path: data.SMITHDB_UPGRADE_CRON_ENABLED
      - notExists:
          path: data.SMITHDB_QUERY_SERVICE_MAX_CALL_RECV_MSG_SIZE
      - notExists:
          path: data.SMITHDB_FEEDBACK_MUTATION_RPS_PER_KEY
      - notExists:
          path: data.SMITHDB_RULES_REDIS_READ_ENABLED
      - notExists:
          path: data.RUN_RULES_SMITHDB_RETRIEVER_TENANTS
      - notExists:
          path: data.RUN_RULES_SMITHDB_RETRIEVER_PCT
      - notExists:
          path: data.RUN_RULES_SMITHDB_THREAD_RETRIEVER_TENANTS
      - notExists:
          path: data.RUN_RULES_SMITHDB_THREAD_RETRIEVER_PCT
      - notExists:
          path: data.RUN_RULES_QUERY_LIMIT
      - equal:
          path: data.RUN_RULES_REDIS_DEDUP_TENANTS
          value: '["*"]'
      - equal:
          path: data.RUN_RULES_LIMIT_RRA_RECORDS_PER_BATCH_TENANTS
          value: '["*"]'

  - it: should omit frontend SmithDB v2 endpoint flag when disabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.enabled: false
      smithdb.langsmith.ingestion.enabled: false
      smithdb.langsmith.query.enabled: false
    template: frontend/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VITE_SELF_HOSTED_SMITHDB_V2_ENDPOINTS_ENABLED

  - it: should render zero-downtime rollout strategy for smithdb ingestion
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/ingestion-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0

  - it: should disable smithdb cluster-manager tracing by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/cluster-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__LOGGING__TRACING_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__LOGGING__FORMAT
            value: console

  - it: should default cluster-manager service max replicas to deployment replicas
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.query.autoscaling.enabled: false
      smithdb.ingestion.autoscaling.enabled: false
      smithdb.query.deployment.replicas: 4
      smithdb.ingestion.deployment.replicas: 2
    template: smithdb/cluster-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__MIN_REPLICAS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__MAX_REPLICAS
            value: "4"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__INGESTION__MIN_REPLICAS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__INGESTION__MAX_REPLICAS
            value: "2"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__REPLICATION_THRESHOLD
            value: "0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__SLICE_REPLICATION_THRESHOLD
            value: "0"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__COMPACTION__MAX_REPLICAS


  - it: should derive cluster-manager service max replicas from autoscaling max when HPA enabled
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.query.deployment.replicas: 1
      smithdb.query.autoscaling.enabled: true
      smithdb.query.autoscaling.minReplicas: 2
      smithdb.query.autoscaling.maxReplicas: 6
    template: smithdb/cluster-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__MIN_REPLICAS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_CLUSTERMANAGER__SERVICES__QUERY__MAX_REPLICAS
            value: "6"

  - it: should enable query HPA by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/query-hpa.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 40

  - it: should omit query deployment replicas when HPA enabled by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/query-deployment.yaml
    asserts:
      - notExists:
          path: spec.replicas

  - it: should enable ingestion HPA by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/ingestion-hpa.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 45

  - it: should omit ingestion deployment replicas when HPA enabled by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/ingestion-deployment.yaml
    asserts:
      - notExists:
          path: spec.replicas

  - it: should enable compaction-worker HPA by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/compaction-worker-hpa.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 10
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 60

  - it: should omit compaction-worker deployment replicas when HPA enabled by default
    values:
      - ./values/smithdb-enabled.yaml
    template: smithdb/compaction-worker-deployment.yaml
    asserts:
      - notExists:
          path: spec.replicas
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "100Gi"

  - it: should expose compaction worker concurrency as a value
    values:
      - ./values/smithdb-enabled.yaml
    set:
      smithdb.compactionWorker.maxConcurrentJobs: 8
    template: smithdb/compaction-worker-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SMITHDB_COMPACTION_WORKER__MAX_CONCURRENT_JOBS
            value: "8"

  - it: should omit smithdb migration resources by default
    values:
      - ./values/smithdb-enabled.yaml
    templates:
      - smithdb/migration-job.yaml
      - smithdb/taskdb-postgres-secret.yaml
      - smithdb/taskdb-postgres-service.yaml
      - smithdb/taskdb-postgres-statefulset.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render smithdb migration resources with chart-managed taskdb
    values:
      - ./values/smithdb-enabled.yaml
    set:
      images.smithdbImage.tag: test-tag
      config.blobStorage.enabled: true
      config.blobStorage.bucketName: langsmith-blob
      config.blobStorage.apiURL: http://blob-store:9000
      smithdb.langsmith.migration.enabled: true
      smithdb.langsmith.query.enabled: false
