apiVersion: v2
name: langsmith
maintainers:
  - name: Ankush
    email: ankush@langchain.dev
description: Helm chart to deploy the langsmith application and all services it depends on.
type: application
version: 0.18.0-rc.49
appVersion: "0.18.17rc1"
# The sandbox runtime's object templates live in langsmith-sandbox; sameCluster
# renders them through langsmithSandbox.render.*. The dependency renders nothing
# itself (its sandboxHost.enabled stays false). The pairing check requires the
# exact chart in charts/langsmith-sandbox.
dependencies:
  - name: langsmith-sandbox
    version: ">=0.18.0-0 <0.19.0-0"
    repository: "file://../langsmith-sandbox"
