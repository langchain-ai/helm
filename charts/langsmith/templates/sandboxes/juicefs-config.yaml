{{- if and .Values.sandboxes.enabled (not .Values.sandboxes.external.enabled) (not .Values.sandboxes.juicefs.existingSecretName) }}
{{- include "langsmithSandbox.render.juicefsConfig" (dict
  "name" (include "langsmith.sandboxes.juicefsConfigSecretName" .)
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (include "langsmith.labels" . | fromYaml)
  "annotations" (mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "-2") (include "langsmith.annotations" . | fromYaml))
  "data" (include "langsmith.sandboxes.juicefsConfigSecretData" .)) }}
{{- end }}
