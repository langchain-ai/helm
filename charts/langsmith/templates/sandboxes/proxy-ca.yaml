{{- if and .Values.sandboxes.enabled (eq .Values.sandboxes.deploymentMode "sameCluster") (eq .Values.sandboxes.proxyCa.mode "generatedSecret") }}
{{- include "langsmithSandbox.render.proxyCa" (dict
  "name" (include "langsmith.sandboxes.proxyCaSecretName" .)
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (include "langsmith.labels" . | fromYaml)
  "annotations" (mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "-2") (include "langsmith.annotations" . | fromYaml))) }}
{{- end }}
