{{- if and .Values.sandboxes.enabled (not .Values.sandboxes.external.enabled) .Values.sandboxes.sandboxHost.pdb.enabled }}
{{- $name := printf "%s-%s" (include "langsmith.fullname" .) .Values.sandboxes.sandboxHost.name }}
{{- include "langsmithSandbox.render.pdb" (dict
  "name" $name
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (mergeOverwrite (include "langsmith.labels" . | fromYaml) (default dict .Values.sandboxes.sandboxHost.pdb.labels))
  "annotations" (mergeOverwrite (include "langsmith.annotations" . | fromYaml) (default dict .Values.sandboxes.sandboxHost.pdb.annotations))
  "selectorLabels" (mergeOverwrite (include "langsmith.selectorLabels" . | fromYaml) (dict "app.kubernetes.io/component" $name))
  "sandboxHost" .Values.sandboxes.sandboxHost) }}
{{- end }}
