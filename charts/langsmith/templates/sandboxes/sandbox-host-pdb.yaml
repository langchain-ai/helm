{{- if and .Values.config.sandboxes.enabled .Values.config.sandboxes.sandboxHost.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.pdb.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.pdb.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "langsmith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  {{- if hasKey .Values.config.sandboxes.sandboxHost.pdb "minAvailable" }}
  minAvailable: {{ .Values.config.sandboxes.sandboxHost.pdb.minAvailable }}
  {{- end }}
  {{- if hasKey .Values.config.sandboxes.sandboxHost.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.config.sandboxes.sandboxHost.pdb.maxUnavailable }}
  {{- end }}
{{- end }}
