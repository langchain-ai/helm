{{- if and .Values.sandboxes.enabled (eq .Values.sandboxes.deploymentMode "sameCluster") }}
{{- $sandboxHost := .Values.sandboxes.sandboxHost }}
{{- $managedHostMountEnv := list
  (dict "name" "SANDBOX_HOST_JUICEFS_META_URL_FILE")
  (dict "name" "SANDBOX_HOST_JUICEFS_MOUNT_OPTIONS")
  (dict "name" "SANDBOX_HOST_JUICEFS_REDIS_IAM_AUTH_PROVIDER")
  (dict "name" "LANGSMITH_APP_VERSION")
-}}
{{- if include "langsmith.sandboxes.serviceAuthPreviousSecretKey" . }}
{{- $managedHostMountEnv = append $managedHostMountEnv (dict "name" "SANDBOX_X_SERVICE_AUTH_JWT_SECRET_PREVIOUS") }}
{{- end }}
{{- /* commonEnv joins the check so an operator-supplied var that collides with a
managed one fails at render rather than silently winning by list order. */}}
{{- include "langsmith.detectDuplicates" (concat $managedHostMountEnv .Values.commonEnv $sandboxHost.deployment.extraEnv) }}
{{- $name := printf "%s-%s" (include "langsmith.fullname" .) $sandboxHost.name }}
{{- /* Chart labels last so they win; the selector depends on them. */}}
{{- $labels := mergeOverwrite (dict "app" $sandboxHost.name)
  (default dict $sandboxHost.deployment.labels)
  (include "langsmith.labels" . | fromYaml)
  (dict "app.kubernetes.io/component" $name) }}
{{- $secretsName := include "langsmith.secretsName" . }}
{{- $optional := .Values.config.disableSecretCreation }}
{{- $previous := dict }}
{{- with include "langsmith.sandboxes.serviceAuthPreviousSecretKey" . }}
{{- $previous = dict "secretName" $secretsName "key" . "optional" $optional }}
{{- end }}
{{- $podAnnotations := mergeOverwrite (include "langsmith.commonPodAnnotations" . | fromYaml)
  (dict "checksum/juicefs-config" (include "langsmith.sandboxes.juicefsConfigSecretChecksum" .))
  (default dict $sandboxHost.deployment.podAnnotations) }}
{{- include "langsmithSandbox.render.hostDeployment" (dict
  "name" $name
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" $labels
  "podLabelsOmit" (list "helm.sh/chart" "app.kubernetes.io/version")
  "annotations" (mergeOverwrite (include "langsmith.annotations" . | fromYaml) (default dict $sandboxHost.deployment.annotations))
  "selectorLabels" (mergeOverwrite (include "langsmith.selectorLabels" . | fromYaml) (dict "app.kubernetes.io/component" $name))
  "podAnnotations" $podAnnotations
  "podSecurityContext" (include "langsmith.podSecurityContext" (dict "Values" .Values "componentSecurityContext" $sandboxHost.deployment.podSecurityContext))
  "dnsConfig" (include "langsmith.dnsConfig" .)
  "serviceAccountName" (include "langsmith.sandboxes.sandboxHostServiceAccountName" .)
  "image" (include "langsmith.image" (dict "Values" .Values "Chart" .Chart "component" "sandboxHostImage"))
  "pullPolicy" .Values.images.sandboxHostImage.pullPolicy
  "pullSecrets" .Values.images.imagePullSecrets
  "initContainers" (concat .Values.commonInitContainers $sandboxHost.deployment.initContainers)
  "env" (dict
    "appVersion" (include "langsmith.sandboxes.hostImageTag" .)
    "serviceAuth" (dict "secretName" $secretsName "key" (include "langsmith.sandboxes.serviceAuthSecretKey" .) "optional" $optional)
    "previousServiceAuth" $previous
    "sslCertFile" (and .Values.config.customCa.secretName .Values.config.customCa.secretKey)
    "callbackJwk" (dict "secretName" $secretsName "key" "sandbox_callback_signing_jwk" "optional" true)
    "oauthIssuer" (ternary (include "langsmith.oauthAsIssuer" .) "" (not (empty .Values.config.hostname)))
    "egressProxy" (dict "secretName" $secretsName "key" "sandbox_egress_proxy_url" "noProxy" (((.Values.sandboxes.authProxy | default dict).httpProxy | default dict).noProxy))
    "internalEndpoint" (include "langsmith.platformBackendEndpoint" .)
    "deploymentName" $name
    "extra" (concat .Values.commonEnv $sandboxHost.deployment.extraEnv))
  "extraVolumeMounts" (concat (include "langsmith.tlsVolumeMounts" . | fromYamlArray) .Values.commonVolumeMounts $sandboxHost.deployment.volumeMounts)
  "extraVolumes" (concat (include "langsmith.tlsVolumes" . | fromYamlArray) .Values.commonVolumes $sandboxHost.deployment.volumes)
  "juicefsConfigSecretName" (include "langsmith.sandboxes.juicefsConfigSecretName" .)
  "proxyCaSecretName" (include "langsmith.sandboxes.proxyCaSecretName" .)
  "sandboxHost" $sandboxHost
  "juicefs" .Values.sandboxes.juicefs) }}
{{- end }}
