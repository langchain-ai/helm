{{- if .Values.config.sandboxes.enabled }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $autoscaling := .Values.config.sandboxes.sandboxHost.autoscaling }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  namespace: {{ $namespace }}
  labels:
    app: sandbox-host
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.deployment.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.deployment.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "langsmith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  {{- if not $autoscaling.enabled }}
  replicas: {{ .Values.config.sandboxes.sandboxHost.deployment.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        # app: sandbox-host is intentionally release-independent: the pod anti-affinity below
        # keys off it so hosts from different releases never land on the same node, where they
        # would collide on hostPort and leave one pod permanently Pending.
        app: sandbox-host
        {{- include "langsmith.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
      annotations:
        {{- include "langsmith.commonPodAnnotations" . | nindent 8 }}
        {{- with .Values.config.sandboxes.sandboxHost.deployment.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sandbox-host
              topologyKey: kubernetes.io/hostname
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- include "langsmith.sandboxes.sandboxHostNodeSelector" . | nindent 8 }}
      {{- with .Values.config.sandboxes.sandboxHost.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandbox-host
          image: {{ include "langsmith.image" (dict "Values" .Values "Chart" .Chart "component" "sandboxHostImage") | quote }}
          imagePullPolicy: {{ .Values.images.sandboxHostImage.pullPolicy }}
          env:
            - name: LANGCHAIN_ENV
              value: "local_kubernetes"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: SANDBOX_X_SERVICE_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langsmith.secretsName" . }}
                  key: api_key_salt
                  optional: {{ .Values.config.disableSecretCreation }}
            - name: SANDBOX_HOST_PROXY_CA_DIR
              value: /certs
            {{- if or (not (empty .Values.config.existingSecretName)) .Values.config.sandboxes.callbackSigningJwk }}
            - name: LANGSMITH_SANDBOX_CALLBACK_SIGNING_JWK
              valueFrom:
                secretKeyRef:
                  name: {{ include "langsmith.secretsName" . }}
                  key: sandbox_callback_signing_jwk
                  optional: true
            {{- end }}
            {{- /* iss on signed egress callbacks. Must match the public issuer the shared
                   ConfigMap advertises, because callback receivers discover the verification
                   key at <issuer>/.well-known/jwks.json. Without config.hostname there is no
                   public issuer to advertise, so leave it unset and let callback signing fail
                   closed rather than minting tokens receivers cannot verify. */}}
            {{- if .Values.config.hostname }}
            - name: OAUTH_AS_ISSUER
              value: {{ include "langsmith.oauthAsIssuer" . | quote }}
            {{- end }}
            - name: SSRF_ALLOW_PRIVATE_IPS_CALLBACKS
              value: {{ .Values.config.sandboxes.sandboxHost.allowPrivateIPCallbacks | quote }}
            - name: SANDBOX_CALLBACK_LOOPBACK_REWRITE
              value: "false"
            - name: LANGSMITH_SANDBOX_INTERNAL_ENDPOINT
              value: {{ include "langsmith.sandboxes.langsmithInternalEndpoint" . | quote }}
            {{- /* The elected host resolves this Deployment by name to read its autoscale
                   annotations and patch replicas, so it has to be told the release-prefixed name. */}}
            - name: SANDBOX_HOST_DEPLOYMENT_NAME
              value: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . | quote }}
            - name: SANDBOX_HOST_TERMINATION_GRACE_SECONDS
              value: {{ .Values.config.sandboxes.sandboxHost.deployment.terminationGracePeriodSeconds | quote }}
            {{- /* Pool autoscaling: the elected host resizes this Deployment from the committed
                   vCPU it reads off host Leases, and sets each pod's scale-down deletion cost so
                   the emptiest host is evicted first. These are the baseline; the same knobs can
                   be overridden live via sandbox-host.smith.langchain.com/autoscale-* annotations
                   on the Deployment, which the chart does not manage. */}}
            - name: SANDBOX_HOST_AUTOSCALE_ENABLED
              value: {{ $autoscaling.enabled | quote }}
            {{- if $autoscaling.enabled }}
            - name: SANDBOX_HOST_AUTOSCALE_MIN_REPLICAS
              value: {{ $autoscaling.minReplicas | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_MAX_REPLICAS
              value: {{ $autoscaling.maxReplicas | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_TARGET_UTILIZATION_PERCENT
              value: {{ $autoscaling.targetUtilizationPercent | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_HEADROOM_HOSTS
              value: {{ $autoscaling.headroomHosts | quote }}
            - name: SANDBOX_HOST_AUTOSCALE_SCALE_DOWN_STABILIZATION_SECONDS
              value: {{ $autoscaling.scaleDownStabilizationSeconds | quote }}
            {{- end }}
            {{- with .Values.config.sandboxes.sandboxHost.deployment.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.sandboxes.sandboxHost.containerPort }}
              hostPort: {{ .Values.config.sandboxes.sandboxHost.containerPort }}
              protocol: TCP
          {{- /* The host binds this listener only after its engine, fence and lease loops are up,
                 so accepting connections is the readiness signal. There is deliberately no liveness
                 probe: a restart while the host is suspending microVMs to JuiceFS would destroy
                 running sandboxes, and the rollout is already bounded by the no-surge strategy. */}}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.config.sandboxes.sandboxHost.deployment.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.config.sandboxes.sandboxHost.deployment.resources | nindent 12 }}
          volumeMounts:
            - name: juicefs
              mountPath: {{ .Values.config.sandboxes.juicefs.csi.mountPath }}
            - name: host-bin
              mountPath: /host-bin
            - name: proxy-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: juicefs
          persistentVolumeClaim:
            claimName: {{ include "langsmith.sandboxes.juicefsHostPVCName" . }}
        - name: proxy-ca
          secret:
            secretName: {{ include "langsmith.sandboxes.proxyCaSecretName" . }}
        - name: host-bin
          hostPath:
            path: /var/lib/sandbox-host
            type: DirectoryOrCreate
      terminationGracePeriodSeconds: {{ .Values.config.sandboxes.sandboxHost.deployment.terminationGracePeriodSeconds }}
{{- end }}
