{{- if and .Values.sandboxes.enabled (not .Values.sandboxes.external.enabled) .Values.sandboxes.sandboxHost.serviceAccount.create }}
{{- $serviceAccount := .Values.sandboxes.sandboxHost.serviceAccount }}
{{- /* Argo CD applies waves in order and the JuiceFS formatter Job (wave -1)
runs as this ServiceAccount, so it must exist first. An operator-set wave wins. */}}
{{- $syncWave := dict }}
{{- if not (or (hasKey (default dict $serviceAccount.annotations) "argocd.argoproj.io/sync-wave") (hasKey (default dict .Values.commonAnnotations) "argocd.argoproj.io/sync-wave")) }}
{{- $syncWave = dict "argocd.argoproj.io/sync-wave" "-2" }}
{{- end }}
{{- include "langsmithSandbox.render.serviceAccount" (dict
  "name" (include "langsmith.sandboxes.sandboxHostServiceAccountName" .)
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (mergeOverwrite (include "langsmith.labels" . | fromYaml) (default dict $serviceAccount.labels))
  "annotations" (mergeOverwrite $syncWave (include "langsmith.annotations" . | fromYaml) (default dict $serviceAccount.annotations))
  "sandboxHost" .Values.sandboxes.sandboxHost) }}
{{- end }}
