{{- if and .Values.sandboxes.enabled (not .Values.sandboxes.external.enabled) .Values.sandboxes.sandboxHost.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.sandboxes.sandboxHost.serviceAccount.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- /* Argo CD applies waves in order and the JuiceFS formatter Job (wave -1)
    runs as this ServiceAccount, so it must exist first. An operator-set wave wins. */}}
    {{- if not (or (hasKey (default dict .Values.sandboxes.sandboxHost.serviceAccount.annotations) "argocd.argoproj.io/sync-wave") (hasKey (default dict .Values.commonAnnotations) "argocd.argoproj.io/sync-wave")) }}
    argocd.argoproj.io/sync-wave: "-2"
    {{- end }}
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.sandboxes.sandboxHost.serviceAccount.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.sandboxes.sandboxHost.serviceAccount.automountServiceAccountToken }}
{{- end }}
