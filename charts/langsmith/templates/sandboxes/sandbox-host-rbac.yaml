{{- if and .Values.config.sandboxes.enabled .Values.config.sandboxes.sandboxHost.rbac.create }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
# Host liveness leases, and the leader election that picks the observing host.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
# The elected host reads its own Deployment each reconcile and patches replicas.
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  verbs:
  - get
  - patch
# Scale-down deletion cost, so the emptiest host is evicted first.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: {{ include "langsmith.sandboxes.sandboxHostDeploymentName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
