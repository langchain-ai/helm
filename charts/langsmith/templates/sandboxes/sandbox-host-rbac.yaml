{{- if .Values.config.sandboxes.enabled }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- if .Values.config.sandboxes.sandboxHost.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.serviceAccount.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.serviceAccount.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.config.sandboxes.sandboxHost.serviceAccount.automountServiceAccountToken }}
{{- if .Values.config.sandboxes.sandboxHost.rbac.create }}
---
{{- end }}
{{- end }}
{{- if .Values.config.sandboxes.sandboxHost.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-lease" (include "langsmith.sandboxes.sandboxHostDeploymentName" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  # The elected host reads its own Deployment every reconcile to pick up the
  # autoscale annotations, and patches replicas / pod deletion cost when
  # config.sandboxes.sandboxHost.autoscaling.enabled is true.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "langsmith.sandboxes.sandboxHostDeploymentName" . | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-lease" (include "langsmith.sandboxes.sandboxHostDeploymentName" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.config.sandboxes.sandboxHost.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-lease" (include "langsmith.sandboxes.sandboxHostDeploymentName" .) | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
