{{- if and .Values.sandboxes.enabled (not .Values.sandboxes.external.enabled) .Values.sandboxes.sandboxHost.rbac.create }}
{{- $rbac := .Values.sandboxes.sandboxHost.rbac }}
{{- include "langsmithSandbox.render.rbac" (dict
  "name" (printf "%s-%s" (include "langsmith.fullname" .) .Values.sandboxes.sandboxHost.name)
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (mergeOverwrite (include "langsmith.labels" . | fromYaml) (default dict $rbac.labels))
  "annotations" (mergeOverwrite (include "langsmith.annotations" . | fromYaml) (default dict $rbac.annotations))
  "serviceAccountName" (include "langsmith.sandboxes.sandboxHostServiceAccountName" .)) }}
{{- end }}
