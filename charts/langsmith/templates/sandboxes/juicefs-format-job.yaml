{{- if .Values.sandboxes.enabled }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $juicefsFormatJob := .Values.sandboxes.juicefsFormatJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "langsmith.sandboxes.juicefsFormatJobName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    app.kubernetes.io/component: juicefs-format
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with $juicefsFormatJob.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      {{- with $juicefsFormatJob.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "langsmith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: juicefs-format
        {{- with $juicefsFormatJob.labels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "langsmith.sandboxes.sandboxHostServiceAccountName" . }}
      restartPolicy: Never
      securityContext:
        {{- include "langsmith.podSecurityContext" (dict "Values" .Values "componentSecurityContext" $juicefsFormatJob.podSecurityContext) | nindent 8 }}
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.sandboxes.sandboxHost.deployment.nodeSelector $juicefsFormatJob.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $juicefsFormatJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.sandboxes.sandboxHost.deployment.tolerations $juicefsFormatJob.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: juicefs-format
          image: {{ include "langsmith.image" (dict "Values" .Values "Chart" .Chart "component" "sandboxHostImage") | quote }}
          imagePullPolicy: {{ .Values.images.sandboxHostImage.pullPolicy }}
          command:
            - /opt/sandbox-host/bin/sandbox-host
          args:
            - --internal-juicefs-format
          env:
            {{- include "langsmith.sandboxes.juicefsFormatJobEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml $juicefsFormatJob.securityContext | nindent 12 }}
          resources:
            {{- toYaml $juicefsFormatJob.resources | nindent 12 }}
          volumeMounts:
            - name: juicefs-config
              mountPath: /run/secrets/juicefs
              readOnly: true
      volumes:
        - name: juicefs-config
          secret:
            secretName: {{ include "langsmith.sandboxes.juicefsConfigSecretName" . }}
            defaultMode: 0400
{{- end }}
