{{- if and .Values.sandboxes.enabled (eq .Values.sandboxes.deploymentMode "sameCluster") }}
{{- $juicefsFormatJob := .Values.sandboxes.juicefsFormatJob }}
{{- include "langsmithSandbox.render.formatJob" (dict
  "name" (include "langsmith.sandboxes.juicefsFormatJobName" .)
  "namespace" (.Values.namespace | default .Release.Namespace)
  "labels" (mergeOverwrite (include "langsmith.labels" . | fromYaml) (dict "app.kubernetes.io/component" "juicefs-format"))
  "annotations" (mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "-1") (include "langsmith.annotations" . | fromYaml) (default dict $juicefsFormatJob.annotations))
  "podAnnotations" $juicefsFormatJob.annotations
  "podLabels" (mergeOverwrite (include "langsmith.selectorLabels" . | fromYaml) (dict "app.kubernetes.io/component" "juicefs-format") (default dict $juicefsFormatJob.labels))
  "serviceAccountName" (include "langsmith.sandboxes.sandboxHostServiceAccountName" .)
  "hostNetwork" false
  "dnsConfig" ""
  "podSecurityContext" (include "langsmith.podSecurityContext" (dict "Values" .Values "componentSecurityContext" $juicefsFormatJob.podSecurityContext))
  "image" (include "langsmith.image" (dict "Values" .Values "Chart" .Chart "component" "sandboxHostImage"))
  "pullPolicy" .Values.images.sandboxHostImage.pullPolicy
  "pullSecrets" .Values.images.imagePullSecrets
  "env" (include "langsmith.sandboxes.juicefsFormatJobEnv" .)
  "extraVolumeMounts" (include "langsmith.tlsVolumeMounts" . | fromYamlArray)
  "extraVolumes" (include "langsmith.tlsVolumes" . | fromYamlArray)
  "juicefsConfigSecretName" (include "langsmith.sandboxes.juicefsConfigSecretName" .)
  "job" $juicefsFormatJob
  "sandboxHost" .Values.sandboxes.sandboxHost) }}
{{- end }}
