{{- if and .Values.clickhouse.enabled (not .Values.clickhouse.external.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "langsmith.fullname" . }}-{{ .Values.clickhouse.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-2"
    {{- include "langsmith.annotations" . | nindent 4 }}
data:
  users.xml: |
    <clickhouse>
        <users>
            <{{ .Values.clickhouse.external.user }}>
                <access_management>1</access_management>
                <named_collection_control>1</named_collection_control>
                <show_named_collections>1</show_named_collections>
                <show_named_collections_secrets>1</show_named_collections_secrets>
                <profile>default</profile>
            </{{ .Values.clickhouse.external.user }}>
        </users>
        <profiles>
            <default>
                <async_insert>1</async_insert>
                <async_insert_max_data_size>2000000</async_insert_max_data_size>
                <wait_for_async_insert>0</wait_for_async_insert>
                <parallel_view_processing>1</parallel_view_processing>
                <materialize_ttl_after_modify>0</materialize_ttl_after_modify>
                <wait_for_async_insert_timeout>25</wait_for_async_insert_timeout>
                <lightweight_deletes_sync>0</lightweight_deletes_sync>
                <allow_materialized_view_with_bad_select>1</allow_materialized_view_with_bad_select>
                {{- if not .Values.clickhouse.config.allowSimdjson }}
                <allow_simdjson>0</allow_simdjson>
                {{- end }}
            </default>
        </profiles>
    </clickhouse>

  logging_config.xml: |
    <clickhouse>
        <logger>
          <level>{{ .Values.clickhouse.config.logLevel }}</level>

          <!-- This logs to files -->
          <log>/var/log/clickhouse-server/clickhouse.log</log>
          <errorlog>/var/log/clickhouse-server/clickhouse.err.log</errorlog>
          
          <!-- This logs to stdout/stderr -->
          <console>true</console>

          <!-- This rotates the log file every 1000M and keeps up to 10 files -->
          <size>1000M</size>
          <count>10</count>
      </logger>
    </clickhouse>

  metrics_config.xml: |
    <clickhouse>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>{{ .Values.clickhouse.metrics.port }}</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
        <errors>true</errors>
      </prometheus>
    </clickhouse>
{{- if .Values.clickhouse.config.systemLogTtlDays }}

  system_logs.xml: |
    <clickhouse>
      {{- /* ClickHouse never expires its own log tables by default, so they grow
             without bound until they fill the volume. */}}
      {{- range $log := list "asynchronous_insert_log" "asynchronous_metric_log" "backup_log" "background_schedule_pool_log" "blob_storage_log" "error_log" "latency_log" "metric_log" "part_log" "processors_profile_log" "query_log" "query_metric_log" "query_thread_log" "query_views_log" "text_log" "trace_log" }}
      <{{ $log }}>
        <ttl>event_date + INTERVAL {{ $.Values.clickhouse.config.systemLogTtlDays }} DAY DELETE</ttl>
      </{{ $log }}>
      {{- end }}
      {{- /* opentelemetry_span_log has no event_date column; it dates on finish_date. */}}
      <opentelemetry_span_log>
        <ttl>finish_date + INTERVAL {{ .Values.clickhouse.config.systemLogTtlDays }} DAY DELETE</ttl>
      </opentelemetry_span_log>
    </clickhouse>
{{- end }}
{{- end }}
