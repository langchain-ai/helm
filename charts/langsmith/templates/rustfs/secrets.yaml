{{- if and (eq (include "langsmith.blobStorage.bundled" .) "true") (not .Values.rustfs.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "langsmith.rustfsSecretsName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-2"
    {{- include "langsmith.annotations" . | nindent 4 }}
data:
  {{ .Values.rustfs.accessKeySecretKey }}: {{ .Values.rustfs.accessKey | b64enc | quote }}
  {{ .Values.rustfs.secretKeySecretKey }}: {{ .Values.rustfs.secretKey | b64enc | quote }}
{{- end }}
