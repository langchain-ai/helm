{{- if and (eq (include "langsmith.blobStorage.bundled" .) "true") (not .Values.rustfs.existingSecretName) }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $secretName := include "langsmith.rustfsSecretsName" . }}
{{- /*
With no secretKey set: keep the key from an earlier install, or derive one from config.apiKeySalt so that renders
without cluster access (helm template, Argo CD) produce the same key every time. Only when neither is available
(config.existingSecretName holds the salt) is the key random.
*/}}
{{- $secretKey := .Values.rustfs.secretKey }}
{{- if not $secretKey }}
{{- $existing := lookup "v1" "Secret" $namespace $secretName | default dict }}
{{- $secretKey = dig "data" .Values.rustfs.secretKeySecretKey "" $existing | b64dec }}
{{- end }}
{{- if and (not $secretKey) .Values.config.apiKeySalt }}
{{- $secretKey = printf "langsmith-rustfs-secret-key:%s" .Values.config.apiKeySalt | sha256sum | trunc 40 }}
{{- end }}
{{- if not $secretKey }}
{{- $secretKey = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-2"
    {{- include "langsmith.annotations" . | nindent 4 }}
data:
  {{ .Values.rustfs.accessKeySecretKey }}: {{ .Values.rustfs.accessKey | b64enc | quote }}
  {{ .Values.rustfs.secretKeySecretKey }}: {{ $secretKey | b64enc | quote }}
{{- end }}
