{{- if .Values.smithdb.enabled }}
{{- range $component := list "mutations" "runRules" "statsQuery" }}
{{ $componentValues := index $.Values.smithdb $component }}
{{- if and $componentValues.enabled $componentValues.autoscaling.hpa.enabled }}
{{- $componentName := include "langsmith.smithdb.componentName" (dict "root" $ "component" $component) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $componentName }}
  namespace: {{ $.Values.namespace | default $.Release.Namespace }}
  labels:
    {{- include "langsmith.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $componentName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $componentName }}
  minReplicas: {{ $componentValues.autoscaling.hpa.minReplicas }}
  maxReplicas: {{ $componentValues.autoscaling.hpa.maxReplicas }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $componentValues.autoscaling.hpa.scaleUpStabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ $componentValues.autoscaling.hpa.scalePodCount }}
          periodSeconds: {{ $componentValues.autoscaling.hpa.scaleUpStabilizationWindowSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ $componentValues.autoscaling.hpa.scaleDownStabilizationWindowSeconds }}
      policies:
        - type: Pods
          value: {{ $componentValues.autoscaling.hpa.scalePodCount }}
          periodSeconds: {{ $componentValues.autoscaling.hpa.scaleDownStabilizationWindowSeconds }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $componentValues.autoscaling.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
