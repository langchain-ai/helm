{{- if and (eq (include "langsmith.fleet.agentAccessTokenEnabled" .) "true") .Values.platformBackend.rbac.create }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $name := include "langsmith.platformBackend.podTokenReviewName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- include "langsmith.platformBackend.podTokenReviewMetadata" . | nindent 2 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- nonResourceURLs:
  - /openid/v1/jwks
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  {{- include "langsmith.platformBackend.podTokenReviewMetadata" . | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platformBackend.serviceAccountName" . }}
    namespace: {{ $namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ $namespace }}
  {{- include "langsmith.platformBackend.podTokenReviewMetadata" . | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ $namespace }}
  {{- include "langsmith.platformBackend.podTokenReviewMetadata" . | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platformBackend.serviceAccountName" . }}
    namespace: {{ $namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
