{{- if and (eq (include "langsmith.fleet.agentAccessTokenEnabled" .) "true") .Values.platformBackend.rbac.create }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $name := printf "%s-%s-pod-token-review" $namespace (include "langsmith.fullname" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.platformBackend.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.platformBackend.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- nonResourceURLs:
  - /openid/v1/jwks
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "langsmith.labels" . | nindent 4 }}
    {{- with .Values.platformBackend.rbac.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "langsmith.annotations" . | nindent 4 }}
    {{- with .Values.platformBackend.rbac.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "platformBackend.serviceAccountName" . }}
    namespace: {{ $namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
