{{- /*
================================================================================
CONFIGURATION VALIDATION
================================================================================

This template validates configuration and prevents deployment when:
1. Deprecated values are detected
2. Invalid or conflicting configuration is present
3. Required values are missing or malformed

This template intentionally does not render any Kubernetes resources.
It only performs validation checks and fails template rendering if issues are found.

Set config.skipValidation to true to skip all validation checks (e.g. for
AWS Marketplace Helm template verification).
================================================================================
*/}}

{{- /* Data mode flags are template predicates, so require real booleans even when optional validation is skipped. */ -}}
{{- if not (kindIs "bool" .Values.clickhouse.enabled) -}}
{{- fail "clickhouse.enabled must be a boolean. Do not quote true or false." -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.smithdb.langsmith.ingestion.enabled) -}}
{{- fail "smithdb.langsmith.ingestion.enabled must be a boolean. Do not quote true or false." -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.smithdb.langsmith.migration.enabled) -}}
{{- fail "smithdb.langsmith.migration.enabled must be a boolean. Do not quote true or false." -}}
{{- end -}}
{{- if not (kindIs "bool" .Values.smithdb.langsmith.query.enabled) -}}
{{- fail "smithdb.langsmith.query.enabled must be a boolean. Do not quote true or false." -}}
{{- end -}}
{{- if not (has .Values.smithdb.resourceTier (list "small" "medium" "large")) -}}
{{- fail "smithdb.resourceTier must be one of: small, medium, large." -}}
{{- end -}}
{{- if not .Values.config.skipValidation -}}

{{- /* Validate deprecated fleet server value keys */ -}}
{{- if hasKey .Values "agentBuilderToolServer" -}}
{{- fail "agentBuilderToolServer is deprecated. Please use fleetToolServer." -}}
{{- end -}}
{{- if hasKey .Values "agentBuilderTriggerServer" -}}
{{- fail "agentBuilderTriggerServer is deprecated. Please use fleetTriggerServer." -}}
{{- end -}}
{{- /* Removed: the bundled agent-bootstrap Job (backend.agentBootstrap). Standalone fleet/insights/polly deployments replace it. */ -}}
{{- if hasKey .Values.backend "agentBootstrap" -}}
{{- fail "backend.agentBootstrap has been removed: the bundled agent-bootstrap Job is no longer part of this chart. Standalone agents now run as the top-level fleet / insights / polly deployments. If you were relying on the bundled bootstrap, contact LangChain support for migration guidance, then remove backend.agentBootstrap from your values." -}}
{{- end -}}
{{- /* Moved: Engine and Insights share one deployment, so its config lives in engineInsightsAgent. */ -}}
{{- range $key := list "namePrefix" "apiServer" "queue" "postgres" "redis" -}}
{{- if hasKey $.Values.insights $key -}}
{{- fail (printf "insights.%s has moved to engineInsightsAgent.%s: Engine and Insights now run on one shared deployment, so its scaling, database and resource settings live in the engineInsightsAgent block. Move insights.%s to engineInsightsAgent.%s. insights.enabled and insights.encryptionKey stay where they are." $key $key $key $key) -}}
{{- end -}}
{{- end -}}
{{- range $key := list "insightsAgentImage" "insightsEngineImage" -}}
{{- if hasKey $.Values.images $key -}}
{{- fail (printf "images.%s has moved to images.engineInsightsAgentImage: Engine and Insights run on one image. Set images.engineInsightsAgentImage instead." $key) -}}
{{- end -}}
{{- end -}}
{{- /* The tag arm matches the AWS Marketplace layout, where every image shares
       one repo and the name moves into the tag. */ -}}
{{- $engineInsightsImage := .Values.images.engineInsightsAgentImage -}}
{{- if not (or (contains "insights-engine" $engineInsightsImage.repository) (hasPrefix "langsmith-insights-engine-" ($engineInsightsImage.tag | default ""))) -}}
{{- fail (printf "images.engineInsightsAgentImage.repository is %q: Insights and Engine run on the combined langsmith-insights-engine image, which serves both the `insights` and `engine` graphs. langsmith-clio is no longer supported. Point it at langsmith-insights-engine (or your mirror of it)." $engineInsightsImage.repository) -}}
{{- end -}}
{{- /* Deprecated image keys: these workloads now run on the single consolidated backend image */ -}}
{{- range $key := list "hostBackendImage" "platformBackendImage" "playgroundImage" "fleetToolServerImage" "fleetTriggerServerImage" "agentBuilderToolServerImage" "agentBuilderTriggerServerImage" -}}
{{- if hasKey $.Values.images $key -}}
{{- fail (printf "images.%s is deprecated: this workload now runs on the consolidated backend image. Configure images.backendImage instead (and mirror only that image)." $key) -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.smithdb.langsmith "dualIngest" -}}
{{- $legacySmithdbDualIngest := get .Values.smithdb.langsmith "dualIngest" -}}
{{- if eq (lower (toString (get $legacySmithdbDualIngest "enabled"))) "true" -}}
{{- fail "smithdb.langsmith.dualIngest.enabled is no longer supported. Use smithdb.langsmith.ingestion.enabled." -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.smithdb.langsmith "frontend" -}}
{{- $legacySmithdbFrontend := get .Values.smithdb.langsmith "frontend" -}}
{{- if eq (lower (toString (get $legacySmithdbFrontend "useSmithDBEndpoints"))) "true" -}}
{{- fail "smithdb.langsmith.frontend.useSmithDBEndpoints is no longer supported. Use smithdb.langsmith.query.enabled." -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.smithdb.langsmith "lsmBackfill" -}}
{{- $legacySmithdbLsmBackfill := get .Values.smithdb.langsmith "lsmBackfill" -}}
{{- if eq (lower (toString (get $legacySmithdbLsmBackfill "enabled"))) "true" -}}
{{- fail "smithdb.langsmith.lsmBackfill.enabled is no longer supported. Remove it and follow the SmithDB migration guidance for this chart version." -}}
{{- end -}}
{{- end -}}

{{- /* Validate ingress configuration */ -}}
# Fail if none of ingress, gateway, or istioGateway are enabled and LangSmith Deployment is enabled with the chart-managed frontend
{{- if and .Values.frontend.enabled (not .Values.ingress.enabled) (not .Values.gateway.enabled) (not .Values.istioGateway.enabled) .Values.config.deployment.enabled }}
{{- fail "Either ingress, gateway, or istioGateway must be enabled if LangSmith Deployments is enabled." -}}
{{- end -}}

{{- /* Validate frontend configuration */ -}}
# Fail if frontend is disabled while a chart-managed frontend route is enabled
{{- if not .Values.frontend.enabled }}
{{- if or .Values.ingress.enabled .Values.gateway.enabled -}}
{{- fail "frontend.enabled must be true when ingress or gateway is enabled. These resources route traffic to the frontend service." -}}
{{- end -}}
{{- end -}}

# Fail if Istio + LangSmith Deployments + basePath is set without a distinct deployments base path
{{- if and .Values.istioGateway.enabled .Values.frontend.enabled .Values.config.deployment.enabled .Values.config.basePath -}}
  {{- if or (not .Values.config.deployment.basePath) (eq .Values.config.deployment.basePath .Values.config.basePath) -}}
{{- fail "When istioGateway is enabled with LangSmith Deployments and config.basePath is set, you must set config.deployment.basePath to a different value to avoid overlapping VirtualService prefixes. Istio does not deterministically guarantee longest-prefix routing across multiple VirtualServices." -}}
  {{- end -}}
{{- end -}}

# Fail if hostname is missing when deployment is enabled
{{- if and .Values.config.deployment.enabled (not .Values.config.hostname) }}
{{- fail "config.hostname is required when LangSmith Deployments is enabled." -}}
{{- end -}}

# Fail if rootDomain is missing when deployment is enabled
{{- if .Values.config.deployment.rootDomain }}
{{- fail "config.rootDomain is deprecated. Please use config.hostname" -}}
{{- end -}}

# Fail if more than one ingress type is enabled
{{- $enabledCount := 0 -}}
{{- if .Values.ingress.enabled }}{{ $enabledCount = add1 $enabledCount }}{{- end -}}
{{- if .Values.gateway.enabled }}{{ $enabledCount = add1 $enabledCount }}{{- end -}}
{{- if .Values.istioGateway.enabled }}{{ $enabledCount = add1 $enabledCount }}{{- end -}}
{{- if gt $enabledCount 1 -}}
{{- fail "Only one of ingress, gateway, or istioGateway can be enabled at the same time." -}}
{{- end -}}
{{- /* Validate authentication configuration */ -}}
{{- if and .Values.config.basicAuth.enabled .Values.config.oauth.enabled -}}
{{- fail "Basic auth and OAuth are both enabled. Please enable only one." -}}
{{- end -}}

{{- /* Validate langsmithLicenseKey and apikeysalt are set */ -}}
{{- if not .Values.config.existingSecretName -}}
{{- if not .Values.config.apiKeySalt -}}
{{- fail "config.apiKeySalt is required. This may have previously been set to your license key by default. Set this value to the license key to avoid invalidating existing API Keys. This can alternatively be set within .Values.config.existingSecretName." -}}
{{- end -}}
{{- if not .Values.config.langsmithLicenseKey -}}
{{- fail "config.langsmithLicenseKey is required.  This can alternatively be set within .Values.config.existingSecretName." -}}
{{- end -}}
{{- end -}}

{{- if and (not .Values.config.basicAuth.enabled) (not .Values.config.oauth.enabled) -}}
{{- fail "Neither Basic auth nor OAuth are enabled. Please enable one of them." -}}
{{- end -}}
{{- if and (ne .Values.config.authType "mixed") (ne .Values.config.authType "oauth") -}}
{{- fail "config.authType must be either 'mixed' or 'oauth'." -}}
{{- end -}}
{{- if and (.Values.config.basicAuth.enabled) (ne .Values.config.authType "mixed") -}}
{{- fail "Basic auth is enabled but config.authType is not set to 'mixed'." -}}
{{- end -}}

{{- /* Validate initial org admin email */ -}}
{{- if or .Values.config.basicAuth.enabled -}}
{{- if not (or .Values.config.initialOrgAdminEmail .Values.config.basicAuth.initialOrgAdminEmail) -}}
{{- fail "initialOrgAdminEmail is required if basic auth is enabled. Please set config.initialOrgAdminEmail." -}}
{{- end -}}
{{- end -}}

{{- /* Validate custom cert */ -}}
{{- if .Values.config.customCa.secretName -}}
{{- if not .Values.config.customCa.secretKey -}}
{{- fail "config.customCa.secretKey is required when config.customCa.secretName is set." -}}
{{- end -}}
{{- end -}}

{{- /* Validate redis cluster configuration */ -}}
{{- if .Values.redis.external.cluster.enabled -}}
{{- if not .Values.redis.external.enabled -}}
{{- fail "redis.external.enabled must be true when redis.external.cluster.enabled is true." -}}
{{- end -}}
{{- end -}}

{{- /* Validate sandbox configuration */ -}}
{{- if .Values.sandboxes.enabled -}}
{{- $deploymentMode := .Values.sandboxes.deploymentMode | default "sameCluster" -}}
{{- if not (or (eq $deploymentMode "sameCluster") (eq $deploymentMode "separateCluster")) -}}
{{- fail "sandboxes.deploymentMode must be one of sameCluster or separateCluster." -}}
{{- end -}}
{{- if and (eq $deploymentMode "separateCluster") (not .Values.config.hostname) -}}
{{- fail "config.hostname is required when sandboxes.deploymentMode is separateCluster so sandbox-host can reach the LangSmith API." -}}
{{- end -}}
{{- if and (eq $deploymentMode "separateCluster") (regexMatch "^(?:[a-zA-Z][a-zA-Z0-9+.-]*://)?(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]+)?(?:/.*)?$" .Values.config.hostname) -}}
{{- fail "config.hostname must be externally reachable when sandboxes.deploymentMode is separateCluster." -}}
{{- end -}}
{{- if and (eq $deploymentMode "separateCluster") (regexMatch "\\.svc(\\.[a-zA-Z0-9.-]+)?(:[0-9]+)?(/.*)?$" .Values.config.hostname) -}}
{{- fail "config.hostname must not be an in-cluster service address when sandboxes.deploymentMode is separateCluster." -}}
{{- end -}}
{{- $hostIngressEndpoint := .Values.sandboxes.hostIngressEndpoint | default "" -}}
{{- if and $hostIngressEndpoint (not (regexMatch "^https?://[^/?#]+$" $hostIngressEndpoint)) -}}
{{- fail "sandboxes.hostIngressEndpoint must be an http(s) origin without a path, query string, or fragment." -}}
{{- end -}}
{{- $serviceUrlBaseUrl := .Values.sandboxes.serviceUrlBaseUrl | default "" -}}
{{- if $serviceUrlBaseUrl -}}
{{- if not (regexMatch "^https?://" $serviceUrlBaseUrl) -}}
{{- fail "sandboxes.serviceUrlBaseUrl must start with http:// or https://." -}}
{{- end -}}
{{- if not (regexMatch "^https?://[^/?#]+$" $serviceUrlBaseUrl) -}}
{{- fail "sandboxes.serviceUrlBaseUrl must not include a path, query string, or fragment." -}}
{{- end -}}
{{- $serviceUrlHost := regexReplaceAll "^https?://" $serviceUrlBaseUrl "" -}}
{{- if and .Values.ingress.enabled (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $serviceUrlHost)) -}}
{{- fail "sandboxes.serviceUrlBaseUrl host must be a DNS hostname without a port when ingress.enabled is true." -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.config.existingSecretName) (not .Values.config.disableSecretCreation) (not .Values.sandboxes.callbackSigningJwk) -}}
{{- fail "sandboxes.callbackSigningJwk is required when sandboxes.enabled is true and the chart manages the LangSmith app Secret. When config.existingSecretName is set, add key sandbox_callback_signing_jwk to the existing Secret instead." -}}
{{- end -}}
{{- if and .Values.config.existingSecretName .Values.sandboxes.callbackSigningJwk -}}
{{- fail "sandboxes.callbackSigningJwk cannot be used when config.existingSecretName is set. Add key sandbox_callback_signing_jwk to the existing Secret instead." -}}
{{- end -}}
{{- if eq $deploymentMode "sameCluster" -}}
{{- if not .Values.images.sandboxHostImage.repository -}}
{{- fail "images.sandboxHostImage.repository is required when sandboxes.enabled is true." -}}
{{- end -}}
{{- if not .Values.images.sandboxHostImage.tag -}}
{{- fail "images.sandboxHostImage.tag is required when sandboxes.enabled is true." -}}
{{- end -}}
{{- /* The host needs netns, iptables and mount propagation. Fail here, not at CrashLoop. */ -}}
{{- if and (hasKey .Values.sandboxes.sandboxHost.deployment.securityContext "privileged") (not .Values.sandboxes.sandboxHost.deployment.securityContext.privileged) -}}
{{- fail "sandboxes.sandboxHost.deployment.securityContext.privileged must be true: sandbox-host manages microVMs, network namespaces and mounts." -}}
{{- end -}}
{{- if .Values.sandboxes.sandboxHost.deployment.securityContext.readOnlyRootFilesystem -}}
{{- fail "sandboxes.sandboxHost.deployment.securityContext.readOnlyRootFilesystem must not be true: sandbox-host unpacks the guest tools image on startup." -}}
{{- end -}}
{{- if not .Values.sandboxes.sandboxHost.deployment.nodeSelector -}}
{{- fail "sandboxes.sandboxHost.deployment.nodeSelector is required when sandboxes.enabled is true: sandbox-host must be pinned to KVM-capable nodes, and its toleration alone does not attract it there." -}}
{{- end -}}
{{- $autoscaling := .Values.sandboxes.sandboxHost.autoscaling -}}
{{- if $autoscaling.enabled -}}
{{- if lt (int $autoscaling.minReplicas) 1 -}}
{{- fail "sandboxes.sandboxHost.autoscaling.minReplicas must be at least 1." -}}
{{- end -}}
{{- if lt (int $autoscaling.maxReplicas) (int $autoscaling.minReplicas) -}}
{{- fail "sandboxes.sandboxHost.autoscaling.maxReplicas must be greater than or equal to minReplicas." -}}
{{- end -}}
{{- end -}}
{{- $juicefs := .Values.sandboxes.juicefs | default dict -}}
{{- if not $juicefs.existingSecretName -}}
{{- $juicefsRedis := .Values.sandboxes.juicefs.redis | default dict -}}
{{- if not $juicefsRedis.metaURL -}}
{{- fail "sandboxes.juicefs.redis.metaURL is required when sandboxes.enabled is true and sandboxes.juicefs.existingSecretName is not set." -}}
{{- end -}}
{{- $juicefsName := .Values.sandboxes.juicefs.name | default "" -}}
{{- if not $juicefsName -}}
{{- fail "sandboxes.juicefs.name is required when sandboxes.enabled is true and sandboxes.juicefs.existingSecretName is not set." -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" $juicefsName) -}}
{{- fail "sandboxes.juicefs.name must be a DNS-label-style JuiceFS volume name: 3-63 characters, lowercase letters, numbers, and hyphens only. Do not use slashes or object-store subpaths here." -}}
{{- end -}}
{{- if not .Values.sandboxes.juicefs.bucket -}}
{{- fail "sandboxes.juicefs.bucket is required when sandboxes.enabled is true and sandboxes.juicefs.existingSecretName is not set." -}}
{{- end -}}
{{- $juicefsStorage := .Values.sandboxes.juicefs.storage | default "" -}}
{{- $juicefsBucket := .Values.sandboxes.juicefs.bucket | default "" -}}
{{- if not (or (eq $juicefsStorage "s3") (eq $juicefsStorage "gs") (eq $juicefsStorage "wasb")) -}}
{{- fail "sandboxes.juicefs.storage supports only s3 for AWS/EKS, gs for GCP/GKE, and wasb for Azure/AKS." -}}
{{- end -}}
{{- if and (eq $juicefsStorage "wasb") (not .Values.sandboxes.juicefs.storageAccountName) -}}
{{- fail "sandboxes.juicefs.storageAccountName is required when sandboxes.juicefs.storage is wasb." -}}
{{- end -}}
{{- if and (eq $juicefsStorage "s3") (hasPrefix "s3://" $juicefsBucket) -}}
{{- fail "sandboxes.juicefs.bucket must use a region-explicit S3 endpoint URL such as https://bucket-name.s3.us-west-2.amazonaws.com when sandboxes.juicefs.storage is s3. The s3://bucket shorthand makes JuiceFS infer region with GetBucketLocation and is not supported." -}}
{{- end -}}
{{- if and (eq $juicefsStorage "s3") (not (regexMatch "^https?://" $juicefsBucket)) -}}
{{- fail "sandboxes.juicefs.bucket must use an HTTP(S) S3 endpoint URL when sandboxes.juicefs.storage is s3." -}}
{{- end -}}
{{- end -}}
{{- $hostMount := .Values.sandboxes.juicefs.hostMount -}}
{{- if not $hostMount.cacheDirs -}}
{{- fail "sandboxes.juicefs.hostMount.cacheDirs must contain at least one node host path when sandboxes.enabled is true." -}}
{{- end -}}
{{- $cacheDirsSeen := dict -}}
{{- range $cacheDir := $hostMount.cacheDirs -}}
{{- if not (kindIs "string" $cacheDir) -}}
{{- fail "sandboxes.juicefs.hostMount.cacheDirs entries must be strings." -}}
{{- end -}}
{{- if or (eq $cacheDir "/") (not (hasPrefix "/" $cacheDir)) -}}
{{- fail (printf "sandboxes.juicefs.hostMount.cacheDirs entry %q must be an absolute path other than /." $cacheDir) -}}
{{- end -}}
{{- if ne (clean $cacheDir) $cacheDir -}}
{{- fail (printf "sandboxes.juicefs.hostMount.cacheDirs entry %q must be a normalized path without dot segments, parent traversal, repeated separators, or a trailing slash." $cacheDir) -}}
{{- end -}}
{{- if contains ":" $cacheDir -}}
{{- fail (printf "sandboxes.juicefs.hostMount.cacheDirs entry %q must not contain ':' because JuiceFS uses it as the cache directory separator." $cacheDir) -}}
{{- end -}}
{{- if hasKey $cacheDirsSeen $cacheDir -}}
{{- fail (printf "sandboxes.juicefs.hostMount.cacheDirs contains duplicate path %q." $cacheDir) -}}
{{- end -}}
{{- $_ := set $cacheDirsSeen $cacheDir true -}}
{{- end -}}
{{- range $mountOption := $hostMount.mountOptions -}}
{{- if regexMatch "^--cache-dir($|=)" $mountOption -}}
{{- fail "sandboxes.juicefs.hostMount.mountOptions must not set --cache-dir; configure sandboxes.juicefs.hostMount.cacheDirs instead." -}}
{{- end -}}
{{- end -}}
{{- $proxyCaMode := .Values.sandboxes.proxyCa.mode -}}
{{- if not (or (eq $proxyCaMode "generatedSecret") (eq $proxyCaMode "existingSecret")) -}}
{{- fail "sandboxes.proxyCa.mode must be one of generatedSecret or existingSecret." -}}
{{- end -}}
{{- if and (eq $proxyCaMode "existingSecret") (not .Values.sandboxes.proxyCa.existingSecretName) -}}
{{- fail "sandboxes.proxyCa.existingSecretName is required when sandboxes.proxyCa.mode is existingSecret." -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Validate password requirements */ -}}
{{- if and .Values.config.basicAuth.enabled (not .Values.config.existingSecretName) }}
{{- $password := .Values.config.basicAuth.initialOrgAdminPassword -}}
{{- if lt (len $password) 12 -}}
{{- fail "Admin password must be at least 12 characters long" -}}
{{- end -}}
{{- if not (regexMatch "[a-z]" $password) -}}
{{- fail "Admin password must contain at least one lowercase letter" -}}
{{- end -}}
{{- if not (regexMatch "[A-Z]" $password) -}}
{{- fail "Admin password must contain at least one uppercase letter" -}}
{{- end -}}
{{- if not (regexMatch `[!#$%()+,./:?@\[\]\\^_{~}-]` $password) -}}
{{- fail "Admin password must contain at least one symbol from: !#$%()+,-./:?@[\\]^_{~}" -}}
{{- end -}}
{{- end }}

{{- /* Validate operator/listener configuration */ -}}
{{- $hasListenerTemplates := and (hasKey .Values "listener") (hasKey .Values.listener "templates") (not (empty .Values.listener.templates)) -}}
{{- if $hasListenerTemplates -}}
{{- fail "templates have moved to the operator. Please move your values from .Values.listener.templates to .Values.operator.templates." -}}
{{- end -}}

{{- /* Validate breaking changes from v12+ */ -}}
{{- if hasKey .Values.config "langgraphPlatform" }}
{{- fail "As of v12, config.langgraphPlatform has been moved to config.deployment. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.config.deployment "langgraphPlatformLicenseKey" }}
{{- fail "As of v12, langgraphPlatform no longer needs a dedicated license key. You can remove this value." }}
{{- end }}

{{- if hasKey .Values.config "subdomain" }}
{{- fail "As of v12, istioGateway.subdomain has been moved to istioGateway.basePath. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.ingress "hostname" }}
{{- fail "As of v12, ingress.hostname has been moved to config.hostname. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.ingress "subdomain" }}
{{- fail "As of v12, ingress.subdomain has been moved to config.basePath. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.gateway "hostname" }}
{{- fail "As of v12, gateway.hostname has been moved to config.hostname. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.gateway "subdomain" }}
{{- fail "As of v12, gateway.subdomain has been moved to config.basePath. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.istioGateway "hostname" }}
{{- fail "As of v12, istioGateway.hostname has been moved to config.hostname. Please update your values.yaml file." }}
{{- end }}

{{- if hasKey .Values.istioGateway "subdomain" }}
{{- fail "As of v12, istioGateway.subdomain has been moved to config.basePath. Please update your values.yaml file." }}
{{- end }}

{{- if and .Values.config.observability.tracing.enabled (not .Values.config.observability.tracing.endpoint) -}}
{{- fail "When tracing is enabled (config.observability.tracing.enabled=true), config.observability.tracing.endpoint must be provided" -}}
{{- end -}}

{{- if and .Values.config.blobStorage.enabled (not .Values.config.blobStorage.engine) -}}
{{- fail "When blob storage is enabled (config.blobStorage.enabled=true), config.blobStorage.engine must be one of [S3, GCS, Azure]" -}}
{{- end -}}

{{- if and .Values.config.blobStorage.enabled (not (or (eq .Values.config.blobStorage.engine "S3") (eq .Values.config.blobStorage.engine "s3") (eq .Values.config.blobStorage.engine "GCS") (eq .Values.config.blobStorage.engine "gcs") (eq .Values.config.blobStorage.engine "Azure") (eq .Values.config.blobStorage.engine "azure"))) -}}
{{- fail "When blob storage is enabled (config.blobStorage.enabled=true), config.blobStorage.engine must be one of [S3, GCS, Azure]" -}}
{{- end -}}

{{- /* Validate postgres mTLS configuration */ -}}
{{- if and .Values.postgres.external.clientCert.secretName (not .Values.postgres.external.customTls) -}}
{{- fail "postgres.external.customTls must be true when postgres.external.clientCert.secretName is set." -}}
{{- end -}}

{{- /* Validate clickhouse mTLS configuration */ -}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.external.clientCert.secretName (not .Values.clickhouse.external.existingSecretName) (not .Values.clickhouse.external.tls) -}}
{{- fail "clickhouse.external.tls must be true when clickhouse.external.clientCert.secretName is set and the value is not being fetched from an existing secret." -}}
{{- end -}}
{{- if and (not .Values.clickhouse.enabled) .Values.clickhouse.external.enabled -}}
{{- fail "clickhouse.external.enabled must be false when clickhouse.enabled is false." -}}
{{- end -}}

{{- /* Validate SmithDB configuration */ -}}
{{- if .Values.smithdb.enabled -}}
{{- if .Values.smithdb.commonInitContainers -}}
{{- range $index, $initContainer := .Values.smithdb.commonInitContainers -}}
{{- if not (kindIs "map" $initContainer) -}}
{{- fail (printf "smithdb.commonInitContainers[%d] must be a container object." $index) -}}
{{- end -}}
{{- if not (get $initContainer "name") -}}
{{- fail (printf "smithdb.commonInitContainers[%d].name is required." $index) -}}
{{- end -}}
{{- if not (get $initContainer "image") -}}
{{- fail (printf "smithdb.commonInitContainers[%d].image is required." $index) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.smithdb.config.existingSecretName -}}
{{- fail "smithdb.config.existingSecretName is required when smithdb.enabled is true." -}}
{{- end -}}
{{- range $keyName := list "hostSecretKey" "databaseSecretKey" "usernameSecretKey" -}}
{{- $keyValue := get $.Values.smithdb.config.metastore $keyName -}}
{{- if not $keyValue -}}
{{- fail (printf "smithdb.config.metastore.%s is required when smithdb.enabled is true." $keyName) -}}
{{- end -}}
{{- end -}}
{{- $iamAuthProvider := .Values.smithdb.config.metastore.iamAuthProvider -}}
{{- if and (not .Values.smithdb.config.metastore.passwordSecretKey) (not $iamAuthProvider) -}}
{{- fail "smithdb.config.metastore.passwordSecretKey is required when smithdb.enabled is true unless smithdb.config.metastore.iamAuthProvider is set." -}}
{{- end -}}
{{- if and $iamAuthProvider (not .Values.smithdb.config.metastore.useSsl) -}}
{{- fail "smithdb.config.metastore.useSsl must be true when smithdb.config.metastore.iamAuthProvider is set." -}}
{{- end -}}
{{- $objectStoreType := lower .Values.smithdb.config.objectStore.type -}}
{{- if not (or (eq $objectStoreType "s3") (eq $objectStoreType "gcs")) -}}
{{- fail "smithdb.config.objectStore.type must be one of [s3, gcs]." -}}
{{- end -}}
{{- if not .Values.smithdb.config.objectStore.bucket -}}
{{- fail "smithdb.config.objectStore.bucket is required when smithdb.enabled is true." -}}
{{- end -}}
{{- $smithdbWorkloads := dict
  "query" .Values.smithdb.query
  "mutations" .Values.smithdb.mutations
  "runRules" .Values.smithdb.runRules
  "statsQuery" .Values.smithdb.statsQuery
  "ingestion" .Values.smithdb.ingestion
  "compaction" .Values.smithdb.compaction
  "compactionWorker" .Values.smithdb.compactionWorker
  "clusterManager" .Values.smithdb.clusterManager
-}}
{{- range $workloadName, $workload := $smithdbWorkloads -}}
{{- if and $.Values.smithdb.enabled (dig "enabled" true $workload) (lt (int $workload.deployment.replicas) 1) -}}
{{- fail (printf "smithdb.%s.deployment.replicas must be greater than 0 when smithdb.enabled is true." $workloadName) -}}
{{- end -}}
{{- end -}}
{{- if .Values.smithdb.langsmith.migration.enabled -}}
{{- if lt (int .Values.smithdb.ingestion.deployment.replicas) 1 -}}
{{- fail "smithdb.ingestion.deployment.replicas must be greater than 0 when smithdb.langsmith.migration.enabled is true." -}}
{{- end -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.migration.enabled (not .Values.smithdb.langsmith.ingestion.enabled) -}}
{{- fail "smithdb.langsmith.ingestion.enabled must be true when smithdb.langsmith.migration.enabled is true." -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.migration.enabled (not .Values.clickhouse.enabled) -}}
{{- fail "clickhouse.enabled must be true when smithdb.langsmith.migration.enabled is true." -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.migration.enabled (not .Values.smithdb.migration.taskdb.postgres.enabled) -}}
{{- fail "smithdb.migration.taskdb.postgres.enabled must be true when smithdb.langsmith.migration.enabled is true." -}}
{{- end -}}
{{- $taskdb := .Values.smithdb.migration.taskdb.postgres -}}
{{- if and .Values.smithdb.langsmith.migration.enabled $taskdb.enabled -}}
{{- if lt (int .Values.smithdb.migration.job.parallelism) 1 -}}
{{- fail "smithdb.migration.job.parallelism must be greater than 0 when smithdb migration is enabled." -}}
{{- end -}}
{{- if lt (int $taskdb.maxConnectionsPerMigrationPod) 1 -}}
{{- fail "smithdb.migration.taskdb.postgres.maxConnectionsPerMigrationPod must be greater than 0." -}}
{{- end -}}
{{- if $taskdb.external.enabled -}}
{{- if not $taskdb.external.port -}}
{{- fail "smithdb.migration.taskdb.postgres.external.port is required when smithdb.migration.taskdb.postgres.external.enabled is true." -}}
{{- end -}}
{{- if $taskdb.external.existingSecretName -}}
{{- range $keyName := list "hostSecretKey" "databaseSecretKey" "usernameSecretKey" "passwordSecretKey" -}}
{{- $keyValue := get $taskdb.external $keyName -}}
{{- if not $keyValue -}}
{{- fail (printf "smithdb.migration.taskdb.postgres.external.%s is required when smithdb.migration.taskdb.postgres.external.existingSecretName is set." $keyName) -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- range $keyName := list "host" "database" "username" "password" -}}
{{- $keyValue := get $taskdb.external $keyName -}}
{{- if not $keyValue -}}
{{- fail (printf "smithdb.migration.taskdb.postgres.external.%s is required when smithdb.migration.taskdb.postgres.external.enabled is true and external.existingSecretName is not set." $keyName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- if not $taskdb.auth.passwordSecretKey -}}
{{- fail "smithdb.migration.taskdb.postgres.auth.passwordSecretKey is required when smithdb.migration.taskdb.postgres.enabled is true." -}}
{{- end -}}
{{- if and (not $taskdb.auth.existingSecretName) (not $taskdb.auth.password) -}}
{{- fail "smithdb.migration.taskdb.postgres.auth.password is required when smithdb.migration.taskdb.postgres.enabled is true and auth.existingSecretName is not set." -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $smithdbServiceWorkloads := dict
  "query" .Values.smithdb.query
  "mutations" .Values.smithdb.mutations
  "runRules" .Values.smithdb.runRules
  "statsQuery" .Values.smithdb.statsQuery
  "ingestion" .Values.smithdb.ingestion
  "compaction" .Values.smithdb.compaction
  "clusterManager" .Values.smithdb.clusterManager
-}}
{{- range $workloadName, $workload := $smithdbServiceWorkloads -}}
{{- if and $.Values.smithdb.enabled (dig "enabled" true $workload) $workload.service.type (ne $workload.service.type "ClusterIP") -}}
{{- fail (printf "smithdb.%s.service.type must be ClusterIP." $workloadName) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.smithdb.enabled (ne (toString .Values.smithdb.compactionWorker.maxConcurrentJobs) "") (lt (int .Values.smithdb.compactionWorker.maxConcurrentJobs) 1) -}}
{{- fail "smithdb.compactionWorker.maxConcurrentJobs must be greater than 0 when set." -}}
{{- end -}}
{{- $cwAutoscaling := .Values.smithdb.compactionWorker.autoscaling -}}
{{- $legacyCompactionWorkerAutoscalingKeys := list "enabled" "minReplicas" "maxReplicas" "targetCPUUtilizationPercentage" "scaleUpStabilizationWindowSeconds" "scaleDownStabilizationWindowSeconds" "scalePodCount" "createHpa" "type" -}}
{{- range $legacyCompactionWorkerAutoscalingKeys -}}
{{- if and $.Values.smithdb.enabled (hasKey $cwAutoscaling .) -}}
{{- fail (printf "smithdb.compactionWorker.autoscaling.%s is no longer supported. Use autoscaling.hpa.* for chart-managed HPA or autoscaling.keda.* for KEDA; only one scaler can be enabled at a time." .) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.smithdb.enabled $cwAutoscaling.hpa.enabled (dig "keda" "enabled" false $cwAutoscaling) -}}
{{- fail "Only one of smithdb.compactionWorker.autoscaling.hpa.enabled or smithdb.compactionWorker.autoscaling.keda.enabled can be enabled at the same time." -}}
{{- end -}}
{{- $legacySmithdbHpaAutoscalingKeys := list "enabled" "minReplicas" "maxReplicas" "targetCPUUtilizationPercentage" "scaleUpStabilizationWindowSeconds" "scaleDownStabilizationWindowSeconds" "scalePodCount" "createHpa" "type" -}}
{{- $smithdbHpaAutoscalingWorkloads := dict
  "query" .Values.smithdb.query
  "mutations" .Values.smithdb.mutations
  "runRules" .Values.smithdb.runRules
  "statsQuery" .Values.smithdb.statsQuery
  "ingestion" .Values.smithdb.ingestion
-}}
{{- range $workloadName, $workload := $smithdbHpaAutoscalingWorkloads -}}
{{- $autoscaling := dig "autoscaling" (dict) $workload -}}
{{- range $legacySmithdbHpaAutoscalingKeys -}}
{{- if and $.Values.smithdb.enabled (hasKey $autoscaling .) -}}
{{- fail (printf "smithdb.%s.autoscaling.%s is no longer supported. Use autoscaling.hpa.enabled with hpa.minReplicas, hpa.maxReplicas, and related hpa.* fields." $workloadName .) -}}
{{- end -}}
{{- end -}}
{{- $hpa := dig "hpa" (dict) $autoscaling -}}
{{- if and $.Values.smithdb.enabled (dig "enabled" true $workload) (dig "enabled" false $hpa) -}}
{{- if lt (int $hpa.minReplicas) 1 -}}
{{- fail (printf "smithdb.%s.autoscaling.hpa.minReplicas must be greater than 0 when autoscaling.hpa.enabled is true." $workloadName) -}}
{{- end -}}
{{- if lt (int $hpa.maxReplicas) (int $hpa.minReplicas) -}}
{{- fail (printf "smithdb.%s.autoscaling.hpa.maxReplicas must be >= hpa.minReplicas when autoscaling.hpa.enabled is true." $workloadName) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.migration.enabled (not .Values.smithdb.enabled) -}}
{{- fail "smithdb.enabled must be true when smithdb.langsmith.migration.enabled is true." -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.ingestion.enabled (not .Values.smithdb.enabled) -}}
{{- fail "smithdb.enabled must be true when smithdb.langsmith.ingestion.enabled is true." -}}
{{- end -}}
{{- if and .Values.smithdb.langsmith.query.enabled (not .Values.smithdb.enabled) -}}
{{- fail "smithdb.enabled must be true when smithdb.langsmith.query.enabled is true." -}}
{{- end -}}
{{- if not (or .Values.clickhouse.enabled .Values.smithdb.langsmith.ingestion.enabled) -}}
{{- fail "At least one ingestion backend must be enabled: clickhouse.enabled or smithdb.langsmith.ingestion.enabled." -}}
{{- end -}}
{{- if not (or .Values.clickhouse.enabled .Values.smithdb.langsmith.query.enabled) -}}
{{- fail "At least one query backend must be enabled: clickhouse.enabled or smithdb.langsmith.query.enabled." -}}
{{- end -}}

{{- /* Validate agent builder configuration */ -}}
{{- if .Values.config.agentBuilder.enabled -}}
{{- if and (not .Values.config.agentBuilder.encryptionKey) (not .Values.config.existingSecretName) -}}
{{- fail "config.agentBuilder.encryptionKey is required when Agent Builder is enabled. Generate one with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"" -}}
{{- end -}}
{{- if not .Values.config.deployment.enabled -}}
{{- fail "config.deployment.enabled must be true when agentBuilder is enabled. Agent Builder requires LangSmith Deployments." -}}
{{- end -}}
{{- end -}}

{{- /* The bundled-agent bootstrap path was removed for Insights and Polly.
       Reject any presence of config.insights / config.polly and direct
       users at the top-level insights / polly blocks. */ -}}
{{- if hasKey .Values.config "insights" -}}
{{- fail "config.insights is no longer supported (the bundled-agent bootstrap path was removed in chart 0.15.1). Use the top-level insights block: insights.enabled, insights.encryptionKey, etc." -}}
{{- end -}}
{{- if hasKey .Values.config "polly" -}}
{{- fail "config.polly is no longer supported (the bundled-agent bootstrap path was removed in chart 0.15.1). Use the top-level polly block: polly.enabled, polly.encryptionKey, etc." -}}
{{- end -}}

{{- /* Validate autoscaling configuration for all services */ -}}
{{- $autoscalingServices := dict
  "aceBackend" .Values.aceBackend.autoscaling
  "backend" .Values.backend.autoscaling
  "frontend" .Values.frontend.autoscaling
  "hostBackend" .Values.hostBackend.autoscaling
  "listener" .Values.listener.autoscaling
  "platformBackend" .Values.platformBackend.autoscaling
  "playground" .Values.playground.autoscaling
  "queue" .Values.queue.autoscaling
  "ingestQueue" .Values.ingestQueue.autoscaling
-}}
{{- range $serviceName, $autoscaling := $autoscalingServices -}}
{{- /* Validate that both HPA and KEDA are not enabled at the same time */ -}}
{{- if and $autoscaling.hpa.enabled $autoscaling.keda.enabled -}}
{{- fail (printf "Only one of %s.autoscaling.hpa.enabled or %s.autoscaling.keda.enabled can be enabled at the same time." $serviceName $serviceName) -}}
{{- end -}}
{{- /* Validate deprecated autoscaling values */ -}}
{{- if hasKey $autoscaling "createHpa" -}}
{{- fail (printf "%s.autoscaling.createHpa is deprecated. Please use %s.autoscaling.hpa.enabled and/or %s.autoscaling.keda.enabled instead." $serviceName $serviceName $serviceName) -}}
{{- end -}}
{{- if hasKey $autoscaling "type" -}}
{{- fail (printf "%s.autoscaling.type is deprecated. Please use %s.autoscaling.hpa.enabled and/or %s.autoscaling.keda.enabled instead." $serviceName $serviceName $serviceName) -}}
{{- end -}}
{{- if hasKey $autoscaling "enabled" -}}
{{- fail (printf "%s.autoscaling.enabled is deprecated. Please use %s.autoscaling.hpa.enabled and/or %s.autoscaling.keda.enabled instead." $serviceName $serviceName $serviceName) -}}
{{- end -}}
{{- end -}}

{{- end -}}{{- /* end skipValidation */ -}}

{{- /* Engine (co-hosted Insights+Engine) requires config when enabled. */ -}}
{{- if .Values.engine.enabled }}
{{- if and (not .Values.engine.encryptionKey) (not .Values.config.existingSecretName) }}
{{- fail "engine.encryptionKey is required when engine.enabled is true (must match smith-go's ISSUES_AGENT_ENCRYPTION_KEY). Generate one with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\" (not needed if config.existingSecretName has engine_encryption_key)." }}
{{- end }}
{{- if not .Values.engine.intelligenceBaseUrl }}
{{- fail "engine.intelligenceBaseUrl is required when engine.enabled is true: the self-hosted Engine has no ANTHROPIC_API_KEY and routes model calls through the LSI gateway for its cloud/region (e.g. AWS: https://beacon.aws.langchain.com/intelligence)." }}
{{- end }}
{{- if not .Values.sandboxes.enabled }}
{{- fail "engine.enabled is true but sandboxes.enabled is false: every Engine run executes in a sandbox, so Engine cannot run without them." }}
{{- end }}
{{- if not .Values.config.hostname }}
{{- fail "engine.enabled is true but config.hostname is not set: the sandbox runs the langsmith CLI against an externally reachable LangSmith URL, which is derived from it." }}
{{- end }}
{{- if regexMatch "^(?:[a-zA-Z][a-zA-Z0-9+.-]*://)?(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]+)?(?:/.*)?$" .Values.config.hostname }}
{{- fail (printf "engine.enabled is true and config.hostname is %q, which a sandbox cannot reach: it must be the externally reachable LangSmith address." .Values.config.hostname) }}
{{- end }}
{{- if regexMatch "\\.svc(\\.[a-zA-Z0-9.-]+)?(:[0-9]+)?(/.*)?$" .Values.config.hostname }}
{{- fail (printf "engine.enabled is true and config.hostname is the in-cluster address %q, which a sandbox cannot reach: it must be the externally reachable LangSmith address." .Values.config.hostname) }}
{{- end }}
{{- end }}

{{- /* Validate agent feature (fleet/insights/polly) configuration */ -}}
{{- $anyAgentEnabled := or .Values.fleet.enabled .Values.insights.enabled .Values.polly.enabled }}
{{- $allPgUrls := list }}
{{- /* Include the main LangSmith postgres URL if determinable */ -}}
{{- if and .Values.postgres.external.enabled (not .Values.postgres.external.existingSecretName) }}
{{- $mainPg := "" }}
{{- if .Values.postgres.external.connectionUrl }}
{{- $mainPg = trimAll " " .Values.postgres.external.connectionUrl }}
{{- else if .Values.postgres.external.host }}
{{- $mainPg = printf "postgres://%s:%s@%s:%s/%s?sslmode=disable" .Values.postgres.external.user .Values.postgres.external.password .Values.postgres.external.host (toString .Values.postgres.external.port) .Values.postgres.external.database }}
{{- end }}
{{- if $mainPg }}
{{- $allPgUrls = append $allPgUrls $mainPg }}
{{- end }}
{{- end }}
{{- $agentPairs := list
  (dict "n" "fleet" "cfg" "fleet" "on" $.Values.fleet.enabled)
  (dict "n" "insights" "cfg" "engineInsightsAgent" "on" (or $.Values.insights.enabled $.Values.engine.enabled))
  (dict "n" "polly" "cfg" "polly" "on" $.Values.polly.enabled) }}
{{- range $pair := $agentPairs }}
{{- $fn := index $pair "n" }}
{{- $prod := index $.Values $fn }}
{{- $feat := index $.Values (index $pair "cfg") }}
{{- range $database := list "postgres" "redis" }}
{{- $databaseConfig := index $feat $database }}
{{- $provider := $databaseConfig.external.iamProvider }}
{{- if and $provider (not (has $provider (list "azure" "gcp" "aws"))) }}
{{- fail (printf "%s.%s.external.iamProvider must be one of [azure, gcp, aws]" (index $pair "cfg") $database) }}
{{- end }}
{{- end }}
{{- if $prod.enabled }}
{{- if and (not $prod.encryptionKey) (not $.Values.config.existingSecretName) }}
{{- fail (printf "%s.encryptionKey is required when %s.enabled is true (not needed if config.existingSecretName is set with the key already present)" $fn $fn) }}
{{- end }}
{{- end }}
{{- if index $pair "on" }}
{{- if $feat.postgres.external.enabled }}
{{- if not $feat.postgres.external.existingSecretName }}
{{- $pg := "" }}
{{- if $feat.postgres.external.connectionUrl }}
{{- $pg = trimAll " " $feat.postgres.external.connectionUrl }}
{{- else if not $feat.postgres.external.host }}
{{- fail (printf "%s.postgres.external.host or connectionUrl or existingSecretName is required when %s.postgres.external.enabled is true" $fn $fn) }}
{{- else }}
{{- $pg = printf "postgres://%s:%s@%s:%s/%s?sslmode=disable" $feat.postgres.external.user $feat.postgres.external.password $feat.postgres.external.host (toString $feat.postgres.external.port) $feat.postgres.external.database }}
{{- end }}
{{- if $pg }}
{{- $allPgUrls = append $allPgUrls $pg }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (gt (len $allPgUrls) 0) (ne (len $allPgUrls) (len (uniq $allPgUrls))) }}
{{- fail "All postgres connection URLs (langsmith, fleet, insights, polly) must be unique. Duplicate URLs were detected." }}
{{- end }}

{{- /* Validate per-agent redis configuration */ -}}
{{- range $pair := $agentPairs }}
{{- $fn := index $pair "n" }}
{{- $feat := index $.Values (index $pair "cfg") }}
{{- if index $pair "on" }}
{{- if $feat.redis.external.enabled }}
{{- if and (not $feat.redis.external.connectionUrl) (not $feat.redis.external.existingSecretName) }}
{{- fail (printf "%s.redis.external.connectionUrl or %s.redis.external.existingSecretName is required when %s.redis.external.enabled is true" $fn $fn $fn) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
