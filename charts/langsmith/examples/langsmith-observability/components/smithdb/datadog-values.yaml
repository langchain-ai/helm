# Datadog Autodiscovery annotations for SmithDB, the LangSmith ingest queue, and platform-backend.
# Apply alongside your LangSmith values: helm upgrade ... -f values.yaml -f datadog-values.yaml
# The dashboard in datadog-dashboard.json expects these exact check settings.

smithdb:
  query:
    deployment:
      annotations:
        ad.datadoghq.com/query.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8060/metrics",
                  "metrics": [".*"],
                  "namespace": "smithdb",
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }
  ingestion:
    deployment:
      annotations:
        ad.datadoghq.com/ingestion.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8050/metrics",
                  "metrics": [".*"],
                  "namespace": "smithdb",
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }
  compaction:
    deployment:
      annotations:
        ad.datadoghq.com/compaction.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8070/metrics",
                  "metrics": [".*"],
                  "namespace": "smithdb",
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }
  compactionWorker:
    deployment:
      annotations:
        ad.datadoghq.com/compaction-worker.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:9000/metrics",
                  "metrics": [".*"],
                  "namespace": "smithdb",
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }
  clusterManager:
    deployment:
      annotations:
        ad.datadoghq.com/cluster-manager.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8090/metrics",
                  "metrics": [".*"],
                  "namespace": "smithdb",
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }

ingestQueue:
  deployment:
    annotations:
      ad.datadoghq.com/ingest-queue.checks: |
        {
          "openmetrics": {
            "init_config": {},
            "instances": [
              {
                "openmetrics_endpoint": "http://%%host%%:1989/metrics",
                "metrics": ["langsmith_ingestion_.*_latency_seconds"],
                "histogram_buckets_as_distributions": true,
                "collect_counters_with_distributions": true
              }
            ]
          }
        }

platformBackend:
  deployment:
    annotations:
      ad.datadoghq.com/platform-backend.checks: |
        {
          "openmetrics": {
            "init_config": {},
            "instances": [
              {
                "openmetrics_endpoint": "http://%%host%%:1986/metrics",
                "metrics": ["langsmith_asynq_ingestion_queue_pending"]
              }
            ]
          }
        }
