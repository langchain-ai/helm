# Datadog Autodiscovery annotations for the Engine tab.
# Apply after your LangSmith values, and after the SmithDB values if you use them:
#   helm upgrade ... -f values.yaml [-f ../smithdb/datadog-values.yaml] -f datadog-values.yaml
# Helm replaces each annotation's value rather than merging it, so the
# platformBackend and ingestQueue checks below include the SmithDB metrics.
# Layering this file after the SmithDB values keeps both tabs working.
#
# Also add this entry to your own engineInsightsAgent.queue.deployment.extraEnv
# list. It is not set here because Helm would replace your existing list:
#   - name: EXPOSE_INTERNAL_METRICS_PROMETHEUS
#     value: "true"
# Without it the queue serves only worker and queue-depth metrics, and the run
# outcome and latency panels stay empty.

engineInsightsAgent:
  queue:
    deployment:
      annotations:
        ad.datadoghq.com/queue.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:8000/metrics",
                  "metrics": ["lg_api_.*"],
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }

# Scan outcomes, issue filing and usage reports.
platformBackend:
  deployment:
    annotations:
      ad.datadoghq.com/platform-backend.checks: |
        {
          "openmetrics": {
            "init_config": {},
            "instances": [
              {
                "openmetrics_endpoint": "http://%%host%%:1986/metrics",
                "metrics": [
                  "langsmith_asynq_ingestion_queue_pending",
                  "langsmith_issues_agent_.*",
                  "langsmith_engine_.*"
                ]
              }
            ]
          }
        }

# Scan dispatch skips, run callback backlog, usage aggregation and upload.
ingestQueue:
  deployment:
    annotations:
      ad.datadoghq.com/ingest-queue.checks: |
        {
          "openmetrics": {
            "init_config": {},
            "instances": [
              {
                "openmetrics_endpoint": "http://%%host%%:1989/metrics",
                "metrics": [
                  "langsmith_ingestion_.*_latency_seconds",
                  "langsmith_issues_agent_.*",
                  "langsmith_engine_.*"
                ],
                "histogram_buckets_as_distributions": true,
                "collect_counters_with_distributions": true
              }
            ]
          }
        }
