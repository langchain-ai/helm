suite: Pod ServiceAccount token automount configuration
templates:
  - operator/config-map.yaml
  - listener/deployment.yaml
  - operator/deployment.yaml
  - redis/stateful-set.yaml
tests:
  - it: configures token automount on workloads using external ServiceAccounts
    set:
      listener.serviceAccount.create: false
      listener.serviceAccount.name: listener
      listener.serviceAccount.automountServiceAccountToken: false
      operator.serviceAccount.create: false
      operator.serviceAccount.name: operator
      operator.serviceAccount.automountServiceAccountToken: false
      redis.serviceAccount.create: false
      redis.serviceAccount.name: redis
      redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: listener/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: operator/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: redis/stateful-set.yaml
