suite: ServiceAccount token automount configuration
templates:
  - listener/service-account.yaml
  - operator/service-account.yaml
  - redis/service-account.yaml
tests:
  - it: configures the listener ServiceAccount
    template: listener/service-account.yaml
    set:
      listener.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: configures the operator ServiceAccount
    template: operator/service-account.yaml
    set:
      operator.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: configures the Redis ServiceAccount
    template: redis/service-account.yaml
    set:
      redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
