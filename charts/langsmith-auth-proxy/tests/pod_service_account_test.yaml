suite: Pod ServiceAccount token automount configuration
templates:
  - auth-proxy/config-map.yaml
  - auth-proxy/deployment.yaml
values:
  - common-values.yaml
tests:
  - it: configures token automount on the workload using an external ServiceAccount
    set:
      authProxy.serviceAccount.create: false
      authProxy.serviceAccount.name: auth-proxy
      authProxy.serviceAccount.automountServiceAccountToken: false
    template: auth-proxy/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
