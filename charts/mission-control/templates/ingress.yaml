{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "missionControl.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "missionControl.labels" . | nindent 4 }}
  {{- $ingressAnnotations := merge (.Values.ingress.annotations | default dict) (.Values.commonAnnotations | default dict) }}
  {{- if $ingressAnnotations }}
  annotations:
    {{- toYaml $ingressAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "missionControl.frontendDeploymentName" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
