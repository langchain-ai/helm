suite: Pod ServiceAccount token automount configuration
templates:
  - backend/statefulset.yaml
tests:
  - it: configures token automount on the workload using an external ServiceAccount
    set:
      backend.serviceAccount.create: false
      backend.serviceAccount.name: backend
      backend.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
