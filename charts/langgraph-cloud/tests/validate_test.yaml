suite: Validation guards (config.skipValidation)
templates:
  - ingress.yaml
  - api-server/deployment.yaml
  - api-server/service.yaml
tests:
  - it: should fail when more than one ingress mechanism is enabled
    template: ingress.yaml
    set:
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
      ingress.enabled: true
      ingress.hostname: api.example.com
      gateway.enabled: true
      gateway.name: my-gateway
    asserts:
      - failedTemplate:
          errorMessage: "Only one of ingress, gateway, or istioGateway can be enabled at the same time."

  - it: should bypass the ingress mutual-exclusion guard when skipValidation is true
    template: ingress.yaml
    set:
      config.skipValidation: true
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
      ingress.enabled: true
      ingress.hostname: api.example.com
      gateway.enabled: true
      gateway.name: my-gateway
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: should fail when ingress is enabled without a hostname
    template: ingress.yaml
    set:
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
      ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "ingress.hostname must be set when ingress.enabled=true"

  - it: should bypass the ingress hostname guard when skipValidation is true
    template: ingress.yaml
    set:
      config.skipValidation: true
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress

  - it: should fail when gateway is enabled without a name
    template: ingress.yaml
    set:
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
      gateway.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gateway.name must be set when gateway.enabled=true"

  - it: should fail when mongo.external.enabled without mongo.enabled
    template: api-server/deployment.yaml
    set:
      mongo.enabled: false
      mongo.external.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mongo.external.enabled requires mongo.enabled=true"

  - it: should bypass the MongoDB configuration guard when skipValidation is true
    template: api-server/deployment.yaml
    set:
      config.skipValidation: true
      mongo.enabled: false
      mongo.external.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: should keep the unauthenticated API internal by default
    template: api-server/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should reject unauthenticated LoadBalancer exposure
    template: api-server/deployment.yaml
    set:
      apiServer.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject unauthenticated NodePort exposure
    template: api-server/deployment.yaml
    set:
      apiServer.service.type: NodePort
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject unauthenticated ingress exposure
    template: api-server/deployment.yaml
    set:
      ingress.enabled: true
      ingress.hostname: api.example.com
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject unauthenticated gateway exposure
    template: api-server/deployment.yaml
    set:
      gateway.enabled: true
      gateway.name: gateway
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject unauthenticated Istio exposure
    template: api-server/deployment.yaml
    set:
      istioGateway.enabled: true
      istioGateway.name: gateway
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject unauthenticated validation bypass exposure
    template: api-server/deployment.yaml
    set:
      config.skipValidation: true
      apiServer.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.enabled=true; use a ClusterIP service without ingress for unauthenticated internal access."

  - it: should reject incomplete external authentication configuration
    template: api-server/deployment.yaml
    set:
      apiServer.service.type: LoadBalancer
      config.auth.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "External API exposure requires config.auth.langSmithAuthEndpoint and config.auth.langSmithTenantId."

  - it: should allow an authenticated external API
    template: api-server/deployment.yaml
    set:
      apiServer.service.type: LoadBalancer
      config.auth.enabled: true
      config.auth.langSmithAuthEndpoint: https://api.smith.langchain.com
      config.auth.langSmithTenantId: test-tenant
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LANGGRAPH_AUTH_TYPE
            value: langsmith
