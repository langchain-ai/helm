suite: PostgreSQL connection Secret
templates:
  - postgres/secrets.yaml
tests:
  - it: leaves TLS to the client default for an external database set by separate fields
    set:
      postgres.external.enabled: true
      postgres.external.host: db.example.com
      postgres.external.user: app
      postgres.external.password: s3cret
      postgres.external.database: langgraph
    asserts:
      - equal:
          path: data.postgres_connection_url
          value: postgres://app:s3cret@db.example.com:5432/langgraph
          decodeBase64: true

  - it: keeps a full external connection URL unchanged
    set:
      postgres.external.enabled: true
      postgres.external.connectionUrl: postgres://app:s3cret@db.example.com:5432/langgraph?sslmode=verify-full
    asserts:
      - equal:
          path: data.postgres_connection_url
          value: postgres://app:s3cret@db.example.com:5432/langgraph?sslmode=verify-full
          decodeBase64: true

  # The bundled instance serves no certificate, so TLS stays off for it.
  - it: disables TLS for the bundled database
    release:
      namespace: agents
    asserts:
      - equal:
          path: data.postgres_connection_url
          value: postgres://postgres:postgres@RELEASE-NAME-langgraph-cloud-postgres.agents.svc.cluster.local:5432/postgres?sslmode=disable
          decodeBase64: true

  - it: renders no Secret when an existing one is named
    set:
      postgres.external.enabled: true
      postgres.external.existingSecretName: my-postgres
    asserts:
      - hasDocuments:
          count: 0
