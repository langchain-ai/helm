suite: Pod ServiceAccount token automount configuration
templates:
  - api-server/deployment.yaml
  - mongo/stateful-set.yaml
  - postgres/stateful-set.yaml
  - queue/deployment.yaml
  - redis/deployment.yaml
tests:
  - it: configures token automount on workloads using external ServiceAccounts
    set:
      apiServer.serviceAccount.create: false
      apiServer.serviceAccount.name: api-server
      apiServer.serviceAccount.automountServiceAccountToken: false
      postgres.serviceAccount.create: false
      postgres.serviceAccount.name: postgres
      postgres.serviceAccount.automountServiceAccountToken: false
      queue.enabled: true
      queue.serviceAccount.create: false
      queue.serviceAccount.name: queue
      queue.serviceAccount.automountServiceAccountToken: false
      redis.serviceAccount.create: false
      redis.serviceAccount.name: redis
      redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: api-server/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: postgres/stateful-set.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: queue/deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: redis/deployment.yaml

  - it: configures token automount on the bundled MongoDB workload
    template: mongo/stateful-set.yaml
    set:
      mongo.enabled: true
      mongo.statefulSet.automountServiceAccountToken: false
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
