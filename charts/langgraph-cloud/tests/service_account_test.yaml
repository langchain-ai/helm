suite: ServiceAccount token automount configuration
templates:
  - api-server/service-account.yaml
  - postgres/service-account.yaml
  - queue/service-account.yaml
  - redis/service-account.yaml
tests:
  - it: configures the API server ServiceAccount
    template: api-server/service-account.yaml
    set:
      apiServer.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: configures the PostgreSQL ServiceAccount
    template: postgres/service-account.yaml
    set:
      postgres.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: configures the queue ServiceAccount
    template: queue/service-account.yaml
    set:
      queue.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: configures the Redis ServiceAccount
    template: redis/service-account.yaml
    set:
      redis.serviceAccount.automountServiceAccountToken: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
