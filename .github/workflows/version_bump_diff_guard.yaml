name: Version Bump Diff Guard

# Open SWE auto-approves pull requests it judges to be a plain chart version
# bump. This independently, deterministically checks that judgment whenever
# its approval is the only one standing, instead of trusting it outright.
# It must stay re-evaluated as reviews change, not just on push, since a
# push can land before any review does.
#
# Uses pull_request_target, not pull_request: for pull_request, GitHub runs
# the workflow file itself from the PR, so a PR could edit these steps (or
# the checker they load) to make the check pass unconditionally.
# pull_request_target always runs the workflow and its steps from the base
# branch; the PR only ever supplies the diff being judged, read as data via
# git diff/show/status below, never as code that executes.
on:
  pull_request_target:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: version-bump-diff-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml
          curl -fsSL -o /tmp/helm-docs.tgz \
            https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xzf /tmp/helm-docs.tgz -C /tmp helm-docs
          sudo install /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Load the checker from base, then fetch PR head as data only
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp hack/check_version_bump_diff.py "$RUNNER_TEMP/version-bump-guard.py"
          git fetch origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"

      - name: Check the diff against Open SWE's approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$RUNNER_TEMP/version-bump-guard.py"
