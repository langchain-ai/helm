name: Approve release version bumps

on:
  workflow_run:
    workflows: [Lint and Test Charts]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'bot/appversion-bump-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Test release validation
        run: node --test .github/scripts/approve-release-bump.test.cjs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await require('./.github/scripts/approve-release-bump.cjs')({github, context, core});
