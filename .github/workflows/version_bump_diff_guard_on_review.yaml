name: Version Bump Diff Guard (review trigger)

# pull_request_review has no "_target" variant: GitHub always runs it from
# the PR's own workflow file, not the base branch's. So this file must stay
# trivially small and do nothing but re-trigger the real guard workflow,
# which only ever runs via pull_request_target and therefore always uses
# the base branch's own copy of the checker. If a PR edits *this* file to
# skip the dispatch, no fresh "guard" check gets reported for that review
# event at all, which fails a required check by absence rather than
# letting an edited workflow report a fake success.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'version_bump_diff_guard.yaml',
              ref: context.payload.pull_request.base.ref,
              inputs: { pr_number: String(context.payload.pull_request.number) },
            })
