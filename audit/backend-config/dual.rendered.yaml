data:
  nginx.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_ssl_server_name on;

    proxy_cache_path /tmp/server_cache levels=1:2 keys_zone=llm_cache:100m max_size=1g inactive=60 use_temp_path=off;

    log_format cache_log_json escape=json
    '{'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"time_local":"$time_local",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"cache_status":"$upstream_cache_status"'
    '}';

    server {
        listen       8080;
        listen  [::]:8080;

        server_name  localhost;
        client_max_body_size 25M;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        keepalive_timeout 75;

        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        access_log /dev/stdout cache_log_json;
        location / {
            root   /tmp/build;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location = /health {
                  # health checks are frequent and boring, so we avoid logging them
                  access_log off;
                  return 200;
        }

        # Restrict nginx status to localhost only (security)
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location = /.well-known/jwks.json {
            proxy_set_header Connection '';
