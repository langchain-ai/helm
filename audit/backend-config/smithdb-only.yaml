# smithdb-only backend config
clickhouse:
  enabled: false

smithdb:
  enabled: true
  langsmith:
    ingestion:
      enabled: true
    query:
      enabled: true
    migration:
      enabled: false
  config:
    existingSecretName: "smithdb-metastore"
    metastore:
      hostSecretKey: "host"
      databaseSecretKey: "database"
      usernameSecretKey: "username"
      passwordSecretKey: "password"
    objectStore:
      type: "s3"
      bucket: "smithdb-audit"
